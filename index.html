@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --blue-900:#122E45; --blue-800:#173C5A; --blue-700:#1E4870; --blue-500:#3572A0; --blue-100:#E7EFF6;
  --orange-600:#C9631A; --orange-500:#E2802E; --orange-100:#FCE7D4;
  --bg:#F2F5F9; --surface:#FFFFFF; --line:#E2E8F0; --text:#152233; --text-muted:#5C6B7C;
  --green:#268A54; --green-bg:#E4F5EC; --yellow:#C98A0F; --yellow-bg:#FBF0DA; --red:#C64236; --red-bg:#FBE7E5;
  --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(18,46,69,.04), 0 8px 24px -12px rgba(18,46,69,.14);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); overflow:hidden;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13px;}

/* ===== APP SHELL ===== */
.app{display:flex; height:100vh;}

/* Sidebar */
.sidebar{width:230px; background:var(--blue-900); color:#fff; display:flex; flex-direction:column; flex-shrink:0;}
.sidebar-head{display:flex; align-items:center; gap:10px; padding:20px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-head img{width:32px; height:32px;}
.sidebar-head .t1{font-family:'Sora',sans-serif; font-weight:800; font-size:13.5px;}
.sidebar-head .t2{font-size:9.5px; color:var(--orange-500); font-weight:700; letter-spacing:.08em;}
.nav{flex:1; overflow-y:auto; padding:12px 10px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; margin-bottom:2px;
  font-size:12.8px; font-weight:500; color:rgba(255,255,255,.68); cursor:pointer; border:none; background:none; width:100%; text-align:left;
}
.nav-item .ic{font-size:15px; width:18px; text-align:center;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--orange-500); color:#fff; font-weight:700;}
.sidebar-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,.08); font-size:10px; color:rgba(255,255,255,.4);}

/* Main */
.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  height:60px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:0 24px;
}
.topbar h2{font-family:'Sora',sans-serif; font-size:17px; font-weight:700; color:var(--blue-900);}
.role-switch{display:flex; align-items:center; gap:10px; min-width:0;}
.role-switch label{font-size:11px; color:var(--text-muted);}
.role-switch select{padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--text); font-weight:600; min-width:0;}
.content{flex:1; min-width:0; overflow-y:auto; overflow-x:hidden; padding:26px 28px;}

/* ===== Shared components ===== */
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
.kpi-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px;}
.kpi-card .label{font-size:12px; color:var(--text-muted); font-weight:500;}
.kpi-card .value{font-family:'Sora',sans-serif; font-size:21px; font-weight:700; color:var(--blue-900); margin-top:6px;}
.kpi-card .delta{font-size:11.5px; margin-top:5px; font-weight:600;}
.delta.up{color:var(--green);} .delta.warn{color:var(--yellow);} .delta.down{color:var(--red);}

.grid2{display:grid; grid-template-columns:1.35fr 1fr; gap:16px; min-width:0;}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; min-width:0;}
.panel h3{font-family:'Sora',sans-serif; font-size:14.5px; font-weight:700; color:var(--blue-900); margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
.panel h3 .tag{font-size:10.5px; font-weight:600; color:var(--text-muted); background:var(--blue-100); padding:3px 8px; border-radius:20px;}

.btn{font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--blue-800);}
.btn:hover{background:var(--blue-100);}
.btn.primary{background:var(--blue-700); color:#fff; border-color:var(--blue-700);}
.btn.primary:hover{background:var(--blue-800);}
.btn.orange{background:var(--orange-500); color:#fff; border-color:var(--orange-500);}
.btn.orange:hover{background:var(--orange-600);}
.btn.green{background:var(--green); color:#fff; border-color:var(--green);}
.btn.green:hover{background:#1f7345;}
.btn.sm{padding:5px 10px; font-size:11.5px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{text-align:left; font-size:11px; color:var(--text-muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
tbody td{padding:11px 10px; border-bottom:1px solid var(--line);}
tbody tr:last-child td{border-bottom:none;}
.stock-bar{width:70px; height:6px; background:var(--blue-100); border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px;}
.stock-bar>div{height:100%; background:var(--blue-500);}
.stock-bar.low>div{background:var(--red);}
.pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
.pill.ok{background:var(--green-bg); color:var(--green);}
.pill.low{background:var(--red-bg); color:var(--red);}
.pill.warn{background:var(--yellow-bg); color:var(--yellow);}

.pv-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.pv-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; position:relative;}
.pv-card .status-chip{position:absolute; top:14px; right:14px; font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--green-bg); color:var(--green);}
.pv-card h4{font-family:'Sora',sans-serif; font-size:15px; font-weight:700; color:var(--blue-900);}
.pv-card .loc{font-size:12px; color:var(--text-muted); margin-top:2px;}
.pv-card .resp{font-size:11.5px; color:var(--text-muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.pv-metrics{display:flex; gap:16px; margin-top:12px;}
.pv-metrics div{flex:1;}
.pv-metrics .l{font-size:10.5px; color:var(--text-muted);}
.pv-metrics .v{font-family:'Sora',sans-serif; font-size:14px; font-weight:700; margin-top:2px;}
.pv-postes{margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
.pv-postes-head{font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
.poste-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.poste-chip{display:inline-flex; align-items:center; gap:6px; background:var(--blue-100); color:var(--blue-800); font-size:11.5px; font-weight:600; padding:5px 6px 5px 10px; border-radius:20px;}
.poste-x{background:none; border:none; color:var(--blue-500); font-size:14px; line-height:1; padding:0 2px; border-radius:50%;}
.poste-x:hover{background:rgba(255,255,255,.6); color:var(--red);}
.empty-mini{font-size:11.5px; color:var(--text-muted); font-style:italic;}
.poste-add{display:flex; gap:8px; flex-wrap:wrap;}
.poste-add input{flex:1; min-width:120px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:12.5px;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px; min-width:0;}
.field label{font-size:11.5px; font-weight:600; color:var(--text-muted);}
.field input, .field select, .field textarea{padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; width:100%; min-width:0; box-sizing:border-box;}

.cmd-cols{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
.cmd-col h4{font-size:11.5px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.cmd-col .d{width:7px; height:7px; border-radius:50%; display:inline-block;}
.cmd-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:11.5px; margin-bottom:8px;}
.cmd-card .id{font-weight:700; color:var(--blue-900);}
.cmd-card .pt{color:var(--text-muted); font-size:10.5px; margin:2px 0 8px;}
.cmd-card select{width:100%; font-size:11px; padding:4px 6px;}

.invoice{background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; max-width:340px;}
.invoice-head{display:flex; align-items:center; gap:10px; border-bottom:1px dashed var(--line); padding-bottom:12px; margin-bottom:12px;}
.invoice-head img{width:34px; height:34px;}
.invoice-head .h1{font-family:'Sora',sans-serif; font-size:12.5px; font-weight:700; color:var(--blue-900);}
.invoice-head .h2{font-size:10.5px; color:var(--text-muted);}
.invoice-row{display:flex; justify-content:space-between; font-size:12px; padding:4px 0;}
.invoice-row.total{border-top:1px solid var(--line); margin-top:8px; padding-top:10px; font-weight:700; font-size:13.5px; color:var(--blue-900);}

.map-legend{display:flex; gap:16px; margin-top:10px; font-size:11px; color:var(--text-muted);}
.map-legend span{display:flex; align-items:center; gap:5px;}
.map-legend i{width:8px; height:8px; border-radius:50%; background:var(--orange-500); display:inline-block;}

/* Itinéraire de livraison — suivi client boutique */
.route-map{background:var(--blue-100); border-radius:var(--radius-sm); padding:14px 12px 10px; margin:14px 0;}
.route-map-title{font-size:12px; font-weight:700; color:var(--blue-900); margin-bottom:6px;}
.route-addr-row{display:flex; justify-content:space-between; gap:10px; font-size:11px; color:var(--text-muted); margin-top:2px;}
.route-addr-row span:last-child{max-width:60%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.route-progress-lbl{text-align:center; font-size:11.5px; font-weight:700; margin-top:6px;}

.filters{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.filters span{font-size:12px; padding:6px 13px; border-radius:20px; background:#fff; border:1px solid var(--line); color:var(--text-muted); cursor:pointer;}
.filters span.on{background:var(--blue-700); color:#fff; border-color:var(--blue-700); font-weight:600;}
.bars{display:flex; align-items:flex-end; gap:14px; height:150px; padding-top:10px;}
.bars .b{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;}
.bars .col{width:100%; background:linear-gradient(180deg, var(--blue-500), var(--blue-700)); border-radius:5px 5px 0 0;}
.bars .lb{font-size:10.5px; color:var(--text-muted);}

.empty{text-align:center; color:var(--text-muted); font-size:13px; padding:40px 0;}
.toast{
  position:fixed; bottom:22px; right:22px; background:var(--blue-900); color:#fff; padding:12px 18px;
  border-radius:10px; font-size:12.5px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px);
  transition:.25s; pointer-events:none; z-index:50;
}
.toast.show{opacity:1; transform:translateY(0);}

/* Cartes de livraison — lisibles d'un coup d'oeil sur mobile */
.livraison-list{display:flex; flex-direction:column; gap:12px;}
.livraison-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
.livraison-card .lv-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px;}
.livraison-card .lv-tracking{font-weight:700; color:var(--blue-900); font-size:14px;}
.livraison-card .lv-row{display:flex; align-items:flex-start; gap:8px; font-size:15px; color:var(--text); margin-bottom:6px; line-height:1.35;}
.livraison-card .lv-row .ic{flex-shrink:0; font-size:16px;}
.livraison-card .lv-row a{color:var(--blue-700); font-weight:600; text-decoration:none;}
.livraison-card .lv-empty-field{color:var(--text-muted); font-style:italic;}
.livraison-card .lv-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.livraison-card .lv-actions .btn{flex:1; min-width:130px; min-height:46px; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;}

.itineraire-overlay{position:fixed; inset:0; background:rgba(15,23,42,.6); z-index:9999; display:flex; align-items:center; justify-content:center; padding:14px;}
.itineraire-panel{background:#fff; border-radius:16px; width:100%; max-width:680px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden;}
.itineraire-head{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line);}
.itineraire-head .btn{min-height:44px; min-width:44px; font-size:16px;}
.itineraire-status{padding:9px 16px; font-size:13px;}
.itineraire-panel iframe{border:0; width:100%; flex:1; min-height:300px;}
.guidance-panel{margin:0 16px 12px; padding:14px 16px; border-radius:12px; background:linear-gradient(135deg, var(--blue-900), var(--blue-700)); color:#fff;}
.guidance-panel.guidance-arrived{background:var(--green-bg); color:var(--green); text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center;}
.guidance-panel .guidance-loading{font-size:13px; text-align:center;}
.guidance-top{display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; opacity:.85; text-transform:uppercase; letter-spacing:.02em;}
.guidance-live-dot{width:8px; height:8px; border-radius:50%; background:var(--orange-500); animation:guidance-pulse 1.4s ease-in-out infinite;}
@keyframes guidance-pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(1.3);}}
.guidance-instr{font-family:'Sora',sans-serif; font-size:16px; font-weight:700; margin-top:8px; line-height:1.35;}
.guidance-sub{font-size:12px; opacity:.85; margin-top:6px;}
.guidance-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.guidance-actions .btn{background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.22);}

@media (max-width:900px){
  .sidebar{width:64px;}
  .sidebar-head .t1,.sidebar-head .t2{display:none;}
  .nav-item span.lbl{display:none;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .grid2{grid-template-columns:1fr;}
  .pv-grid{grid-template-columns:1fr;}
  .cmd-cols{grid-template-columns:repeat(2,1fr);}
  .form-grid{grid-template-columns:1fr;}
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .table-wrap table{min-width:480px;}
  /* La topbar (titre + badge boutique + sélecteur de rôle) ne passait pas à la
     ligne sur petit écran et dépassait du cadre : on l'autorise à s'enrouler
     sur 2 lignes et on réduit les textes pour qu'elle tienne. */
  .topbar{flex-wrap:wrap; height:auto; min-height:56px; row-gap:6px; padding:10px 14px;}
  .topbar h2{font-size:14.5px;}
  .role-switch{flex-wrap:wrap; gap:6px; row-gap:6px;}
  .role-switch label{display:none;}
  .role-switch .btn.sm{padding:5px 9px; font-size:11px;}
  .role-switch select{padding:6px 8px; font-size:11.5px; max-width:120px;}
  .content{padding:16px 14px;}
  /* Idem pour toute rangée flex non prévue pour se comprimer (fiches produit du
     catalogue, lignes d'articles de facture…) : on autorise le retour à la
     ligne au lieu de laisser le contenu déborder hors de l'écran. */
  .content [style*="display:flex"]{flex-wrap:wrap;}
  /* Le graphique "Ventes par point de vente" affichait une seule barre visible
     quand il y a plusieurs points de vente : on le rend défilable horizontalement
     plutôt que de laisser les colonnes se tasser/déborder hors champ. */
  .bars{overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap !important;}
  .bars .b{flex:0 0 52px; min-width:52px;}
  .bars .lb{word-break:break-word; text-align:center;}
  .itineraire-overlay{padding:0;}
  .itineraire-panel{max-width:100%; max-height:100%; height:100%; border-radius:0;}
}

/* ===== BOUTIQUE CLIENT ===== */
.boutique-shell{height:100vh; display:flex; flex-direction:column; background:var(--bg);}
.boutique-topbar{
  background:linear-gradient(135deg, var(--blue-900), var(--blue-700));
  padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.boutique-brand{display:flex; align-items:center; gap:10px;}
.boutique-brand img{width:36px; height:36px;}
.boutique-brand .bb1{font-family:'Sora',sans-serif; font-weight:800; font-size:14px; color:#fff;}
.boutique-brand .bb2{font-size:10px; font-weight:700; color:var(--orange-500); letter-spacing:.08em;}
.boutique-nav{display:flex; gap:8px; flex-wrap:wrap;}
.boutique-nav .btn{background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.22); font-weight:700; padding:10px 15px; border-radius:999px; transition:transform .18s ease, background .18s ease, box-shadow .18s ease;}
.boutique-nav .btn:hover{background:rgba(255,255,255,.26); transform:translateY(-1px);}
.boutique-nav .btn .nav-ic{display:inline-block;}
.boutique-nav .btn.active{background:#fff; color:var(--blue-900); border-color:#fff; box-shadow:0 6px 16px rgba(0,0,0,.28); transform:scale(1.07); animation:nav-active-glow 1.8s ease-in-out infinite;}
.boutique-nav .btn.active .nav-ic{animation:nav-ic-bounce 1s ease-in-out infinite;}
.boutique-nav .btn.primary{background:var(--orange-500); border-color:var(--orange-500);}
@keyframes nav-active-glow{
  0%,100%{box-shadow:0 6px 16px rgba(0,0,0,.28);}
  50%{box-shadow:0 8px 24px rgba(217,122,52,.6);}
}
@keyframes nav-ic-bounce{
  0%,100%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-3px) rotate(-6deg);}
}
#cart-count{display:inline-block; transition:transform .1s ease;}
.cart-bump{animation:cart-bump-kf .4s ease;}
@keyframes cart-bump-kf{0%{transform:scale(1);} 40%{transform:scale(1.6);} 100%{transform:scale(1);}}
.boutique-content{flex:1; overflow-y:auto; padding:26px 28px; max-width:1000px; margin:0 auto; width:100%;}

.prod-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.prod-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px; text-align:center;}
.prod-card .ic{font-size:34px; margin-bottom:10px;}
.prod-card h4{font-family:'Sora',sans-serif; font-size:14.5px; font-weight:700; color:var(--blue-900);}
.prod-card .px{font-size:13px; color:var(--orange-600); font-weight:700; margin:6px 0 12px;}

.prod-list{display:flex; flex-direction:column; gap:10px;}
.prod-acc{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.prod-acc.open{border-color:var(--blue-500);}
.prod-acc-head{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;}
.prod-acc-head .ic{font-size:26px; flex-shrink:0;}
.prod-acc-thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0;}
.prod-acc-title{flex:1;}
.prod-acc-title h4{font-family:'Sora',sans-serif; font-size:14px; font-weight:700; color:var(--blue-900);}
.prod-acc-title .px{font-size:12.5px; color:var(--orange-600); font-weight:700; margin-top:2px;}
.prod-acc-chevron{color:var(--text-muted); font-size:12px; flex-shrink:0;}
.prod-acc-body{padding:0 14px 16px; border-top:1px solid var(--line); padding-top:12px;}
.prod-acc-desc{font-size:12.5px; color:var(--text-muted); line-height:1.5; margin-bottom:12px;}
.qty-row{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px;}
.qty-row button{width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:#fff; font-weight:700; color:var(--blue-800);}
.qty-row span{font-weight:700; min-width:18px;}
.stock-badge{font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:8px; margin-bottom:10px; display:inline-block;}
.stock-badge.ok{background:var(--green-bg); color:var(--green);}
.stock-badge.low{background:var(--yellow-bg); color:var(--yellow);}
.stock-badge.out{background:#fee2e2; color:var(--red);}
.buy-options{display:flex; gap:8px; flex-wrap:wrap;}
.buy-options .btn{min-width:120px;}

.cart-row{display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
.cart-row .nm{font-weight:700; font-size:13.5px; color:var(--blue-900);}
.cart-row .pr{font-size:12px; color:var(--text-muted); margin-top:2px;}
.cart-total{display:flex; justify-content:space-between; align-items:center; background:var(--blue-900); color:#fff; border-radius:12px; padding:16px 18px; margin-top:6px;}
.cart-total .lb{font-size:12.5px; color:rgba(255,255,255,.7);}
.cart-total .amt{font-family:'Sora',sans-serif; font-size:20px; font-weight:800;}

.track-box{background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px;}
.track-num{display:flex; gap:8px; margin-bottom:16px;}
.track-num input{flex:1;}
.timeline{display:flex; justify-content:space-between; margin:24px 0; position:relative;}
.timeline::before{content:""; position:absolute; top:14px; left:20px; right:20px; height:3px; background:var(--line); z-index:0;}
.tl-step{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; flex:1; text-align:center;}
.tl-step .dot{width:30px; height:30px; border-radius:50%; background:var(--line); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; margin-bottom:8px; border:3px solid var(--bg);}
.tl-step.done .dot{background:var(--green);}
.tl-step.active .dot{background:var(--orange-500); animation:tl-pulse 1.4s ease-in-out infinite;}
@keyframes tl-pulse{
  0%{box-shadow:0 0 0 0 rgba(217,122,52,0.55);}
  70%{box-shadow:0 0 0 10px rgba(217,122,52,0);}
  100%{box-shadow:0 0 0 0 rgba(217,122,52,0);}
}
.tl-step .lb{font-size:11px; color:var(--text-muted); max-width:80px;}
.tl-step.done .lb, .tl-step.active .lb{color:var(--blue-900); font-weight:700;}
.track-loc{background:var(--orange-100); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--orange-600); font-weight:600; margin-top:16px;}
.price-card{position:relative; overflow:hidden; margin-top:16px; padding:18px 16px; border-radius:16px; background:linear-gradient(135deg, var(--orange-500), #b8541f); color:#fff; box-shadow:0 8px 22px rgba(217,122,52,.35); animation:price-pop .5s cubic-bezier(.34,1.56,.64,1);}
.price-card::after{content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent); animation:price-shine 2.6s ease-in-out infinite;}
.price-card-top{display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; opacity:.92;}
.price-card-moto{font-size:22px; display:inline-block; animation:price-moto 1.1s ease-in-out infinite;}
.price-card-amount{font-size:26px; font-weight:800; margin-top:6px; font-family:'Sora',sans-serif;}
.price-card-sub{font-size:12.5px; opacity:.92; margin-top:2px;}
@keyframes price-pop{0%{transform:scale(.9); opacity:0;} 100%{transform:scale(1); opacity:1;}}
@keyframes price-shine{0%{left:-60%;} 100%{left:120%;}}
@keyframes price-moto{0%,100%{transform:translateX(0) rotate(0deg);} 25%{transform:translateX(3px) rotate(-3deg);} 75%{transform:translateX(-3px) rotate(3deg);}}
.client-loc-panel{margin-top:16px; padding:14px; border-radius:14px; background:#fff; border:1px solid var(--line);}
.client-loc-panel iframe{width:100%; height:220px; border:0; border-radius:10px; margin-top:10px;}
.client-loc-btn{width:100%; margin-top:10px; padding:12px; border-radius:10px; border:none; background:var(--blue-900); color:#fff; font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
.client-loc-btn .pin{animation:pin-bounce 1s ease-in-out infinite;}
@keyframes pin-bounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);}}
.client-loc-sent{margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--green-bg); color:var(--green); font-size:12px; font-weight:700; text-align:center; animation:price-pop .4s ease;}
.order-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; font-size:12.5px;}
.order-card .id{font-weight:700; color:var(--blue-900); font-family:'Sora',sans-serif;}

/* ===== NOUVEAU THÈME BOUTIQUE (façon appli e-commerce) ===== */
.store-header{background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:12px;}
.store-header .hbtn{background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--blue-900); padding:4px; flex-shrink:0;}
.store-header .store-logo{width:34px; height:34px; border-radius:8px; object-fit:cover; flex-shrink:0;}
.store-header .store-title{font-family:'Sora',sans-serif; font-weight:800; font-size:16px; color:var(--blue-900); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.store-header .store-icon-btn{background:none; border:none; font-size:19px; cursor:pointer; color:var(--blue-900); padding:4px; position:relative; flex-shrink:0;}
.store-cart-badge{position:relative; display:inline-flex; align-items:center; justify-content:center; background:var(--blue-700, #1d4ed8); color:#fff; border:none; border-radius:999px; padding:7px 12px; font-weight:800; font-size:13px; gap:6px; cursor:pointer; flex-shrink:0;}
.store-searchbar-wrap{padding:10px 16px 4px;}
.store-searchbar{display:flex; align-items:center; gap:8px; background:#f1f2f4; border-radius:999px; padding:10px 14px;}
.store-searchbar span{color:var(--text-muted); font-size:14px;}
.store-searchbar input{border:none; background:transparent; outline:none; flex:1; font-size:13.5px; min-width:0;}

.store-drawer-overlay{position:fixed; inset:0; background:rgba(15,37,64,.4); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.store-drawer-overlay.open{opacity:1; pointer-events:auto;}
.store-drawer{position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px; background:#fff; z-index:41; transform:translateX(-100%); transition:transform .22s ease; display:flex; flex-direction:column; box-shadow:8px 0 24px rgba(0,0,0,.15);}
.store-drawer.open{transform:translateX(0);}
.store-drawer-head{padding:20px 18px; background:linear-gradient(135deg, var(--blue-900), var(--blue-700)); color:#fff;}
.store-drawer-head .t1{font-family:'Sora',sans-serif; font-weight:800; font-size:15px;}
.store-drawer-head .t2{font-size:11px; opacity:.8; margin-top:2px;}
.store-drawer-body{padding:8px; overflow-y:auto; flex:1;}
.store-drawer-item{display:flex; align-items:center; gap:12px; padding:13px 12px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; color:var(--blue-900); background:none; border:none; width:100%; text-align:left;}
.store-drawer-item:hover{background:var(--blue-100);}
.store-drawer-item .ic{font-size:18px; width:22px; text-align:center; flex-shrink:0;}
.store-drawer-item.exit{color:var(--text-muted); margin-top:6px; border-top:1px solid var(--line); padding-top:14px; border-radius:0;}

.cat-rail-wrap{display:flex; align-items:center; gap:8px; padding:4px 16px 6px;}
.cat-rail{display:flex; gap:16px; overflow-x:auto; padding:6px 2px 4px; scrollbar-width:none;}
.cat-rail::-webkit-scrollbar{display:none;}
.cat-rail-grid-btn{flex-shrink:0; width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; color:var(--blue-900);}
.cat-item{flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; width:66px;}
.cat-item .circle{width:60px; height:60px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, var(--blue-100), var(--orange-100, #fde6d3)); font-size:22px; border:2px solid transparent;}
.cat-item.active .circle{border-color:var(--orange-500);}
.cat-item .circle img{width:100%; height:100%; object-fit:cover;}
.cat-item .lb{font-size:11px; font-weight:700; color:var(--blue-900); text-align:center; max-width:66px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cat-rail-scroll-btn{flex-shrink:0; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--blue-900);}

.store-prod-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:6px 16px 16px;}
.store-prod-card{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column;}
.store-prod-card .thumb{width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--blue-100); display:flex; align-items:center; justify-content:center; font-size:38px; cursor:pointer;}
.store-prod-card .body{padding:10px 11px 12px; display:flex; flex-direction:column; gap:6px; flex:1;}
.store-prod-card .nm{font-size:13.5px; font-weight:700; color:#1a1a1a; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; min-height:34px;}
.store-prod-card .px{font-size:15px; font-weight:800; color:var(--orange-600);}
.store-prod-card .px-old{font-size:12px; font-weight:600; color:var(--text-muted); text-decoration:line-through; margin-left:5px;}
.store-prod-card .buy-btn{margin-top:auto; background:var(--blue-700, #1d4ed8); color:#fff; border:none; border-radius:10px; padding:9px; font-weight:700; font-size:12.5px; cursor:pointer;}

.pdp-back{display:flex; align-items:center; gap:6px; padding:10px 16px 0; color:var(--blue-900); font-weight:700; font-size:13px; cursor:pointer;}
.pdp-hero{width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--blue-100); display:flex; align-items:center; justify-content:center; font-size:70px; border-radius:14px;}
.pdp-body{padding:14px 16px 110px;}
.pdp-title{font-family:'Sora',sans-serif; font-size:19px; font-weight:800; color:#1a1a1a; margin-bottom:6px;}
.pdp-price{font-size:22px; font-weight:800; color:var(--orange-600); margin-bottom:10px;}
.pdp-price .px-old{font-size:15px; font-weight:600; color:var(--text-muted); text-decoration:line-through; margin-left:8px;}
.pdp-desc{font-size:13px; color:var(--text-muted); line-height:1.55; margin-bottom:12px;}
.pdp-stickybar{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:10px; z-index:20; max-width:1000px; margin:0 auto;}
.pdp-stickybar .qty-row{margin:0; flex-shrink:0;}
.pdp-stickybar .btn{flex:1; padding:12px; border-radius:12px; font-weight:800; font-size:13.5px;}
</style>
</head>

   4. Firebase affiche un objet firebaseConfig : copie ses valeurs ci-dessous.
*/

// Persistance hors-ligne : si un vendeur perd le réseau un instant, ses écritures
// restent en file d'attente sur son téléphone et repartent automatiquement dès
// que la connexion revient, au lieu d'échouer silencieusement.
try{

  });

// Si le fichier est ouvert en double-cliquant dessus (adresse qui commence par
// "file://" au lieu de "http://" ou "https://"), la plupart des navigateurs de
// bureau bloquent le stockage local et perturbent la sauvegarde en ligne : c'est
// la cause la plus fréquente du message "la sauvegarde refuse de sauvegarder"
// sur ordinateur. On prévient clairement plutôt que de laisser l'échec silencieux.
if(location.protocol === 'file:'){
  document.addEventListener('DOMContentLoaded', ()=>{
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:99999; background:#c62828; color:#fff; font-size:12.5px; font-weight:600; text-align:center; padding:8px 14px; line-height:1.4;';
    bar.innerHTML = '⚠️ Cette page est ouverte en fichier local (adresse commençant par "file://"). Sur ordinateur, cela empêche le navigateur d\'enregistrer et de synchroniser les données. Ouvrez l\'application via son adresse internet (http:// ou https://) plutôt qu\'en double-cliquant sur le fichier.';
    document.body.prepend(bar);
  });
}

/* ---- Images produits : collection Firestore séparée ----
   Un document Firestore est plafonné à 1 Mo. Stocker les images (base64) des
   produits DANS le document partagé principal (qui contient déjà ventes,
   clients, réclamations…) faisait dépasser cette limite au bout de 3-4 images
   — Firestore refusait alors TOUTE sauvegarde, pas seulement celle des images.
   On stocke donc chaque image dans son propre document ("une fiche par produit"),
   dans une collection à part : chaque image a son propre quota de 1 Mo, donc le
   nombre de produits avec photo n'est plus limité par la taille du document
   partagé principal. */
const productImagesCol = db.collection('mperfect-pub-product-images');
let productImagesMap = {}; // nom du produit -> image (data URL), tenu à jour en direct
// Tant qu'on n'a pas reçu la première réponse de la collection d'images (chargement en
// cours, réseau lent au démarrage), on ne sait pas encore avec certitude si un produit a
// une image ou non. Sans ce garde-fou, applyProductImages() effaçait l'image affichée de
// TOUS les produits pendant cette courte fenêtre (productImagesMap encore vide) — et si
// l'utilisateur enregistrait quoi que ce soit (catégorie, description…) pile à ce moment,
// l'image pouvait sembler perdue définitivement. On attend donc la confirmation du serveur
// avant d'autoriser cette fonction à mettre une image à vide.
let productImagesReady = false;
function applyProductImages(){
  (state.products||[]).forEach(p=>{
    if(productImagesReady || Object.prototype.hasOwnProperty.call(productImagesMap, p.name)){
      p.img = productImagesMap[p.name] || '';
    }
    // sinon : chargement des images pas encore confirmé, on laisse p.img tel quel plutôt que de risquer de l'effacer par erreur.
  });
}
function listenToProductImages(){
  productImagesCol.onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      const name = decodeURIComponent(ch.doc.id);
      if(ch.type==='removed') delete productImagesMap[name];
      else productImagesMap[name] = (ch.doc.data()||{}).img || '';
    });
    productImagesReady = true;
    applyProductImages();
    renderPage();
  }, err=>console.error('Erreur écoute images produits', err));
}
// Migration en douceur : si d'anciennes images étaient encore stockées directement
// dans le document partagé (avant ce correctif), on les recopie dans leur nouvelle
// collection avant qu'elles ne soient perdues lors du prochain nettoyage du document.
async function migrateLegacyProductImages(){
  const toMigrate = (state.products||[]).filter(p => p.img && typeof p.img === 'string' && p.img.startsWith('data:') && !productImagesMap[p.name]);
  for(const p of toMigrate){
    try{
      await productImagesCol.doc(encodeURIComponent(p.name)).set({img: p.img, ts: Date.now()}, {merge:true});
      productImagesMap[p.name] = p.img;
    }catch(e){ console.error('Migration image produit échouée pour', p.name, e); }
  }
}

/* ---- Notes vocales et photos jointes aux factures/commandes : même principe ----
   Une note vocale (ou des photos) enregistrée directement dans la facture (comme le
   catalogue avant lui) grossit le document partagé de 1 Mo à chaque vente — et
   contrairement au catalogue (peu de produits), ça arrive à CHAQUE facture avec note,
   donc le document finit toujours par déborder. On stocke donc chaque note dans sa
   propre "fiche" (un document par numéro de facture / de suivi), chargée à la demande
   seulement quand on ouvre cette facture précise — pas de téléchargement massif au démarrage. */
const invoiceNotesCol = db.collection('mperfect-pub-invoice-notes');
let invoiceNotesMap = {}; // clé (numéro ou n° de suivi) -> {audio, images} déjà chargé, ou null si aucune note
function ensureInvoiceNote(key){
  if(!key || invoiceNotesMap[key] !== undefined) return;
  invoiceNotesMap[key] = null; // évite de relancer la requête en boucle pendant le chargement
  invoiceNotesCol.doc(key).get().then(snap=>{
    invoiceNotesMap[key] = snap.exists ? snap.data() : null;
    renderPage();
  }).catch(e=>console.error('Erreur chargement note', key, e));
}
// Renvoie la note vocale/les photos à afficher : celles déjà chargées depuis leur
// collection dédiée, sinon (le temps du chargement, ou pour d'anciens enregistrements
// d'avant ce correctif) celles encore embarquées directement dans l'enregistrement.
function invoiceNoteAudio(rec){
  const key = rec.numero || rec.tracking;
  const cached = invoiceNotesMap[key];
  if(cached) return cached.audio || null;
  if(cached === undefined) ensureInvoiceNote(key);
  return rec.noteAudio || null;
}
function invoiceNoteImages(rec){
  const key = rec.numero || rec.tracking;
  const cached = invoiceNotesMap[key];
  if(cached) return cached.images || [];
  if(cached === undefined) ensureInvoiceNote(key);
  return rec.noteImages || [];
}
// Écrit la note dans sa collection dédiée au moment de la création de la facture/commande.
function saveInvoiceNote(key, audio, images){
  if(!key) return;
  if(!audio && (!images || images.length===0)) return; // rien à enregistrer
  invoiceNotesCol.doc(key).set({audio: audio||null, images: images||[]}, {merge:true})
    .then(()=>{ invoiceNotesMap[key] = {audio: audio||null, images: images||[]}; })
    .catch(e=>{ console.error('Erreur enregistrement note', key, e); toast('⚠️ Note vocale/photos non synchronisées (réseau). Réessayez.'); });
}

// Migration en douceur : si d'anciennes notes (vocales/photos) étaient encore
// stockées directement dans les factures/commandes (avant ce correctif), on les
// recopie dans leur collection dédiée avant qu'un futur envoi ne les exclue.
async function migrateLegacyInvoiceNotes(){
  const records = [...(state.ventes||[]), ...(state.customerOrders||[])];
  for(const rec of records){
    const key = rec.numero || rec.tracking;
    if(!key) continue;
    const hasLegacy = (rec.noteAudio && typeof rec.noteAudio==='string' && rec.noteAudio.startsWith('data:')) || (rec.noteImages && rec.noteImages.length);
    if(hasLegacy && invoiceNotesMap[key] === undefined){
      try{
        await invoiceNotesCol.doc(key).set({audio: rec.noteAudio||null, images: rec.noteImages||[]}, {merge:true});
        invoiceNotesMap[key] = {audio: rec.noteAudio||null, images: rec.noteImages||[]};
      }catch(e){ console.error('Migration note facture échouée pour', key, e); }
    }
  }
}

/* ---- Icônes de catégories (petites images rondes affichées dans la boutique) ----
   Avant : toutes les icônes étaient stockées dans UN SEUL document Firestore
   ("categoryIcons"). Les documents Firestore sont limités à 1 Mo : dès que
   plusieurs icônes (en base64) étaient ajoutées, la sauvegarde dépassait
   cette limite et échouait silencieusement (l'erreur partait seulement dans
   la console). L'icône s'affichait quand même à l'écran (mise à jour locale
   optimiste), donnant l'impression que c'était enregistré — puis elle
   disparaissait au rechargement car Firestore renvoyait l'ancienne version
   (sans l'icône) au prochain onSnapshot.
   Correctif : un document séparé par catégorie (plus de risque de dépasser
   la limite de taille) + un message d'erreur visible si la sauvegarde
   échoue vraiment (réseau coupé, etc.), au lieu d'échouer en silence. */
const categoryIconsCol = db.collection('mperfect-pub-category-icons');
let categoryIcons = {};
function categoryIconDocId(cat){
  // Un nom de catégorie peut contenir des caractères interdits dans un ID Firestore (/, etc.)
  return encodeURIComponent((cat||'').trim()).replace(/\./g, '%2E') || 'sans-nom';
}
function listenToCategoryIcons(){
  categoryIconsCol.onSnapshot(snap=>{
    const next = {};
    snap.forEach(doc=>{
      const data = doc.data()||{};
      if(data.cat && data.img) next[data.cat] = data.img;
    });
    categoryIcons = next;
    renderPage(); renderBoutiquePage();
  }, err=>console.error('Erreur écoute icônes catégories', err));
}
function handleCategoryIconFile(cat, fileList){
  const file = fileList && fileList[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 200;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){ const scale = maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      const previous = categoryIcons[cat];
      categoryIcons[cat] = dataUrl; // affichage immédiat
      renderPage();
      categoryIconsCol.doc(categoryIconDocId(cat)).set({cat, img: dataUrl}).then(()=>{
        toast('Icône enregistrée ✅');
      }).catch(err=>{
        console.error('Erreur icône catégorie', err);
        categoryIcons[cat] = previous; // on annule l'affichage optimiste, l'enregistrement a échoué
        renderPage();
        toast('⚠️ Icône NON enregistrée (réseau ou permissions). Réessayez.');
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeCategoryIcon(cat){
  const previous = categoryIcons[cat];
  delete categoryIcons[cat];
  renderPage();
  categoryIconsCol.doc(categoryIconDocId(cat)).delete().then(()=>toast('Icône retirée')).catch(err=>{
    console.error('Erreur suppression icône catégorie', err);
    categoryIcons[cat] = previous;
    renderPage();
    toast('⚠️ Suppression non enregistrée (réseau).');
  });
}

const PERSONAL_KEY = 'mperfect-panier-personnel';
const SHARED_FIELDS = ['points','ventes','invoiceCounter','clients','vendeurs','reclamations','reclamationCounter','customerOrders','trackingCounter','products','staff','budgetRules','paymentNumbers','deliverySettings','customerGifts','giftCounter','staffCounter','serviceCosts','serviceCostCounter','socialLinks','expenses','expenseCounter'];
const PERSONAL_FIELDS = ['panier','catalogQty','checkout','myTel','boutiqueReclamationDraft'];

/* Champs "liste" où chaque élément a un identifiant unique (numero / tracking / id).
   Pour ces champs, au lieu de renvoyer tout le tableau à chaque sauvegarde (ce qui
   écrase les ventes qu'un AUTRE vendeur vient d'ajouter sur le document partagé
   pendant qu'on n'avait pas encore reçu sa mise à jour), on n'envoie que les
   ÉLÉMENTS RÉELLEMENT NOUVEAUX via arrayUnion : Firestore les fusionne côté serveur
   de façon atomique, même si deux vendeurs enregistrent une vente au même moment.
   Si un élément déjà connu a été modifié en local (ex: paiement d'un reste, réclamation
   résolue), on retombe sur un envoi complet de ce tableau pour propager la modif. */
/* "staff" (matricule) a été ajouté à cette liste : avant, l'ajout d'un membre du
   personnel (ex: un livreur) sur un appareil, pendant qu'un autre appareil venait
   tout juste d'en ajouter un différent sans que cette mise à jour ait encore été
   reçue ici, renvoyait le tableau local complet et effaçait silencieusement l'ajout
   de l'autre appareil. Le matricule (MP-STAFF-0001…) sert d'identifiant unique. */
const APPEND_FIELDS = { ventes:'numero', customerOrders:'tracking', reclamations:'id', customerGifts:'code', expenses:'id', staff:'matricule' };
let lastSyncedSnapshot = { ventes:new Map(), customerOrders:new Map(), reclamations:new Map(), customerGifts:new Map(), staff:new Map() };

/* Champs "à remplacement direct" : tout le reste de SHARED_FIELDS (products, clients,
   vendeurs, staff, budgetRules…). Contrairement aux champs ci-dessus, Firestore renvoie
   TOUJOURS le document entier à chaque snapshot, y compris pour ces champs, même quand
   c'est un AUTRE champ (une vente, par exemple) qui vient de changer. Sans protection,
   une modification locale pas encore envoyée au serveur (le délai de regroupement de
   250 ms, ou l'envoi en cours) se faisait donc écraser silencieusement dès qu'une autre
   personne connectée faisait n'importe quelle action au même moment — c'est ce qui causait
   la catégorie d'un produit qui se réinitialisait toute seule juste après l'enregistrement.
   On retient donc, comme pour les champs ci-dessus, la dernière version confirmée envoyée
   au serveur pour chacun de ces champs, et on ignore une mise à jour entrante tant que la
   version locale ne correspond pas encore à cette dernière version confirmée. */
const DIRECT_FIELDS = SHARED_FIELDS.filter(k=>!APPEND_FIELDS[k]);
let lastSyncedDirect = {};
function cleanedFieldValue(key, value){
  // Même nettoyage que buildSharedPayload : l'image des produits ne vit jamais dans ce
  // champ côté serveur, donc on l'ignore aussi dans la comparaison, sinon chaque produit
  // avec photo semblerait éternellement "pas encore synchronisé".
  if(key==='products') return (value||[]).map(({img, ...rest})=>rest);
  return value;
}
// Compteurs partagés (numéro de facture, de suivi, de réclamation…) : ne doivent
// JAMAIS repartir en arrière. Cas concret qui causait la numérotation dans le
// désordre : un téléphone resté hors-ligne (ou pas encore synchronisé) garde en
// mémoire une ancienne valeur (ex: 13) pendant que d'autres appareils font déjà
// avancer le compteur partagé bien plus loin (ex: 38) en créant des factures.
// Sans ce garde-fou, ce téléphone pouvait — en se reconnectant — renvoyer sa
// valeur locale (13) et écraser le compteur partagé, qui repartait en arrière ;
// les prochaines factures réutilisaient alors des numéros déjà attribués
// (numéro bas mais date récente — exactement le désordre observé). On prend
// donc toujours le PLUS GRAND des deux au lieu d'écraser.
const COUNTER_FIELDS = ['invoiceCounter','reclamationCounter','trackingCounter','giftCounter','staffCounter','serviceCostCounter','expenseCounter'];
function applyIncomingDirectFields(incoming){
  DIRECT_FIELDS.forEach(k=>{
    if(!(k in incoming)) return;
    if(COUNTER_FIELDS.includes(k)){
      incoming[k] = Math.max(state[k]||0, incoming[k]||0);
      return;
    }
    const localStr = JSON.stringify(cleanedFieldValue(k, state[k]));
    if(lastSyncedDirect[k] !== undefined && localStr !== lastSyncedDirect[k]){
      delete incoming[k]; // modif locale pas encore confirmée envoyée : on ne l'écrase pas
    }
  });
  return incoming;
}

function markAllSynced(){
  DIRECT_FIELDS.forEach(k=>{ lastSyncedDirect[k] = JSON.stringify(cleanedFieldValue(k, state[k])); });
  Object.keys(APPEND_FIELDS).forEach(field=>{
    const key = APPEND_FIELDS[field];
    const m = new Map();
    // Même "nettoyage" que dans buildSharedPayload : on compare des versions sans
    // note vocale/photos des deux côtés, sinon chaque facture avec note semblerait
    // "modifiée" à chaque rendu et on renverrait tout le tableau en boucle.
    const strip = (field==='ventes' || field==='customerOrders')
      ? (it)=>{ const {noteAudio, noteImages, ...rest} = it; return rest; }
      : (it)=>it;
    (state[field]||[]).forEach(it=>{ if(it && it[key]!=null) m.set(it[key], JSON.stringify(strip(it))); });
    lastSyncedSnapshot[field] = m;
  });
}

/* Fusionne un tableau "liste" reçu de Firestore (ventes, customerOrders, reclamations,
   customerGifts) avec la version locale actuelle, au lieu de l'écraser purement et
   simplement. Nécessaire car un enregistrement via arrayUnion déclenche d'abord un
   instantané local "optimiste" qui NE CONTIENT PAS ENCORE le nouvel élément ajouté
   (Firestore ne résout les arrayUnion/increment/serverTimestamp qu'après confirmation
   serveur) : sans fusion, cet instantané intermédiaire effacerait de l'écran une
   commande/vente qu'on vient tout juste de créer localement, le temps que le serveur
   confirme l'écriture.
*/
// Extrait le numéro d'ordre contenu dans un numéro de facture/suivi/code
// (ex: "MP-2026-42-K7Q" -> 42) : c'est un compteur strictement croissant,
// donc un repli fiable pour trier quand le "ts" (horodatage) manque ou quand
// deux téléphones n'ont pas la même heure réglée (cause fréquente de listes
// qui semblent "dans le désordre" quand plusieurs vendeurs/appareils sont
// utilisés).
function appendItemSortKey(it, key){
  const raw = it && key ? it[key] : null;
  if(raw==null) return 0;
  // Le numéro d'ordre est toujours l'avant-dernier segment quand il y a un suffixe
  // aléatoire (ex: MP-2026-36-X2S → 36), ou le dernier segment sinon (ex: MP-2026-2 → 2,
  // DEP-7 → 7, ou un id numérique brut). L'ancien regex cherchait le premier groupe de
  // chiffres suivi d'un tiret, ce qui capturait à tort l'année "2026" pour les anciennes
  // factures sans suffixe (MP-2026-2, MP-2026-9…), d'où le tri incohérent.
  const parts = String(raw).split('-');
  const token = parts.length >= 4 ? parts[parts.length-2] : parts[parts.length-1];
  const n = parseInt(token,10);
  return isNaN(n) ? 0 : n;
}
function mergeAppendArray(field, incomingArr){
  const key = APPEND_FIELDS[field];
  if(!key) return incomingArr;
  const map = new Map();
  (incomingArr||[]).forEach(it=>{ if(it && it[key]!=null) map.set(it[key], it); });
  (state[field]||[]).forEach(it=>{ if(it && it[key]!=null && !map.has(it[key])) map.set(it[key], it); });
  const merged = Array.from(map.values());
  merged.sort((a,b)=>{
    // Le numéro d'ordre (compteur partagé, strictement croissant) prime toujours sur
    // l'horodatage : contrairement à l'heure du téléphone (qui peut être mal réglée
    // et donc fausse), le numéro est fiable — voir le commentaire sur COUNTER_FIELDS.
    // L'horodatage ne sert plus qu'à départager une égalité de numéro (cas rarissime).
    const keyDiff = appendItemSortKey(b, key) - appendItemSortKey(a, key);
    if(keyDiff !== 0) return keyDiff;
    if(a && b && a.ts!=null && b.ts!=null) return b.ts - a.ts;
    return 0;
  });
  return merged;
}
// Filet de sécurité supplémentaire à l'affichage : même si, pour une raison ou une
// autre, l'ordre du tableau state.ventes en mémoire n'était plus parfaitement trié
// (vieilles données migrées sans "ts", écran resté ouvert longtemps...), les écrans
// qui listent les factures s'appuient sur cette fonction plutôt que sur l'ordre brut
// du tableau, pour toujours afficher la plus récente en premier.
function sortedVentes(){
  return (state.ventes||[]).slice().sort((a,b)=>{
    // L'heure réelle de création prime : la facture créée à 20h doit apparaître
    // au-dessus de celle créée à 19h, même si — à cause de ventes créées hors-ligne
    // sur différents points puis synchronisées plus tard — les numéros de compteur
    // ne se sont pas retrouvés attribués exactement dans cet ordre. Le numéro ne sert
    // plus que de repli pour les très anciennes factures sans horodatage enregistré.
    if(a && b && a.ts!=null && b.ts!=null){
      const tsDiff = b.ts - a.ts;
      if(tsDiff !== 0) return tsDiff;
    }
    return appendItemSortKey(b,'numero') - appendItemSortKey(a,'numero');
  });
}
// Factures réellement comptabilisées : on garde les factures annulées visibles
// dans les listes/l'historique (pour garder une trace), mais on les exclut de
// TOUS les calculs d'argent/statistiques (dashboard, rapports, finances…) —
// c'est exactement pour ça que ce helper existe plutôt que d'utiliser
// state.ventes directement dans ces calculs.
function activeVentes(){
  return (state.ventes||[]).filter(v=>v.statut!=='annulee');
}
function mergeIncomingAppendFields(incoming){
  Object.keys(APPEND_FIELDS).forEach(field=>{
    if(field in incoming) incoming[field] = mergeAppendArray(field, incoming[field]);
  });
  return incoming;
}

/* ---- STOCK : écriture transactionnelle -----------------------------------
   Le stock reste un tableau (comme avant), mais au lieu d'écraser tout le
   tableau depuis l'état local (ce qui perdait la déduction d'un autre
   vendeur/point de vente si deux ventes du même article arrivaient en même
   temps), on passe par une transaction Firestore : elle relit la version la
   plus récente du document au moment de l'écriture, applique le changement
   dessus, et Firestore réessaie automatiquement en cas de conflit. Deux
   déductions simultanées sur le même article se cumulent donc correctement
   au lieu que l'une écrase l'autre. */
async function commitStockDelta(id, delta){
  if(!delta) return;
  try{
    await db.runTransaction(async tx=>{
      const snap = await tx.get(sharedDocRef);
      const data = snap.exists ? snap.data() : {};
      const stock = Array.isArray(data.stock) ? data.stock.slice() : (state.stock||[]).slice();
      const idx = stock.findIndex(s=>s.id===id);
      if(idx===-1) return;
      const item = {...stock[idx]};
      item.qty = Math.max(0, (item.qty||0) + delta);
      stock[idx] = item;
      tx.set(sharedDocRef, {stock}, {merge:true});
    });
    setSyncStatus('ok');
  }catch(e){
    console.error('Erreur transaction stock', e);
    setSyncStatus('error');
    toast('⚠️ Mouvement de stock non synchronisé (réseau). Nouvel essai automatique…');
    retryStockDelta(id, delta);
  }
}
// petite file de nouvelles tentatives pour les mouvements de stock qui ont échoué hors-ligne
let __stockRetryQueue = [];
function retryStockDelta(id, delta){ __stockRetryQueue.push({id, delta}); }
window.addEventListener('online', ()=>{
  const q = __stockRetryQueue; __stockRetryQueue = [];
  q.forEach(({id, delta})=>commitStockDelta(id, delta));
});

async function commitStockUpsert(item){
  try{
    await db.runTransaction(async tx=>{
      const snap = await tx.get(sharedDocRef);
      const data = snap.exists ? snap.data() : {};
      const stock = Array.isArray(data.stock) ? data.stock.slice() : (state.stock||[]).slice();
      const idx = stock.findIndex(s=>s.id===item.id);
      if(idx===-1) stock.push(item); else stock[idx] = item;
      tx.set(sharedDocRef, {stock}, {merge:true});
    });
    setSyncStatus('ok');
  }catch(e){
    console.error('Erreur transaction stock (article)', e);
    setSyncStatus('error');
    toast('⚠️ Article non synchronisé (réseau). Réessayez si besoin.');
  }
}

// Filet de sécurité supplémentaire : une fois qu'on a vu, confirmé par le serveur,
// qu'un champ (clients, catalogue, points de vente…) contenait des données, on ne
// laisse plus jamais un envoi le remettre à zéro par erreur (état local pas encore
// chargé, bug, etc.) — ce type d'écrasement silencieux est exactement ce qui a déjà
// causé la perte du catalogue et des clients par le passé.
let neverEmptyFields = {};
function noteNonEmptyFields(data){
  if(!data) return;
  SHARED_FIELDS.forEach(k=>{ if(Array.isArray(data[k]) && data[k].length>0) neverEmptyFields[k] = true; });
}

function buildSharedPayload(){
  const payload = {};
  const transactionalMerges = []; // modifs d'entrées existantes -> fusion sûre via transaction (voir plus bas)
  SHARED_FIELDS.forEach(k=>{
    if(k==='products'){
      // On n'envoie jamais l'image (base64) dans le document partagé principal :
      // elle vit désormais dans sa propre collection (voir productImagesCol).
      const cleaned = (state.products||[]).map(({img, ...rest})=>rest);
      if(neverEmptyFields.products && cleaned.length===0){ console.warn('Envoi du catalogue vide bloqué par sécurité.'); return; }
      // On ne renvoie le catalogue QUE s'il a réellement changé localement depuis la
      // dernière fois qu'on a eu confirmation du serveur. Sans ce garde-fou, un appareil
      // dont la copie locale est simplement un peu ancienne (page restée ouverte, appareil
      // qui vient de se reconnecter…) renvoyait quand même sa version — même inchangée
      // pour lui — à chaque sauvegarde déclenchée par n'importe quelle action, écrasant
      // au passage des catégories ajoutées entre-temps par quelqu'un d'autre.
      if(lastSyncedDirect.products !== undefined && JSON.stringify(cleaned) === lastSyncedDirect.products) return;
      payload[k] = cleaned;
      return;
    }
    const key = APPEND_FIELDS[k];
    if(!key){
      if(neverEmptyFields[k] && Array.isArray(state[k]) && state[k].length===0){
        console.warn(`Envoi de "${k}" vide bloqué par sécurité (ce champ contenait des données auparavant).`);
        return;
      }
      // Même garde-fou que pour products ci-dessus, pour tous les autres champs à
      // remplacement direct (clients, staff, budgetRules…).
      if(lastSyncedDirect[k] !== undefined && JSON.stringify(state[k]) === lastSyncedDirect[k]) return;
      payload[k] = state[k]; return;
    }
    // Pour les ventes/commandes, la note vocale et les photos ne partent jamais vers le
    // document partagé (voir invoiceNotesCol plus haut) — seul le texte de la note reste.
    const stripNotes = (k==='ventes' || k==='customerOrders')
      ? (it)=>{ const {noteAudio, noteImages, ...rest} = it; return rest; }
      : (it)=>it;
    const known = lastSyncedSnapshot[k] || new Map();
    const current = (state[k] || []).map(stripNotes);
    const currentKeys = new Set();
    const nouveaux = [];
    const modifies = [];
    current.forEach(it=>{
      if(!it || it[key]==null) return;
      currentKeys.add(it[key]);
      const prev = known.get(it[key]);
      if(prev===undefined) nouveaux.push(it);
      else if(prev!==JSON.stringify(it)) modifies.push(it);
    });
    // Une entrée connue du serveur (donc présente dans "known") mais absente du tableau
    // local actuel a été supprimée ici (ex: "Suppr." sur une dépense). Sans ce suivi,
    // rien ne signalait jamais cette suppression au serveur : l'entrée restait donc sur
    // Firestore et revenait à chaque synchronisation suivante — exactement le bug
    // "je supprime et ça revient".
    const supprimes = [];
    known.forEach((_, k2)=>{ if(!currentKeys.has(k2)) supprimes.push(k2); });
    if(modifies.length || supprimes.length){
      // Une entrée existante a été modifiée et/ou supprimée localement. On ne renvoie PAS
      // tout le tableau local tel quel : sur l'appareil du PDG, ce tableau peut ne pas
      // encore contenir une entrée qu'un vendeur vient d'enregistrer à l'instant sur un
      // autre appareil (pas encore reçue par le listener temps réel) — l'écraser purement
      // et simplement la ferait disparaître silencieusement. On passe donc par une
      // transaction qui relit d'abord la VRAIE version serveur avant d'appliquer nos
      // modifs/suppressions par-dessus (voir mergeArrayFieldViaTransaction plus bas).
      transactionalMerges.push({field:k, key, upserts:modifies, deletes:supprimes});
    }
    if(nouveaux.length) payload[k] = firebase.firestore.FieldValue.arrayUnion(...nouveaux);
  });
  return {payload, transactionalMerges};
}

// Fusionne des modifications et/ou suppressions locales (sur des entrées déjà existantes
// d'un champ liste partagé : ventes, customerOrders, réclamations, dépenses…) sans
// écraser une entrée créée entre-temps par un autre appareil. On relit la vraie version
// serveur À L'INTÉRIEUR de la transaction (donc toujours à jour, même si notre copie
// locale a du retard), on y retire les entrées supprimées, on y applique nos modifs par
// identifiant, et on garde intactes toutes les entrées serveur qu'on ne connaît pas
// encore en local.
async function mergeArrayFieldViaTransaction(field, key, upserts, deletes){
  await db.runTransaction(async tx=>{
    const snap = await tx.get(sharedDocRef);
    const serverArr = (snap.exists && Array.isArray(snap.data()[field])) ? snap.data()[field] : [];
    const deleteSet = new Set(deletes||[]);
    const map = new Map();
    serverArr.forEach(it=>{ if(it && it[key]!=null && !deleteSet.has(it[key])) map.set(it[key], it); });
    (upserts||[]).forEach(it=>{ if(it && it[key]!=null) map.set(it[key], it); });
    tx.set(sharedDocRef, {[field]: Array.from(map.values())}, {merge:true});
  });
}

function setSyncStatus(status){
  const el = document.getElementById('sync-status');
  if(!el) return;
  if(status==='ok'){ el.textContent='🟢'; el.title='Synchronisé avec le réseau'; }
  else if(status==='error'){ el.textContent='🔴'; el.title='Non synchronisé — nouvel essai automatique en cours'; }
  else { el.textContent='🟡'; el.title='Synchronisation en cours…'; }
}

let applyingRemoteUpdate = false; // évite de renvoyer sur Firebase ce qu'on vient d'en recevoir
// Tant que sharedStateReady est faux, on n'a pas encore la certitude d'avoir reçu les
// vraies données du serveur (chargement en cours, ou échec réseau au démarrage sur un
// nouvel appareil) : on interdit tout envoi vers Firebase, sinon un état local encore
// vide (catalogue, points, etc.) écraserait les données partagées de tout le monde.
let sharedStateReady = false;
let __saveSharedTimer = null;
let __saveInFlight = false;
let __saveAgainAfter = false;

async function flushSharedState(){
  clearTimeout(__saveSharedTimer);
  __saveSharedTimer = null;
  if(applyingRemoteUpdate) return;
  if(!sharedStateReady){
    // On ne sait pas encore avec certitude ce que contient le serveur (chargement
    // initial pas terminé, ou échec réseau) : on réessaie un peu plus tard au lieu
    // d'envoyer maintenant, pour ne jamais écraser les vraies données partagées.
    __saveSharedTimer = setTimeout(flushSharedState, 1000);
    return;
  }
  if(__saveInFlight){ __saveAgainAfter = true; return; }
  const {payload, transactionalMerges} = buildSharedPayload();
  if(Object.keys(payload).length===0 && transactionalMerges.length===0) return;
  __saveInFlight = true;
  setSyncStatus('pending');
  try{
    if(Object.keys(payload).length) await sharedDocRef.set(payload, {merge:true});
    // Les modifs d'entrées existantes (ventes, commandes…) passent chacune par une
    // transaction qui relit d'abord la vraie version serveur, pour ne jamais effacer une
    // entrée créée entre-temps par un autre appareil (voir mergeArrayFieldViaTransaction).
    for(const m of transactionalMerges){
      await mergeArrayFieldViaTransaction(m.field, m.key, m.upserts, m.deletes);
    }
    markAllSynced();
    setSyncStatus('ok');
  }catch(e){
    console.error('Erreur de sauvegarde Firebase', e);
    setSyncStatus('error');
    toast("⚠️ Sauvegarde non envoyée (réseau). Nouvel essai automatique…");
  }finally{
    __saveInFlight = false;
    if(__saveAgainAfter){ __saveAgainAfter = false; flushSharedState(); }
  }
}

// immediate=true : on saute le délai (utilisé juste après une vente, une réclamation,
// une commande... pour qu'elles partent tout de suite sans attendre le debounce).
function saveSharedState(immediate){
  if(applyingRemoteUpdate) return;
  clearTimeout(__saveSharedTimer);
  if(immediate){ flushSharedState(); return; }
  __saveSharedTimer = setTimeout(flushSharedState, 250);
}

// Filet de sécurité : si le vendeur ferme l'appli / change d'appli / verrouille son
// téléphone juste après une action, on force l'envoi immédiat de ce qui est en attente
// au lieu de laisser le minuteur (souvent suspendu en arrière-plan sur mobile) se perdre.
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushSharedState(); });
window.addEventListener('pagehide', flushSharedState);
window.addEventListener('beforeunload', flushSharedState);
window.addEventListener('online', flushSharedState);

/* ========================= PRÉSENCE EN LIGNE (qui est connecté en ce moment) =========================
   Chaque appareil connecté envoie un petit signal ("battement") toutes les 20 secondes
   dans un document Firestore séparé, sous une clé unique à cette session (un onglet /
   un appareil = une clé). Le PDG écoute ce document en direct et considère quelqu'un
   "en ligne" si son dernier battement date de moins de 45 secondes — ce qui gère aussi
   le cas où quelqu'un ferme l'appli brutalement (coupure batterie, pas de réseau pour
   prévenir) sans dépendre d'un événement de déconnexion. */
const presenceDocRef = db.collection('mperfect-pub').doc('presence');
const PRESENCE_TTL_MS = 45000;
const PRESENCE_INTERVAL_MS = 20000;
let __sessionId = sessionStorage.getItem('mperfect-session-id');
if(!__sessionId){
  __sessionId = 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2,10);
  sessionStorage.setItem('mperfect-session-id', __sessionId);
}
let __presenceTimer = null;

function presenceDisplayName(role, staffName){
  if(staffName) return staffName;
  if(ROLE_NAMES[role]) return ROLE_NAMES[role];
  return ROLE_LABELS[role] || role;
}

async function sendHeartbeat(){
  try{
    await presenceDocRef.set({
      [__sessionId]: {
        role: state.role,
        name: presenceDisplayName(state.role, state.__staffName || ''),
        page: state.page || '',
        ts: Date.now(),
      }
    }, {merge:true});
  }catch(e){ /* pas grave : la présence n'est qu'indicative, on retentera au prochain battement */ }
}

function startPresenceHeartbeat(){
  if(state.role==='pdg' && !state.__staffName) return; // le PDG lui-même n'a pas besoin de se voir "en ligne"
  clearInterval(__presenceTimer);
  sendHeartbeat();
  __presenceTimer = setInterval(sendHeartbeat, PRESENCE_INTERVAL_MS);
}

function clearHeartbeat(){
  clearInterval(__presenceTimer);
  __presenceTimer = null;
  presenceDocRef.set({[__sessionId]: firebase.firestore.FieldValue.delete()}, {merge:true}).catch(()=>{});
}
// Filet de sécurité symétrique à flushSharedState : on retire la présence si l'appli
// se ferme proprement, et on relance le battement dès qu'elle redevient visible.
window.addEventListener('pagehide', clearHeartbeat);
window.addEventListener('beforeunload', clearHeartbeat);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && __presenceTimer===null && state.role) startPresenceHeartbeat(); });

let onlineStaff = []; // rempli en direct par listenToPresence(), lu par renderDashboard()
function listenToPresence(){
  presenceDocRef.onSnapshot(snap=>{
    if(!snap.exists){ onlineStaff = []; if(state.role==='pdg') renderPage(); return; }
    const data = snap.data();
    const now = Date.now();
    onlineStaff = Object.entries(data)
      .filter(([id, v])=>v && v.ts && (now - v.ts) < PRESENCE_TTL_MS)
      .map(([id, v])=>({id, ...v}))
      .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    if(state.role==='pdg') renderPage();
  }, ()=>{});
}
// Le statut "en ligne" dépend du temps écoulé, pas seulement des nouveaux messages Firestore :
// on rafraîchit donc l'affichage PDG régulièrement même sans nouveau battement reçu.
setInterval(()=>{ if(state.role==='pdg' && state.page==='dashboard') renderPage(); }, 15000);

// Sauvegarde automatique silencieuse (locale) toutes les 60s.
setInterval(autoBackupToLocal, 60000);

function savePersonalState(){
  try{
    const payload = {};
    PERSONAL_FIELDS.forEach(k=>payload[k]=state[k]);
    localStorage.setItem(PERSONAL_KEY, JSON.stringify(payload));
  }catch(e){ console.error('Erreur de sauvegarde locale (panier)', e); }
}

function loadPersonalState(){
  try{
    const raw = localStorage.getItem(PERSONAL_KEY);
    if(raw) Object.assign(state, JSON.parse(raw));
  }catch(e){ /* aucun panier local enregistré */ }
}

async function loadState(){
  loadPersonalState();
  try{
    // On force la lecture depuis le VRAI serveur (et non depuis le cache local du
    // téléphone, même si la persistance hors-ligne est activée) : sinon, sur un
    // appareil qui a un vieux cache (ex: un livreur qui a ouvert l'app une première
    // fois avant que le catalogue soit complété), l'app croirait avoir les vraies
    // données et autoriserait un envoi qui écraserait la version à jour sur Firebase.
    // Si l'appareil est vraiment hors-ligne, ceci échoue (voir catch) et on attend
    // listenToSharedState() pour une confirmation fiable avant d'autoriser un envoi.
    const snap = await sharedDocRef.get({source:'server'});
    if(snap.exists){
      applyingRemoteUpdate = true;
      Object.assign(state, mergeIncomingAppendFields(snap.data()));
      noteNonEmptyFields(snap.data());
      applyingRemoteUpdate = false;
    }
    await migrateLegacyProductImages();
    applyProductImages();
    await migrateLegacyInvoiceNotes();
    sharedStateReady = true; // on a désormais la certitude d'avoir les vraies données (ou l'absence confirmée)
    markAllSynced();
    setSyncStatus('ok');
  }catch(e){
    console.error('Erreur de chargement Firebase', e);
    setSyncStatus('error');
    // sharedStateReady reste faux : on attend listenToSharedState() (onSnapshot) pour
    // recevoir les vraies données avant d'autoriser le moindre envoi vers le serveur.
  }
}

function listenToSharedState(){
  sharedDocRef.onSnapshot(snap=>{
    if(snap.metadata.fromCache && !sharedStateReady){
      // Sur un appareil qui n'a jamais ouvert l'app (ex: nouveau livreur), le tout
      // premier instantané Firestore peut venir du cache local (vide) au lieu du
      // serveur, avant même que la connexion réseau ait répondu. Si on autorisait un
      // envoi à ce moment-là, l'état par défaut (catalogue de démo, etc.) écraserait
      // les vraies données partagées. On attend donc une confirmation venant
      // réellement du serveur avant d'autoriser le moindre envoi.
      return;
    }
    sharedStateReady = true;
    if(!snap.exists) return;
    const incoming = mergeIncomingAppendFields(snap.data());
    applyIncomingDirectFields(incoming);
    noteNonEmptyFields(snap.data());
    const prevNumeros = new Set((state.ventes||[]).map(v=>v.numero));
    applyingRemoteUpdate = true;
    Object.assign(state, incoming);
    applyProductImages();
    // Si le client a une commande ouverte dans "Suivre ma commande", on la
    // remet à jour avec les nouvelles données reçues (sinon son écran restait
    // figé sur l'ancien statut tant qu'il ne relançait pas une recherche).
    if(state.trackingResult && state.trackingResult.tracking){
      const fresh = (state.customerOrders||[]).find(o=>o.tracking===state.trackingResult.tracking);
      if(fresh) state.trackingResult = fresh;
    }
    renderAll();
    // Rafraîchit aussi l'espace boutique (Suivre ma commande, catalogue, etc.)
    // si le client s'y trouve actuellement — renderAll() ne met à jour que
    // l'espace interne (#content), jamais #boutique-content.
    const boutiqueShellEl = document.getElementById('boutique-shell');
    if(boutiqueShellEl && boutiqueShellEl.style.display !== 'none'){
      renderBoutiquePage();
    }
    applyingRemoteUpdate = false;
    markAllSynced(); // ce que le serveur nous renvoie est désormais "connu synchronisé"
    setSyncStatus('ok');
    if(sharedStateInitialized && state.role==='pdg'){
      (state.ventes||[]).filter(v=>!prevNumeros.has(v.numero) && !myOwnSaleNumeros.has(v.numero)).forEach(showSaleNotification);
    }
    sharedStateInitialized = true;
  }, err=>{
    console.error('Erreur de synchronisation Firebase', err);
    setSyncStatus('error');
  });
}

/* ========================= SAUVEGARDE / RESTAURATION ========================= */
const ALL_BACKUP_FIELDS = SHARED_FIELDS.concat(['stock','visits'], PERSONAL_FIELDS);
const AUTO_BACKUP_LOCAL_KEY = 'mperfect-autobackup-local';

// Sauvegarde silencieuse : écrit l'état courant dans le stockage du téléphone
// (localStorage) toutes les 60s, sans aucune action de l'utilisateur. Sert de
// filet de secours si l'app plante ou si Firestore est injoignable — elle ne
// remplace pas le vrai fichier téléchargé, mais couvre l'intervalle entre deux
// sauvegardes manuelles.
function autoBackupToLocal(){
  try{
    const payload = {};
    ALL_BACKUP_FIELDS.forEach(k=>payload[k]=state[k]);
    const record = { __mperfectBackup: true, date: new Date().toISOString(), data: payload };
    localStorage.setItem(AUTO_BACKUP_LOCAL_KEY, JSON.stringify(record));
  }catch(e){
    // Le stockage local peut être plein ou désactivé (navigation privée) : on
    // n'affiche rien à l'utilisateur pour ne pas le déranger toutes les minutes,
    // la sauvegarde manuelle reste disponible dans tous les cas.
    console.error('Erreur sauvegarde auto locale', e);
  }
}

function getAutoBackupLocalInfo(){
  try{
    const raw = localStorage.getItem(AUTO_BACKUP_LOCAL_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && parsed.date ? parsed : null;
  }catch(e){ return null; }
}

function restoreAutoBackupLocal(){
  const record = getAutoBackupLocalInfo();
  if(!record){ toast('Aucune sauvegarde automatique locale trouvée sur ce téléphone.'); return; }
  const when = new Date(record.date).toLocaleString('fr-FR');
  if(!confirm(`Restaurer la sauvegarde automatique du ${when} ? Cela va remplacer les données actuelles (stock, ventes, clients, etc.).`)) return;
  try{
    const source = record.data;
    ALL_BACKUP_FIELDS.forEach(k=>{ if(k in source) state[k] = source[k]; });
    saveSharedState();
    if('stock' in source){
      sharedDocRef.set({stock: source.stock}, {merge:true}).catch(e=>console.error('Erreur restauration stock', e));
    }
    if('products' in source){
      migrateLegacyProductImages().then(applyProductImages).then(renderPage);
    }
    savePersonalState();
    renderAll();
    toast('Sauvegarde automatique restaurée avec succès');
  }catch(err){
    console.error('Erreur restauration auto locale', err);
    toast('Erreur lors de la restauration de la sauvegarde automatique');
  }
}

function exportBackup(){
  try{
    const payload = {};
    ALL_BACKUP_FIELDS.forEach(k=>payload[k]=state[k]);
    const data = { __mperfectBackup: true, date: new Date().toISOString(), data: payload };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `mperfect-pub-sauvegarde-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Sauvegarde téléchargée sur votre téléphone');
  }catch(e){
    console.error('Erreur export sauvegarde', e);
    toast('Erreur lors de la sauvegarde');
  }
}

function triggerImportBackup(){
  const input = document.getElementById('backup-file-input');
  if(input) input.click();
}

function importBackup(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const source = parsed && parsed.__mperfectBackup ? parsed.data : parsed;
      if(!source || typeof source !== 'object') throw new Error('Format invalide');
      if(!confirm('Restaurer cette sauvegarde va remplacer les données actuelles (stock, ventes, clients, etc.). Continuer ?')) return;
      ALL_BACKUP_FIELDS.forEach(k=>{ if(k in source) state[k] = source[k]; });
      saveSharedState();
      if('stock' in source){
        // restauration explicite et volontaire du PDG : on remplace le stock partagé
        // en entier (contrairement aux mouvements courants qui passent par une transaction).
        sharedDocRef.set({stock: source.stock}, {merge:true}).catch(e=>console.error('Erreur restauration stock', e));
      }
      if('products' in source){
        // les images des produits vivent dans leur propre collection (voir plus haut) :
        // on les restaure aussi, sinon elles resteraient absentes après la restauration.
        migrateLegacyProductImages().then(applyProductImages).then(renderPage);
      }
      savePersonalState();
      renderAll();
      toast('Sauvegarde restaurée avec succès');
    }catch(err){
      console.error('Erreur import sauvegarde', err);
      toast('Fichier de sauvegarde invalide');
    }finally{
      fileInput.value = '';
    }
  };
  reader.readAsText(file);
}

function setInnerHTMLPreservingFocus(el, html){
  const active = document.activeElement;
  let saved = null;
  // De nombreux champs (réclamation, boutique, etc.) n'ont pas d'id : sans ça,
  // le focus était perdu dès la première lettre tapée (le re-rendu remplaçait
  // le champ par un autre, non focalisé, donnant l'impression que le champ
  // "éjecte" le texte). On retombe donc sur l'attribut oninput/onchange, qui
  // est stable d'un rendu à l'autre, pour retrouver le même champ après coup.
  if(active && el.contains(active)){
    const attr = active.getAttribute('oninput') ? 'oninput' : (active.getAttribute('onchange') ? 'onchange' : null);
    if(active.id || attr){
      const isTextField = (active.tagName==='INPUT' && ['text','number','tel','email','search','url','password'].includes(active.type)) || active.tagName==='TEXTAREA';
      saved = {
        id: active.id || null,
        attr, attrValue: attr ? active.getAttribute(attr) : null,
        start: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
        end: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null,
        // On mémorise aussi le texte en cours de frappe : sans ça, un re-rendu déclenché
        // pendant la saisie (une vente enregistrée ailleurs, une image mise à jour…)
        // remplaçait le champ par sa dernière valeur CONNUE DU SERVEUR — pas encore
        // enregistrée — effaçant ainsi ce que la personne était en train d'écrire
        // (ex. la catégorie d'un produit) alors même que le curseur restait en place.
        value: isTextField ? active.value : null,
      };
    }
  }
  // Pendant une course en cours (guidage vocal), le panneau d'itinéraire se
  // ré-affiche régulièrement : sans ça, sa position de défilement revenait
  // en haut à chaque mise à jour, donnant l'impression que "l'écran recharge
  // sans arrêt et ne reste pas en place".
  const itinPanel = el.querySelector('.itineraire-panel');
  const itinScroll = itinPanel ? itinPanel.scrollTop : null;
  el.innerHTML = html;
  if(saved){
    let el2 = saved.id ? document.getElementById(saved.id) : null;
    if(!el2 && saved.attr && saved.attrValue){
      try{ el2 = el.querySelector(`[${saved.attr}="${CSS.escape(saved.attrValue)}"]`); }catch(e){}
    }
    if(el2){
      if(saved.value !== null && 'value' in el2) el2.value = saved.value;
      el2.focus();
      if(saved.start !== null && el2.setSelectionRange){
        try{ el2.setSelectionRange(saved.start, saved.end); }catch(e){}
      }
    }
  }
  if(itinScroll!=null){
    const itinPanel2 = el.querySelector('.itineraire-panel');
    if(itinPanel2) itinPanel2.scrollTop = itinScroll;
  }
}

function toast(msg){
