<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --blue-900:#122E45; --blue-800:#173C5A; --blue-700:#1E4870; --blue-500:#3572A0; --blue-100:#E7EFF6;
  --orange-600:#C9631A; --orange-500:#E2802E; --orange-100:#FCE7D4;
  --bg:#F2F5F9; --surface:#FFFFFF; --line:#E2E8F0; --text:#152233; --text-muted:#5C6B7C;
  --green:#268A54; --green-bg:#E4F5EC; --yellow:#C98A0F; --yellow-bg:#FBF0DA; --red:#C64236; --red-bg:#FBE7E5;
  --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(18,46,69,.04), 0 8px 24px -12px rgba(18,46,69,.14);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); overflow:hidden;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13px;}

/* ===== APP SHELL ===== */
.app{display:flex; height:100vh;}

/* Sidebar */
.sidebar{width:230px; background:var(--blue-900); color:#fff; display:flex; flex-direction:column; flex-shrink:0;}
.sidebar-head{display:flex; align-items:center; gap:10px; padding:20px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-head img{width:32px; height:32px;}
.sidebar-head .t1{font-family:'Sora',sans-serif; font-weight:800; font-size:13.5px;}
.sidebar-head .t2{font-size:9.5px; color:var(--orange-500); font-weight:700; letter-spacing:.08em;}
.nav{flex:1; overflow-y:auto; padding:12px 10px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; margin-bottom:2px;
  font-size:12.8px; font-weight:500; color:rgba(255,255,255,.68); cursor:pointer; border:none; background:none; width:100%; text-align:left;
}
.nav-item .ic{font-size:15px; width:18px; text-align:center;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--orange-500); color:#fff; font-weight:700;}
.sidebar-foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,.08); font-size:10px; color:rgba(255,255,255,.4);}

/* Main */
.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  height:60px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:0 24px;
}
.topbar h2{font-family:'Sora',sans-serif; font-size:17px; font-weight:700; color:var(--blue-900);}
.role-switch{display:flex; align-items:center; gap:10px;}
.role-switch label{font-size:11px; color:var(--text-muted);}
.role-switch select{padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--text); font-weight:600;}
.content{flex:1; overflow-y:auto; overflow-x:hidden; padding:26px 28px;}

/* ===== Shared components ===== */
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
.kpi-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px;}
.kpi-card .label{font-size:12px; color:var(--text-muted); font-weight:500;}
.kpi-card .value{font-family:'Sora',sans-serif; font-size:21px; font-weight:700; color:var(--blue-900); margin-top:6px;}
.kpi-card .delta{font-size:11.5px; margin-top:5px; font-weight:600;}
.delta.up{color:var(--green);} .delta.warn{color:var(--yellow);} .delta.down{color:var(--red);}

.grid2{display:grid; grid-template-columns:1.35fr 1fr; gap:16px;}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
.panel h3{font-family:'Sora',sans-serif; font-size:14.5px; font-weight:700; color:var(--blue-900); margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
.panel h3 .tag{font-size:10.5px; font-weight:600; color:var(--text-muted); background:var(--blue-100); padding:3px 8px; border-radius:20px;}

.btn{font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--blue-800);}
.btn:hover{background:var(--blue-100);}
.btn.primary{background:var(--blue-700); color:#fff; border-color:var(--blue-700);}
.btn.primary:hover{background:var(--blue-800);}
.btn.orange{background:var(--orange-500); color:#fff; border-color:var(--orange-500);}
.btn.orange:hover{background:var(--orange-600);}
.btn.sm{padding:5px 10px; font-size:11.5px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{text-align:left; font-size:11px; color:var(--text-muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
tbody td{padding:11px 10px; border-bottom:1px solid var(--line);}
tbody tr:last-child td{border-bottom:none;}
.stock-bar{width:70px; height:6px; background:var(--blue-100); border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px;}
.stock-bar>div{height:100%; background:var(--blue-500);}
.stock-bar.low>div{background:var(--red);}
.pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
.pill.ok{background:var(--green-bg); color:var(--green);}
.pill.low{background:var(--red-bg); color:var(--red);}
.pill.warn{background:var(--yellow-bg); color:var(--yellow);}

.pv-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.pv-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; position:relative;}
.pv-card .status-chip{position:absolute; top:14px; right:14px; font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--green-bg); color:var(--green);}
.pv-card h4{font-family:'Sora',sans-serif; font-size:15px; font-weight:700; color:var(--blue-900);}
.pv-card .loc{font-size:12px; color:var(--text-muted); margin-top:2px;}
.pv-card .resp{font-size:11.5px; color:var(--text-muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.pv-metrics{display:flex; gap:16px; margin-top:12px;}
.pv-metrics div{flex:1;}
.pv-metrics .l{font-size:10.5px; color:var(--text-muted);}
.pv-metrics .v{font-family:'Sora',sans-serif; font-size:14px; font-weight:700; margin-top:2px;}
.pv-postes{margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
.pv-postes-head{font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
.poste-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.poste-chip{display:inline-flex; align-items:center; gap:6px; background:var(--blue-100); color:var(--blue-800); font-size:11.5px; font-weight:600; padding:5px 6px 5px 10px; border-radius:20px;}
.poste-x{background:none; border:none; color:var(--blue-500); font-size:14px; line-height:1; padding:0 2px; border-radius:50%;}
.poste-x:hover{background:rgba(255,255,255,.6); color:var(--red);}
.empty-mini{font-size:11.5px; color:var(--text-muted); font-style:italic;}
.poste-add{display:flex; gap:8px; flex-wrap:wrap;}
.poste-add input{flex:1; min-width:120px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:12.5px;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field label{font-size:11.5px; font-weight:600; color:var(--text-muted);}
.field input, .field select, .field textarea{padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#fff;}

.cmd-cols{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
.cmd-col h4{font-size:11.5px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.cmd-col .d{width:7px; height:7px; border-radius:50%; display:inline-block;}
.cmd-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:11.5px; margin-bottom:8px;}
.cmd-card .id{font-weight:700; color:var(--blue-900);}
.cmd-card .pt{color:var(--text-muted); font-size:10.5px; margin:2px 0 8px;}
.cmd-card select{width:100%; font-size:11px; padding:4px 6px;}

.invoice{background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; max-width:340px;}
.invoice-head{display:flex; align-items:center; gap:10px; border-bottom:1px dashed var(--line); padding-bottom:12px; margin-bottom:12px;}
.invoice-head img{width:34px; height:34px;}
.invoice-head .h1{font-family:'Sora',sans-serif; font-size:12.5px; font-weight:700; color:var(--blue-900);}
.invoice-head .h2{font-size:10.5px; color:var(--text-muted);}
.invoice-row{display:flex; justify-content:space-between; font-size:12px; padding:4px 0;}
.invoice-row.total{border-top:1px solid var(--line); margin-top:8px; padding-top:10px; font-weight:700; font-size:13.5px; color:var(--blue-900);}

.map-legend{display:flex; gap:16px; margin-top:10px; font-size:11px; color:var(--text-muted);}
.map-legend span{display:flex; align-items:center; gap:5px;}
.map-legend i{width:8px; height:8px; border-radius:50%; background:var(--orange-500); display:inline-block;}

/* Itinéraire de livraison — suivi client boutique */
.route-map{background:var(--blue-100); border-radius:var(--radius-sm); padding:14px 12px 10px; margin:14px 0;}
.route-map-title{font-size:12px; font-weight:700; color:var(--blue-900); margin-bottom:6px;}
.route-addr-row{display:flex; justify-content:space-between; gap:10px; font-size:11px; color:var(--text-muted); margin-top:2px;}
.route-addr-row span:last-child{max-width:60%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.route-progress-lbl{text-align:center; font-size:11.5px; font-weight:700; margin-top:6px;}

.filters{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.filters span{font-size:12px; padding:6px 13px; border-radius:20px; background:#fff; border:1px solid var(--line); color:var(--text-muted); cursor:pointer;}
.filters span.on{background:var(--blue-700); color:#fff; border-color:var(--blue-700); font-weight:600;}
.bars{display:flex; align-items:flex-end; gap:14px; height:150px; padding-top:10px;}
.bars .b{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;}
.bars .col{width:100%; background:linear-gradient(180deg, var(--blue-500), var(--blue-700)); border-radius:5px 5px 0 0;}
.bars .lb{font-size:10.5px; color:var(--text-muted);}

.empty{text-align:center; color:var(--text-muted); font-size:13px; padding:40px 0;}
.toast{
  position:fixed; bottom:22px; right:22px; background:var(--blue-900); color:#fff; padding:12px 18px;
  border-radius:10px; font-size:12.5px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px);
  transition:.25s; pointer-events:none; z-index:50;
}
.toast.show{opacity:1; transform:translateY(0);}

/* Cartes de livraison — lisibles d'un coup d'oeil sur mobile */
.livraison-list{display:flex; flex-direction:column; gap:12px;}
.livraison-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
.livraison-card .lv-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px;}
.livraison-card .lv-tracking{font-weight:700; color:var(--blue-900); font-size:14px;}
.livraison-card .lv-row{display:flex; align-items:flex-start; gap:8px; font-size:15px; color:var(--text); margin-bottom:6px; line-height:1.35;}
.livraison-card .lv-row .ic{flex-shrink:0; font-size:16px;}
.livraison-card .lv-row a{color:var(--blue-700); font-weight:600; text-decoration:none;}
.livraison-card .lv-empty-field{color:var(--text-muted); font-style:italic;}
.livraison-card .lv-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.livraison-card .lv-actions .btn{flex:1; min-width:130px; min-height:46px; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;}

.itineraire-overlay{position:fixed; inset:0; background:rgba(15,23,42,.6); z-index:9999; display:flex; align-items:center; justify-content:center; padding:14px;}
.itineraire-panel{background:#fff; border-radius:16px; width:100%; max-width:680px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden;}
.itineraire-head{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line);}
.itineraire-head .btn{min-height:44px; min-width:44px; font-size:16px;}
.itineraire-status{padding:9px 16px; font-size:13px;}
.itineraire-panel iframe{border:0; width:100%; flex:1; min-height:300px;}

@media (max-width:900px){
  .sidebar{width:64px;}
  .sidebar-head .t1,.sidebar-head .t2{display:none;}
  .nav-item span.lbl{display:none;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .grid2{grid-template-columns:1fr;}
  .pv-grid{grid-template-columns:1fr;}
  .cmd-cols{grid-template-columns:repeat(2,1fr);}
  .form-grid{grid-template-columns:1fr;}
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .table-wrap table{min-width:480px;}
  .itineraire-overlay{padding:0;}
  .itineraire-panel{max-width:100%; max-height:100%; height:100%; border-radius:0;}
}

/* ===== BOUTIQUE CLIENT ===== */
.boutique-shell{height:100vh; display:flex; flex-direction:column; background:var(--bg);}
.boutique-topbar{
  background:linear-gradient(135deg, var(--blue-900), var(--blue-700));
  padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.boutique-brand{display:flex; align-items:center; gap:10px;}
.boutique-brand img{width:36px; height:36px;}
.boutique-brand .bb1{font-family:'Sora',sans-serif; font-weight:800; font-size:14px; color:#fff;}
.boutique-brand .bb2{font-size:10px; font-weight:700; color:var(--orange-500); letter-spacing:.08em;}
.boutique-nav{display:flex; gap:8px; flex-wrap:wrap;}
.boutique-nav .btn{background:rgba(255,255,255,.12); color:#fff; border-color:rgba(255,255,255,.2);}
.boutique-nav .btn:hover{background:rgba(255,255,255,.22);}
.boutique-nav .btn.primary{background:var(--orange-500); border-color:var(--orange-500);}
.boutique-content{flex:1; overflow-y:auto; padding:26px 28px; max-width:1000px; margin:0 auto; width:100%;}

.prod-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.prod-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px; text-align:center;}
.prod-card .ic{font-size:34px; margin-bottom:10px;}
.prod-card h4{font-family:'Sora',sans-serif; font-size:14.5px; font-weight:700; color:var(--blue-900);}
.prod-card .px{font-size:13px; color:var(--orange-600); font-weight:700; margin:6px 0 12px;}

.prod-list{display:flex; flex-direction:column; gap:10px;}
.prod-acc{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.prod-acc.open{border-color:var(--blue-500);}
.prod-acc-head{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;}
.prod-acc-head .ic{font-size:26px; flex-shrink:0;}
.prod-acc-thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0;}
.prod-acc-title{flex:1;}
.prod-acc-title h4{font-family:'Sora',sans-serif; font-size:14px; font-weight:700; color:var(--blue-900);}
.prod-acc-title .px{font-size:12.5px; color:var(--orange-600); font-weight:700; margin-top:2px;}
.prod-acc-chevron{color:var(--text-muted); font-size:12px; flex-shrink:0;}
.prod-acc-body{padding:0 14px 16px; border-top:1px solid var(--line); padding-top:12px;}
.prod-acc-desc{font-size:12.5px; color:var(--text-muted); line-height:1.5; margin-bottom:12px;}
.qty-row{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px;}
.qty-row button{width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:#fff; font-weight:700; color:var(--blue-800);}
.qty-row span{font-weight:700; min-width:18px;}

.cart-row{display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
.cart-row .nm{font-weight:700; font-size:13.5px; color:var(--blue-900);}
.cart-row .pr{font-size:12px; color:var(--text-muted); margin-top:2px;}
.cart-total{display:flex; justify-content:space-between; align-items:center; background:var(--blue-900); color:#fff; border-radius:12px; padding:16px 18px; margin-top:6px;}
.cart-total .lb{font-size:12.5px; color:rgba(255,255,255,.7);}
.cart-total .amt{font-family:'Sora',sans-serif; font-size:20px; font-weight:800;}

.track-box{background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px;}
.track-num{display:flex; gap:8px; margin-bottom:16px;}
.track-num input{flex:1;}
.timeline{display:flex; justify-content:space-between; margin:24px 0; position:relative;}
.timeline::before{content:""; position:absolute; top:14px; left:20px; right:20px; height:3px; background:var(--line); z-index:0;}
.tl-step{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; flex:1; text-align:center;}
.tl-step .dot{width:30px; height:30px; border-radius:50%; background:var(--line); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; margin-bottom:8px; border:3px solid var(--bg);}
.tl-step.done .dot{background:var(--green);}
.tl-step.active .dot{background:var(--orange-500); box-shadow:0 0 0 4px var(--orange-100);}
.tl-step .lb{font-size:11px; color:var(--text-muted); max-width:80px;}
.tl-step.done .lb, .tl-step.active .lb{color:var(--blue-900); font-weight:700;}
.track-loc{background:var(--orange-100); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--orange-600); font-weight:600; margin-top:16px;}
.order-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; font-size:12.5px;}
.order-card .id{font-weight:700; color:var(--blue-900); font-family:'Sora',sans-serif;}
</style>
</head>

/* Champs "liste" où chaque élément a un identifiant unique (numero / tracking / id).
   Pour ces champs, au lieu de renvoyer tout le tableau à chaque sauvegarde (ce qui
   écrase les ventes qu'un AUTRE vendeur vient d'ajouter sur le document partagé
   pendant qu'on n'avait pas encore reçu sa mise à jour), on n'envoie que les
   ÉLÉMENTS RÉELLEMENT NOUVEAUX via arrayUnion : Firestore les fusionne côté serveur
   de façon atomique, même si deux vendeurs enregistrent une vente au même moment.
   Si un élément déjà connu a été modifié en local (ex: paiement d'un reste, réclamation
   résolue), on retombe sur un envoi complet de ce tableau pour propager la modif. */
const APPEND_FIELDS = { ventes:'numero', customerOrders:'tracking', reclamations:'id' };
let lastSyncedSnapshot = { ventes:new Map(), customerOrders:new Map(), reclamations:new Map() };

function markAllSynced(){
  Object.keys(APPEND_FIELDS).forEach(field=>{
    const key = APPEND_FIELDS[field];
    const m = new Map();
    (state[field]||[]).forEach(it=>{ if(it && it[key]!=null) m.set(it[key], JSON.stringify(it)); });
    lastSyncedSnapshot[field] = m;
  });
}

/* ---- STOCK : écriture transactionnelle -----------------------------------
   Le stock reste un tableau (comme avant), mais au lieu d'écraser tout le
   tableau depuis l'état local (ce qui perdait la déduction d'un autre
   vendeur/point de vente si deux ventes du même article arrivaient en même
   temps), on passe par une transaction Firestore : elle relit la version la
   plus récente du document au moment de l'écriture, applique le changement
   dessus, et Firestore réessaie automatiquement en cas de conflit. Deux
   déductions simultanées sur le même article se cumulent donc correctement
   au lieu que l'une écrase l'autre. */
async function commitStockDelta(id, delta){
  if(!delta) return;
  try{
    await db.runTransaction(async tx=>{
      const snap = await tx.get(sharedDocRef);
      const data = snap.exists ? snap.data() : {};
      const stock = Array.isArray(data.stock) ? data.stock.slice() : (state.stock||[]).slice();
      const idx = stock.findIndex(s=>s.id===id);
      if(idx===-1) return;
      const item = {...stock[idx]};
      item.qty = Math.max(0, (item.qty||0) + delta);
      stock[idx] = item;
      tx.set(sharedDocRef, {stock}, {merge:true});
    });
    setSyncStatus('ok');
  }catch(e){
    console.error('Erreur transaction stock', e);
    setSyncStatus('error');
    toast('⚠️ Mouvement de stock non synchronisé (réseau). Nouvel essai automatique…');
    retryStockDelta(id, delta);
  }
}
// petite file de nouvelles tentatives pour les mouvements de stock qui ont échoué hors-ligne
let __stockRetryQueue = [];
function retryStockDelta(id, delta){ __stockRetryQueue.push({id, delta}); }

async function commitStockUpsert(item){
  try{
    await db.runTransaction(async tx=>{
      const snap = await tx.get(sharedDocRef);
      const data = snap.exists ? snap.data() : {};
      const stock = Array.isArray(data.stock) ? data.stock.slice() : (state.stock||[]).slice();
      const idx = stock.findIndex(s=>s.id===item.id);
      if(idx===-1) stock.push(item); else stock[idx] = item;
      tx.set(sharedDocRef, {stock}, {merge:true});
    });
    setSyncStatus('ok');
  }catch(e){
    console.error('Erreur transaction stock (article)', e);
    setSyncStatus('error');
    toast('⚠️ Article non synchronisé (réseau). Réessayez si besoin.');
  }
}

function buildSharedPayload(){
  const payload = {};
  SHARED_FIELDS.forEach(k=>{
    const key = APPEND_FIELDS[k];
    if(!key){ payload[k] = state[k]; return; }
    const known = lastSyncedSnapshot[k] || new Map();
    const current = state[k] || [];
    const nouveaux = [];
    let hasMutation = false;
    current.forEach(it=>{
      if(!it || it[key]==null) return;
      const prev = known.get(it[key]);
      if(prev===undefined) nouveaux.push(it);
      else if(prev!==JSON.stringify(it)) hasMutation = true;
    });
    if(hasMutation) payload[k] = current; // repli sûr : on renvoie tout pour propager la modif
    else if(nouveaux.length) payload[k] = firebase.firestore.FieldValue.arrayUnion(...nouveaux);
  });
  return payload;
}

function setSyncStatus(status){
  const el = document.getElementById('sync-status');
  if(!el) return;
  if(status==='ok'){ el.textContent='🟢'; el.title='Synchronisé avec le réseau'; }
  else if(status==='error'){ el.textContent='🔴'; el.title='Non synchronisé — nouvel essai automatique en cours'; }
  else { el.textContent='🟡'; el.title='Synchronisation en cours…'; }
}

let applyingRemoteUpdate = false; // évite de renvoyer sur Firebase ce qu'on vient d'en recevoir
let __saveSharedTimer = null;
let __saveInFlight = false;
let __saveAgainAfter = false;

async function flushSharedState(){
  clearTimeout(__saveSharedTimer);
  __saveSharedTimer = null;
  if(applyingRemoteUpdate) return;
  if(__saveInFlight){ __saveAgainAfter = true; return; }
  const payload = buildSharedPayload();
  if(Object.keys(payload).length===0) return;
  __saveInFlight = true;
  setSyncStatus('pending');
  try{
    await sharedDocRef.set(payload, {merge:true});
    markAllSynced();
    setSyncStatus('ok');
  }catch(e){
    console.error('Erreur de sauvegarde Firebase', e);
    setSyncStatus('error');
    toast("⚠️ Sauvegarde non envoyée (réseau). Nouvel essai automatique…");
  }finally{
    __saveInFlight = false;
    if(__saveAgainAfter){ __saveAgainAfter = false; flushSharedState(); }
  }
}

// immediate=true : on saute le délai (utilisé juste après une vente, une réclamation,
// une commande... pour qu'elles partent tout de suite sans attendre le debounce).
function saveSharedState(immediate){
  if(applyingRemoteUpdate) return;
  clearTimeout(__saveSharedTimer);
  if(immediate){ flushSharedState(); return; }
  __saveSharedTimer = setTimeout(flushSharedState, 250);
}

// Filet de sécurité : si le vendeur ferme l'appli / change d'appli / verrouille son

/* ========================= PRÉSENCE EN LIGNE (qui est connecté en ce moment) =========================
   Chaque appareil connecté envoie un petit signal ("battement") toutes les 20 secondes
   dans un document Firestore séparé, sous une clé unique à cette session (un onglet /
   un appareil = une clé). Le PDG écoute ce document en direct et considère quelqu'un
   "en ligne" si son dernier battement date de moins de 45 secondes — ce qui gère aussi
   le cas où quelqu'un ferme l'appli brutalement (coupure batterie, pas de réseau pour
   prévenir) sans dépendre d'un événement de déconnexion. */
const presenceDocRef = db.collection('mperfect-pub').doc('presence');
const PRESENCE_TTL_MS = 45000;
const PRESENCE_INTERVAL_MS = 20000;
let __sessionId = sessionStorage.getItem('mperfect-session-id');
if(!__sessionId){
  __sessionId = 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2,10);
  sessionStorage.setItem('mperfect-session-id', __sessionId);
}
let __presenceTimer = null;

function presenceDisplayName(role, staffName){
  if(staffName) return staffName;
  if(ROLE_NAMES[role]) return ROLE_NAMES[role];
  return ROLE_LABELS[role] || role;
}

async function sendHeartbeat(){
  try{
    await presenceDocRef.set({
      [__sessionId]: {
        role: state.role,
        name: presenceDisplayName(state.role, state.__staffName || ''),
        page: state.page || '',
        ts: Date.now(),
      }
    }, {merge:true});
  }catch(e){ /* pas grave : la présence n'est qu'indicative, on retentera au prochain battement */ }
}

function startPresenceHeartbeat(){
  if(state.role==='pdg' && !state.__staffName) return; // le PDG lui-même n'a pas besoin de se voir "en ligne"
  clearInterval(__presenceTimer);
  sendHeartbeat();
  __presenceTimer = setInterval(sendHeartbeat, PRESENCE_INTERVAL_MS);
}

function clearHeartbeat(){
  clearInterval(__presenceTimer);
  __presenceTimer = null;
  presenceDocRef.set({[__sessionId]: firebase.firestore.FieldValue.delete()}, {merge:true}).catch(()=>{});
}
// Filet de sécurité symétrique à flushSharedState : on retire la présence si l'appli
// se ferme proprement, et on relance le battement dès qu'elle redevient visible.
window.addEventListener('pagehide', clearHeartbeat);
window.addEventListener('beforeunload', clearHeartbeat);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && __presenceTimer===null && state.role) startPresenceHeartbeat(); });

let onlineStaff = []; // rempli en direct par listenToPresence(), lu par renderDashboard()
function listenToPresence(){
  presenceDocRef.onSnapshot(snap=>{
    if(!snap.exists){ onlineStaff = []; if(state.role==='pdg') renderPage(); return; }
    const data = snap.data();
    const now = Date.now();
    onlineStaff = Object.entries(data)
      .filter(([id, v])=>v && v.ts && (now - v.ts) < PRESENCE_TTL_MS)
      .map(([id, v])=>({id, ...v}))
      .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    if(state.role==='pdg') renderPage();
  }, ()=>{});
}

/* ========================= SAUVEGARDE / RESTAURATION ========================= */
const ALL_BACKUP_FIELDS = SHARED_FIELDS.concat(['stock'], PERSONAL_FIELDS);

function exportBackup(){
  try{
    const payload = {};
    ALL_BACKUP_FIELDS.forEach(k=>payload[k]=state[k]);
    const data = { __mperfectBackup: true, date: new Date().toISOString(), data: payload };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `mperfect-pub-sauvegarde-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Sauvegarde téléchargée sur votre téléphone');
  }catch(e){
    console.error('Erreur export sauvegarde', e);
    toast('Erreur lors de la sauvegarde');
  }
}

function triggerImportBackup(){
  const input = document.getElementById('backup-file-input');
  if(input) input.click();
}

function importBackup(fileInput){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const source = parsed && parsed.__mperfectBackup ? parsed.data : parsed;
      if(!source || typeof source !== 'object') throw new Error('Format invalide');
      if(!confirm('Restaurer cette sauvegarde va remplacer les données actuelles (stock, ventes, clients, etc.). Continuer ?')) return;
      ALL_BACKUP_FIELDS.forEach(k=>{ if(k in source) state[k] = source[k]; });
      saveSharedState();
      if('stock' in source){
        // restauration explicite et volontaire du PDG : on remplace le stock partagé
        // en entier (contrairement aux mouvements courants qui passent par une transaction).
        sharedDocRef.set({stock: source.stock}, {merge:true}).catch(e=>console.error('Erreur restauration stock', e));
      }
      savePersonalState();
      renderAll();
      toast('Sauvegarde restaurée avec succès');
    }catch(err){
      console.error('Erreur import sauvegarde', err);
      toast('Fichier de sauvegarde invalide');
    }finally{
      fileInput.value = '';
    }
  };
  reader.readAsText(file);
}

      if(sel) sel.value = state.role;
      return;
    }
  }
  state.role = role;
  const allowed = MENU.filter(m=>m.roles.includes(role));
  if(!allowed.find(m=>m.id===state.page)) state.page = allowed[0].id;
  renderAll();
}

function renderTopbar(){

}

function setInnerHTMLPreservingFocus(el, html){
  const active = document.activeElement;
  let saved = null;
  if(active && el.contains(active) && active.id){
    saved = {
      id: active.id,
      start: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
      end: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null,
    };
  }
  el.innerHTML = html;
  if(saved){
    const el2 = document.getElementById(saved.id);
    if(el2){
      el2.focus();
      if(saved.start !== null && el2.setSelectionRange){
        try{ el2.setSelectionRange(saved.start, saved.end); }catch(e){}
      }
    }
  }
}
function renderPage(){

    finances: renderFinances, parametres: renderParametres,

  setInnerHTMLPreservingFocus(el, (renderers[state.page] || (()=>'<div class="empty">Page introuvable</div>'))());
  saveSharedState();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function computePointSales(){
  // Calcule les ventes du jour / du mois à partir des ventes réelles (state.ventes),
  // au lieu d'un compteur cumulé qui ne se remettait jamais à zéro — c'est ce compteur
  // jamais réinitialisé qui pouvait rendre "Revenus du jour" plus grand que le total.
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const byPoint = {};
  state.points.forEach(p=>{ byPoint[p.loc] = {jour:0, mois:0}; });
  state.ventes.forEach(v=>{
    if(!byPoint[v.point]) byPoint[v.point] = {jour:0, mois:0};
    if(v.ts && v.ts>=monthStart) byPoint[v.point].mois += v.total;
    if(v.ts && v.ts>=dayStart) byPoint[v.point].jour += v.total;
  });
  return byPoint;
}

function handleProductImageFile(name, fileList){
  const file = fileList && fileList[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 600;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        const scale = maxDim / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const p = state.products.find(x=>x.name===name);
      if(p){
        p.img = canvas.toDataURL('image/jpeg', 0.78);
        toast(`Image mise à jour pour "${name}"`);
        renderPage();
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

let __mediaRecorder = null;
let __audioChunks = [];
async function toggleVoiceRecording(){
  const btn = document.getElementById('voice-record-btn');
  if(__mediaRecorder && __mediaRecorder.state === 'recording'){
    __mediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    __audioChunks = [];
    const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    const mimeType = candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    __mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
    __mediaRecorder.ondataavailable = e => { if(e.data.size>0) __audioChunks.push(e.data); };
    __mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      const usedType = __mediaRecorder.mimeType || mimeType || 'audio/webm';
      const blob = new Blob(__audioChunks, {type: usedType});
      const reader = new FileReader();
      reader.onload = () => {
        state.saleDraft.noteAudio = reader.result;
        renderPage();
      };
      reader.readAsDataURL(blob);
    };
    __mediaRecorder.start();
    if(btn){ btn.textContent = '⏹️ Arrêter l\'enregistrement'; }
    toast('Enregistrement en cours… appuyez à nouveau pour arrêter.');
  }catch(e){
    toast("Impossible d'accéder au micro — vérifiez les autorisations du navigateur.");
  }
}

        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.saleDraft.noteImages = state.saleDraft.noteImages || [];
        state.saleDraft.noteImages.push(canvas.toDataURL('image/jpeg', 0.7));
        remaining--;
        if(remaining===0) renderPage();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function removeSaleImage(index){
  state.saleDraft.noteImages.splice(index, 1);
  renderPage();
}
function currentVendeurName(pointLoc){
  if(state.role==='vendeur') return ROLE_NAMES.vendeur || 'Vendeur du point';
  if(state.role==='responsable'){
    const pt = state.points.find(p=>p.loc===pointLoc);
    return (pt && pt.resp && pt.resp.trim()) || 'Responsable de point';
  }
  if(state.role==='pdg') return ROLE_NAMES.pdg || 'PDG / Administrateur';
  return 'Vendeur du point';
}
function validateSale(){
  const d = state.saleDraft;
  const pt = state.points.find(p=>p.loc===d.point);
  const needsPoste = pt && pt.postes && pt.postes.length>0;
  if(!d.produit || !d.client || d.qty<=0){ toast('Merci de compléter tous les champs de la vente.'); return; }
  const isPhotocopie = (d.produit||'').toLowerCase().includes('photocopie');
  if(!isPhotocopie && (!d.clientTel || !d.clientTel.trim())){ toast('Le numéro de téléphone du client est obligatoire.'); return; }
  if(d.suivi && (!d.adresse || !d.adresse.trim())){ toast("L'adresse / localité de livraison est obligatoire pour une commande suivie."); return; }
  if(needsPoste && !d.poste){ toast('Merci de choisir le poste exact (ex : Keur Massar, Jaxaay…).'); return; }
  const total = d.prix * d.qty;
  const avance = Math.min(Math.max(0, parseInt(d.avance)||0), total);
  const restant = total - avance;
  state.invoiceCounter++;
  const invoice = {
    numero: 'MP-2026-' + state.invoiceCounter + '-' + shortSuffix(), date: new Date().toLocaleString('fr-FR'), ts: Date.now(),
    point: d.point, poste: needsPoste ? d.poste : '', produit: d.produit, qty: d.qty, prix: d.prix, total, client: d.client, clientTel: d.clientTel.trim(), avance, restant, paiement: d.paiement,
    vendeur: currentVendeurName(d.point),
    noteText: d.noteText||'', noteAudio: d.noteAudio||null, noteImages: (d.noteImages||[]).slice(),
  };
  state.lastInvoice = invoice;
  myOwnSaleNumeros.add(invoice.numero);
  state.ventes.unshift(invoice);
  deductStockForSale(d.produit, d.qty);
  let trackingMsg = '';
  if(d.suivi){
    const tracking = invoice.numero; // même numéro que la facture : plus de confusion entre vente et suivi
    state.customerOrders.unshift({
      tracking, items:[{name:d.produit, prix:d.prix, qty:d.qty}], total,
      client:d.client, tel:d.clientTel.trim(), adresse:(d.adresse||'').trim(), point:d.point, paiement:d.paiement,
      avance, restant,
      status:'recue', progress:0, location:'', date:new Date().toLocaleString('fr-FR'), ts: Date.now(), source:'vente', livreur:'',
      delai: (d.delai||'').trim(), noteText: d.noteText||'', noteAudio: d.noteAudio||null, noteImages: (d.noteImages||[]).slice(),
    });
    invoice.tracking = tracking;
    invoice.delai = (d.delai||'').trim();
    trackingMsg = ` · Suivi avec le même numéro (${tracking})` + (d.delai ? ` · Délai annoncé : ${d.delai}` : '');
  }
  const earnedPoints = Math.floor(total / 1000);
  const client = findOrCreateClient(d.client, d.point);
  client.achats += 1;
  client.total += total;
  client.points += earnedPoints;
  state.saleDraft = {point:d.point, poste: needsPoste ? d.poste : '', produit:'', qty:1, prix:0, client:'', clientTel:'', adresse:'', avance:0, paiement:'Wave', suivi:false, delai:'', noteText:'', noteAudio:null, noteImages:[]};
  toast((restant>0
    ? `Vente enregistrée — avance ${money(avance)}, reste ${money(restant)} · ${client.name} gagne ${earnedPoints} point(s)`
    : `Vente enregistrée — payée intégralement · ${client.name} gagne ${earnedPoints} point(s) fidélité`) + trackingMsg);
  renderPage();
  saveSharedState(true); // envoi immédiat : ne pas attendre le debounce pour une vente
}
function payRestant(numero, montant){
  const v = state.ventes.find(x=>x.numero===numero);
  if(!v){ toast('Facture introuvable.'); return; }
  montant = Math.max(0, parseInt(montant) || 0);
  if(montant<=0){ toast('Merci de saisir un montant valide.'); return; }
  const restantAvant = v.restant || 0;
  const applied = Math.min(montant, restantAvant);
  v.avance = (v.avance || 0) + applied;
  v.restant = Math.max(0, restantAvant - applied);
  if(v.tracking){
    const order = state.customerOrders.find(o=>o.tracking===v.tracking);
    if(order){ order.avance = v.avance; order.restant = v.restant; }
  }
  saveSharedState(true);
  toast(v.restant>0
    ? `Paiement de ${money(applied)} enregistré — reste ${money(v.restant)} sur la facture ${v.numero}`
    : `Facture ${v.numero} soldée intégralement`);
  renderPage();
}
function deductStockForSale(produitName, qty){
  const name = (produitName||'').toLowerCase();
  const item = state.stock.find(s => name.includes(s.name.toLowerCase()) || s.name.toLowerCase().includes(name));
  if(!item) return null;
  item.qty = Math.max(0, item.qty - qty);
  if(item.qty < item.threshold){
    toast(`⚠️ Stock "${item.name}" bas : ${item.qty} ${item.unit} restant(s)`);
  }
  commitStockDelta(item.id, -qty);
  return item;
}
function findOrCreateClient(name, point){
  name = (name||'').trim();
  let c = state.clients.find(cl=>cl.name.toLowerCase()===name.toLowerCase());
  if(!c){
    c = {name, point, achats:0, total:0, points:0};
    state.clients.push(c);
  }
  return c;
}
function adjustClientPoints(name, delta){
  const c = state.clients.find(cl=>cl.name===name);
  if(!c) return;
  c.points = Math.max(0, c.points + delta);
  toast(`${delta>0?'+':''}${delta} point(s) pour ${c.name} — total : ${c.points}`);
  renderPage();
}
function setClientPoints(name, value){
  const c = state.clients.find(cl=>cl.name===name);
  if(!c) return;
  const v = Math.max(0, parseInt(value) || 0);
  c.points = v;
  toast(`Points de ${c.name} mis à jour : ${c.points}`);
  renderPage();
}

function printInvoice(){
  const inv = state.lastInvoice;
  if(!inv){ toast('Aucune facture à imprimer.'); return; }
  const printDoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Facture ${inv.numero}</title>
  <style>${INVOICE_CSS}</style></head><body>${invoiceHTML(inv)}</body></html>`;

  let iframe = document.getElementById('print-frame');
  if(iframe) iframe.remove();
  iframe = document.createElement('iframe');
  iframe.id = 'print-frame';
  iframe.style.position = 'fixed';
  iframe.style.right = '0'; iframe.style.bottom = '0'; iframe.style.width = '0'; iframe.style.height = '0'; iframe.style.border = '0';
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(printDoc);
  doc.close();

  const doPrint = () => {
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }catch(e){
      toast("Impossible d'ouvrir l'impression — merci d'autoriser les fenêtres contextuelles.");
    }
  };
  if(iframe.contentDocument && iframe.contentDocument.readyState === 'complete'){
    setTimeout(doPrint, 150);
  } else {
    iframe.onload = () => setTimeout(doPrint, 150);
  }
}
function copyTextFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
async function generateInvoicePDFBlob(inv){
  const holder = document.createElement('div');
  holder.style.position = 'fixed';
  holder.style.top = '0';
  holder.style.left = '0';
  holder.style.zIndex = '-9999';
  holder.style.background = '#fff';
  holder.style.width = '560px';
  holder.style.padding = '20px';
  holder.style.boxSizing = 'border-box';
  holder.innerHTML = `<style>${INVOICE_CSS}</style>${invoiceHTML(inv)}`;
  document.body.appendChild(holder);
  try{
    const imgs = Array.from(holder.querySelectorAll('img'));
    await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(res=>{ img.onload = res; img.onerror = res; })));
    await new Promise(res => setTimeout(res, 80));

    const canvas = await html2canvas(holder, { scale:2, backgroundColor:'#ffffff', useCORS:true });
    if(canvas.width === 0 || canvas.height === 0){ throw new Error('Rendu vide'); }
    const imgData = canvas.toDataURL('image/png');

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'pt', format:'a4' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const margin = 24;
    const usableWidth = pageWidth - margin*2;
    const imgHeight = (canvas.height * usableWidth) / canvas.width;
    pdf.addImage(imgData, 'PNG', margin, margin, usableWidth, imgHeight);
    return pdf.output('blob');
  } finally {
    document.body.removeChild(holder);
  }
}
async function shareInvoice(){
  const inv = state.lastInvoice;
  if(!inv){ toast('Aucune facture à partager.'); return; }
  const filename = `Facture-${inv.numero}.pdf`;
  toast('Préparation du PDF…');
  try{
    const blob = await generateInvoicePDFBlob(inv);
    const file = new File([blob], filename, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:`Facture ${inv.numero}`, text:`Facture ${inv.numero} — MPERFECT PUB` });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('PDF téléchargé — partagez-le depuis vos fichiers.');
  }catch(e){
    console.error('Erreur génération PDF', e);
    const text = `Facture ${inv.numero} — MPERFECT PUB\nPoint : ${inv.point}${inv.poste?' · '+inv.poste:''}\nClient : ${inv.client}\n${inv.produit} ×${inv.qty}\nTotal : ${money(inv.total)}\nPaiement : ${inv.paiement}\nDate : ${inv.date}`;
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{ await navigator.clipboard.writeText(text); toast('PDF indisponible — facture copiée en texte.'); return; }catch(e2){}
    }
    if(copyTextFallback(text)){ toast('PDF indisponible — facture copiée en texte.'); return; }
    toast('Partage indisponible sur ce navigateur');
  }
}

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        state.itineraire.lat = pos.coords.latitude;
        state.itineraire.lng = pos.coords.longitude;
        if(!state.itineraire.manualAdresse) state.itineraire.geoStatus = 'ok';
        renderPage();
      },
      ()=>{ if(!state.itineraire.manualAdresse) state.itineraire.geoStatus = 'denied'; renderPage(); },
      {enableHighAccuracy:true, timeout:8000}
    );
  } else {
    state.itineraire.geoStatus = 'unsupported';
    renderPage();
  }

  state.ventes.forEach(v=>{

    if(!groupes[key]) groupes[key] = {name: v.vendeur, point: v.point, ventesMois: 0, nbVentes: 0};
    groupes[key].nbVentes += 1;
    if(v.ts && v.ts>=monthStart) groupes[key].ventesMois += v.total;
  });
  const list = Object.values(groupes).sort((a,b)=>b.ventesMois-a.ventesMois);
  return `<div class="panel"><h3>Vendeurs</h3>
    <div class="table-wrap"><table><thead><tr><th>Nom</th><th>Point</th><th>Ventes du mois</th><th>Nombre de ventes</th></tr></thead>
    <tbody>${list.map(v=>`<tr><td style="font-weight:600;">${v.name}</td><td>${v.point}</td><td>${money(v.ventesMois)}</td><td>${v.nbVentes}</td></tr>`).join('')}</tbody></table></div>
    ${list.length===0 ? '<div class="empty" style="padding:10px 0;">Aucune vente enregistrée pour le moment</div>' : ''}
  </div>`;
}

function updateReclamationField(field, value){

function submitReclamation(){
  const d = state.reclamationDraft;
  const client = (d.client||'').trim();
  const motif = (d.motif||'').trim();
  if(!client || !motif){ toast('Merci de renseigner le client et le motif de la réclamation.'); return; }
  state.reclamationCounter++;
  state.reclamations.unshift({
    id: state.reclamationCounter, client, point: d.point, motif,
    date: new Date().toLocaleString('fr-FR'), status:'ouverte',
  });
  const pt = state.points.find(p=>p.loc===d.point);
  if(pt) pt.reclamations += 1;

}
function resolveReclamation(id){
  const r = state.reclamations.find(x=>x.id===id);
  if(r){ r.status='resolue'; r.solution = r.solution || 'Prise en charge par le point de vente'; toast(`Réclamation #${id} marquée résolue`); renderPage(); saveSharedState(true); }
}

/* ========================= RAPPORTS ========================= */
function periodRange(period, custom){
  const now = new Date();
  let start, end = Date.now();
  if(period==='jour'){
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  } else if(period==='semaine'){
    const day = now.getDay();
    const diffToMonday = (day===0 ? 6 : day-1);
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate()-diffToMonday).getTime();
  } else if(period==='annee'){
    start = new Date(now.getFullYear(), 0, 1).getTime();
  } else if(period==='perso'){
    start = custom.from ? new Date(custom.from+'T00:00:00').getTime() : 0;
    end = custom.to ? new Date(custom.to+'T23:59:59').getTime() : Date.now();
  } else {
    start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  }
  return [start, end];
}
function setRapportPeriod(period){
  state.rapportPeriod = period;
  renderPage();
}
function updateRapportCustom(field, value){
  state.rapportCustom[field] = value;
  renderPage();
}
function renderRapports(){
  const periods = [['jour',"Aujourd'hui"],['semaine','Cette semaine'],['mois','Ce mois'],['annee','Cette année'],['perso','Personnalisé']];
  const [start, end] = periodRange(state.rapportPeriod, state.rapportCustom);
  const ventesFiltrees = state.ventes.filter(v=>v.ts && v.ts>=start && v.ts<=end);
  const commandesFiltrees = state.customerOrders.filter(c=>c.ts && c.ts>=start && c.ts<=end);

  const totalsParPoint = {};
  state.points.forEach(p=>totalsParPoint[p.loc]=0);
  ventesFiltrees.forEach(v=>{ totalsParPoint[v.point] = (totalsParPoint[v.point]||0) + v.total; });
  const max = Math.max(1, ...Object.values(totalsParPoint));

  const totalsParVendeur = {};
  ventesFiltrees.forEach(v=>{ totalsParVendeur[v.vendeur] = (totalsParVendeur[v.vendeur]||0) + v.total; });
  const meilleurVendeur = Object.entries(totalsParVendeur).sort((a,b)=>b[1]-a[1])[0];

  const qtyParProduit = {};
  ventesFiltrees.forEach(v=>{ qtyParProduit[v.produit] = (qtyParProduit[v.produit]||0) + v.qty; });
  const meilleurProduit = Object.entries(qtyParProduit).sort((a,b)=>b[1]-a[1])[0];

  const meilleurPoint = Object.entries(totalsParPoint).sort((a,b)=>b[1]-a[1])[0];

  return `
  <div class="filters">
    ${periods.map(([id,label])=>`<span class="${state.rapportPeriod===id?'on':''}" onclick="setRapportPeriod('${id}')">${label}</span>`).join('')}
  </div>
  ${state.rapportPeriod==='perso' ? `
  <div class="panel" style="margin-bottom:14px;">
    <div class="form-grid">
      <div class="field"><label>Du</label><input type="date" value="${state.rapportCustom.from}" onchange="updateRapportCustom('from', this.value)"></div>
      <div class="field"><label>Au</label><input type="date" value="${state.rapportCustom.to}" onchange="updateRapportCustom('to', this.value)"></div>
    </div>
  </div>` : ''}
  <div class="grid2">
    <div class="panel"><h3>Ventes par point de vente</h3>
      <div class="bars">
        ${state.points.map(p=>`<div class="b"><div class="col" style="height:${Math.round((totalsParPoint[p.loc]/max)*130)}px"></div><div class="lb">${p.loc}</div></div>`).join('')}
      </div>
      ${ventesFiltrees.length===0 ? '<div class="empty" style="padding:10px 0;">Aucune vente sur cette période</div>' : ''}
    </div>
    <div class="panel"><h3>Synthèse réseau</h3>
      <div style="display:flex; flex-direction:column; gap:10px; font-size:12.5px;">
        <div style="display:flex; justify-content:space-between;"><span>🏆 Meilleur point</span><strong>${meilleurPoint && meilleurPoint[1]>0 ? meilleurPoint[0] : '—'}</strong></div>
        <div style="display:flex; justify-content:space-between;"><span>Meilleur vendeur</span><strong>${meilleurVendeur ? meilleurVendeur[0] : '—'}</strong></div>
        <div style="display:flex; justify-content:space-between;"><span>Produit le plus vendu</span><strong>${meilleurProduit ? meilleurProduit[0] : '—'}</strong></div>
        <div style="display:flex; justify-content:space-between;"><span>Commandes livrées</span><strong>${commandesFiltrees.filter(c=>c.status==='livree').length}</strong></div>
      </div>
    </div>
  </div>`;
}

/* ========================= FINANCES ========================= */
function budgetKey(point, poste){ return point + '||' + (poste||''); }
function findBudgetRule(point, poste){
  return state.budgetRules[budgetKey(point, poste)] || (poste ? state.budgetRules[budgetKey(point,'')] : null);
}
function updateBudgetDraftField(field, value){
  state.budgetDraft[field] = value;
  if(field==='point'){ state.budgetDraft.poste=''; }
  renderPage();
}
function updateBudgetPct(index, value){
  state.budgetDraft.pcts[index] = Math.max(0, parseInt(value)||0);
  renderPage();
}
function saveBudgetRule(){
  const d = state.budgetDraft;
  const sum = d.pcts.reduce((s,v)=>s+v,0);
  if(sum !== 100){ toast(`Le total doit faire 100% (actuellement ${sum}%).`); return; }
  state.budgetRules[budgetKey(d.point, d.poste)] = d.pcts.slice();
  toast('Répartition enregistrée pour ' + d.point + (d.poste ? ' — '+d.poste : ' (tout le point)'));
  renderPage();
}
function deleteBudgetRule(key){
  delete state.budgetRules[key];
  toast('Répartition supprimée');
  renderPage();
}
function renderFinances(){
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const ventesMois = state.ventes.filter(v=>v.ts && v.ts>=monthStart);
  const totalCA = ventesMois.reduce((s,v)=>s+v.total,0);

  const groupes = {};
  ventesMois.forEach(v=>{
    const key = budgetKey(v.point, v.poste);
    if(!groupes[key]) groupes[key] = {point:v.point, poste:v.poste, total:0};
    groupes[key].total += v.total;
  });

  const catTotals = state.budgetCategories.map(()=>0);
  let totalReparti = 0;
  const nonConfigures = [];
  Object.values(groupes).forEach(g=>{
    const rule = findBudgetRule(g.point, g.poste);
    if(!rule){ nonConfigures.push(g); return; }
    rule.forEach((pct,i)=>{ catTotals[i] += Math.round(g.total * pct/100); });
    totalReparti += g.total;
  });
  const nonReparti = totalCA - totalReparti;

  const totalsParPoint = {};
  state.points.forEach(p=>totalsParPoint[p.loc]=0);
  ventesMois.forEach(v=>{ totalsParPoint[v.point] = (totalsParPoint[v.point]||0) + v.total; });

  const selectedPoint = state.points.find(p=>p.loc===state.budgetDraft.point);
  const postesDisponibles = selectedPoint ? selectedPoint.postes : [];
  const sommePcts = state.budgetDraft.pcts.reduce((s,v)=>s+v,0);

  return `
  <div class="kpi-row">
    <div class="kpi-card"><div class="label">Recettes du mois</div><div class="value">${money(totalCA)}</div></div>
    ${state.budgetCategories.map((cat,i)=>`<div class="kpi-card"><div class="label">${cat}</div><div class="value">${money(catTotals[i])}</div></div>`).join('')}
  </div>
  ${nonReparti !== 0 ? `<div class="panel" style="border:1px solid #eab308; margin-bottom:14px;">
    <h3>⚠️ Répartition incomplète</h3>
    <p style="font-size:12.5px; color:var(--text-muted);">${money(nonReparti)} de recettes ce mois-ci n'ont pas pu être réparties car aucune règle n'est configurée pour : ${nonConfigures.map(g=>`<strong>${g.point}${g.poste?' — '+g.poste:''}</strong>`).join(', ')}. Configurez une règle ci-dessous.</p>
  </div>` : ''}
  <div class="panel"><h3>Répartition par point (ce mois)</h3>
    <div class="table-wrap"><table><thead><tr><th>Point</th><th>Recettes</th><th>Part du réseau</th></tr></thead>
    <tbody>${state.points.map(p=>`<tr><td>${p.loc}</td><td>${money(totalsParPoint[p.loc]||0)}</td><td>${totalCA ? Math.round(((totalsParPoint[p.loc]||0)/totalCA)*100) : 0}%</td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="panel"><h3>Règles de répartition configurées</h3>
    <div class="table-wrap"><table><thead><tr><th>Point</th><th>Poste</th>${state.budgetCategories.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead>
    <tbody>${Object.entries(state.budgetRules).map(([key,pcts])=>{
      const parts = key.split('||'); const point = parts[0]; const poste = parts[1];
      return `<tr><td>${point}</td><td>${poste || '— (tout le point)'}</td>${pcts.map(p=>`<td>${p}%</td>`).join('')}<td><button class="btn sm" onclick="deleteBudgetRule('${key}')">Suppr.</button></td></tr>`;
    }).join('')}</tbody></table></div>
    ${Object.keys(state.budgetRules).length===0 ? '<div class="empty" style="padding:10px 0;">Aucune règle configurée</div>' : ''}
  </div>
  <div class="panel"><h3>Nouvelle règle de répartition</h3>
    <div class="form-grid">
      <div class="field"><label>Point de vente</label>
        <select onchange="updateBudgetDraftField('point',this.value)">${state.points.map(p=>`<option value="${p.loc}" ${state.budgetDraft.point===p.loc?'selected':''}>${p.loc}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Poste (facultatif — laisser vide pour tout le point)</label>
        <select onchange="updateBudgetDraftField('poste',this.value)">
          <option value="" ${state.budgetDraft.poste===''?'selected':''}>— Tout le point —</option>
          ${postesDisponibles.map(po=>`<option value="${po}" ${state.budgetDraft.poste===po?'selected':''}>${po}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-grid" style="margin-top:8px;">
      ${state.budgetCategories.map((cat,i)=>`<div class="field"><label>${cat} (%)</label><input type="number" min="0" max="100" value="${state.budgetDraft.pcts[i]}" oninput="updateBudgetPct(${i}, this.value)"></div>`).join('')}
    </div>
    <div style="margin-top:8px; font-size:12.5px; color:var(--text-muted);">Total : <strong>${sommePcts}%</strong> (doit faire 100%)</div>
    <button class="btn orange" style="margin-top:10px;" onclick="saveBudgetRule()">💾 Enregistrer la répartition</button>
  </div>`;
}

/* ========================= BOUTIQUE CLIENT ========================= */
const PRODUCT_ICONS = {'Vinyle':'🎞️','Bannière':'🏳️','Flyers (paquet 100)':'📄','Tasse personnalisée':'☕','Encre (cartouche)':'🖨️','Ramette papier':'📃','Impression':'🖨️','Scan / Numérisation':'🔍','Photocopie':'📠','Plastification':'🛡️','Reliure':'📚'};

function toggleMode(mode){
  state.appMode = mode;
  const appEl = document.querySelector('.app');
  const boutiqueEl = document.getElementById('boutique-shell');
  if(mode==='boutique'){
    appEl.style.display = 'none';
    boutiqueEl.style.display = 'flex';
    renderBoutiquePage();
  } else {
    boutiqueEl.style.display = 'none';
    appEl.style.display = 'flex';
  }
}
function setBoutiquePage(page){ state.boutiquePage = page; renderBoutiquePage(); }
function updateCartCount(){
  const count = state.panier.reduce((s,i)=>s+i.qty,0);
  const el = document.getElementById('cart-count');
  if(el) el.textContent = count;
}
function changeCatalogQty(name, delta){
  const current = state.catalogQty[name] || 1;
  state.catalogQty[name] = Math.max(1, current + delta);
  renderBoutiquePage();
}
function addToCart(name){
  const p = state.products.find(x=>x.name===name);
  if(!p) return;
  const qty = state.catalogQty[name] || 1;
  const existing = state.panier.find(i=>i.name===name);
  if(existing) existing.qty += qty; else state.panier.push({name:p.name, prix:p.prix, qty});
  state.catalogQty[name] = 1;
  toast(`${p.name} ajouté au panier`);
  renderBoutiquePage();
}
function changeCartQty(name, delta){
  const item = state.panier.find(i=>i.name===name);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0) state.panier = state.panier.filter(i=>i.name!==name);
  renderBoutiquePage();
}
function cartTotal(){ return state.panier.reduce((s,i)=>s+i.prix*i.qty,0); }
function openWaveLink(total){
  const base = state.paymentNumbers.waveLink;
  if(!base) return;
  const sep = base.includes('?') ? '&' : '?';
  window.open(base + sep + 'amount=' + Math.round(total), '_blank');
}
function updateCheckoutField(field, value){ state.checkout[field] = value; }
function goToPayment(){
  const c = state.checkout;
  if(state.panier.length===0){ toast('Votre panier est vide.'); return; }
  if(!c.nom || !c.tel || !c.adresse){ toast('Merci de renseigner vos coordonnees de livraison.'); return; }
  state.boutiquePage = 'paiement';
  renderBoutiquePage();
}
function backToCart(){
  state.boutiquePage = 'panier';
  renderBoutiquePage();
}
function updatePaymentNumbers(wave, om, waveLink){
  state.paymentNumbers.wave = (wave||'').trim();
  state.paymentNumbers.orangeMoney = (om||'').trim();
  state.paymentNumbers.waveLink = (waveLink||'').trim();
  toast('Informations de paiement mises a jour');
  renderPage();
}
function updateDeliverySettings(base, perKm, speedKmh){
  state.deliverySettings.base = Math.max(0, parseInt(base)||0);
  state.deliverySettings.perKm = Math.max(0, parseInt(perKm)||0);
  state.deliverySettings.speedKmh = Math.max(1, parseInt(speedKmh)||25);
  toast('Tarification des livraisons mise à jour');
  renderPage();
  saveSharedState(true);
}
function confirmMobilePayment(reference){
  if(state.paymentProcessing) return;
  state.checkout.paiementRef = (reference||'').trim();
  state.paymentProcessing = true;
  renderBoutiquePage();
  setTimeout(()=>{
    state.paymentProcessing = false;
    placeOrder(true);
  }, 1100);
}
function confirmCardPayment(numero, exp, cvv){
  if(state.paymentProcessing) return;
  const digits = (numero||'').replace(/\s/g,'');
  if(digits.length < 12 || !exp || !cvv || cvv.length < 3){
    toast('Merci de verifier les informations de la carte.');
    return;
  }
  state.checkout.paiementRef = 'Carte se terminant par ' + digits.slice(-4);
  state.paymentProcessing = true;
  renderBoutiquePage();
  setTimeout(()=>{
    state.paymentProcessing = false;
    placeOrder(true);
  }, 1400);
}
function placeOrder(paye){
  const c = state.checkout;
  if(state.panier.length===0){ toast('Votre panier est vide.'); return; }
  if(!c.nom || !c.tel || !c.adresse){ toast('Merci de renseigner vos coordonnees de livraison.'); return; }
  state.trackingCounter++;
  const tracking = 'MP-TRK-' + state.trackingCounter + '-' + shortSuffix();
  const order = {
    tracking, items: state.panier.map(i=>({...i})), total: cartTotal(),
    client: c.nom, tel: c.tel, adresse: c.adresse, point: c.point, paiement: c.paiement,
    paiementConfirme: !!paye, paiementRef: c.paiementRef || '',
    status: 'recue', progress: 0, location: '', date: new Date().toLocaleString('fr-FR'), ts: Date.now(), livreur: '',
  };
  state.customerOrders.unshift(order);
  order.items.forEach(i => deductStockForSale(i.name, i.qty));
  state.panier = [];
  state.trackingResult = order;
  state.checkout = {nom:'', tel:'', adresse:'', point:c.point, paiement:c.paiement};
  toast('Commande passee — numero de suivi ' + tracking);
  state.boutiquePage = 'confirmation';
  renderBoutiquePage();
  saveSharedState(true);
}
function findOrderByTracking(){
  const code = state.trackingSearch.trim().toUpperCase();
  const found = state.customerOrders.find(o=>o.tracking.toUpperCase()===code);
  state.trackingResult = found || null;
  if(!found) toast("Aucune commande trouvee pour ce numero.");
  renderBoutiquePage();
}
function advanceOrder(tracking){
  const order = state.customerOrders.find(o=>o.tracking===tracking);
  if(!order) return;
  const steps = ['recue','preparation','disponible','livraison','livree'];
  const locs = ['Entrepot Mperfect Pub — Dakar','En route — Sacre-Coeur, Dakar','En route — Almadies, Dakar'];
  const idx = steps.indexOf(order.status);
  if(order.status==='livraison'){
    order.progress = Math.min(100, order.progress+50);
    order.location = locs[Math.min(2, Math.floor(order.progress/50))];
    if(order.progress >= 100) order.status = 'livree';
  } else if(idx < steps.length-1){
    order.status = steps[idx+1];
    if(order.status==='livraison'){ order.progress = 0; order.location = locs[0]; }
  }
  toast('Commande ' + tracking + ' mise a jour');
  renderBoutiquePage();
}
function renderBoutiquePage(){
  const el = document.getElementById('boutique-content');
  const renderers = { catalogue: renderCatalogue, panier: renderPanier, paiement: renderPaiement, suivi: renderSuivi, confirmation: renderConfirmation };
  setInnerHTMLPreservingFocus(el, (renderers[state.boutiquePage] || renderCatalogue)());
  updateCartCount();
  saveSharedState();
  savePersonalState();
}
function renderCatalogue(){
  const q = (state.boutiqueSearch||'').trim().toLowerCase();
  const filtered = state.products.filter(p=>p.name.toLowerCase().includes(q));
  return `
  <h2 style="font-family:'Sora'; font-size:19px; font-weight:800; color:var(--blue-900); margin-bottom:4px;">Notre catalogue</h2>
  <p style="color:var(--text-muted); font-size:13px; margin-bottom:14px;">Choisissez vos produits, ajoutez-les au panier et faites-vous livrer partout au Senegal.</p>
  <input type="text" id="boutique-search-input" value="${(state.boutiqueSearch||'').replace(/"/g,'&quot;')}" oninput="state.boutiqueSearch=this.value; renderBoutiquePage();" placeholder="🔎 Rechercher un produit…" style="width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:13.5px; margin-bottom:18px; box-sizing:border-box;">
  <div class="prod-list">
    ${filtered.length ? filtered.map(p=>{
      const esc = p.name.replace(/'/g,"\\'");
      const open = !!state.uiOpen.catalog[p.name];
      return `
      <div class="prod-acc ${open?'open':''}">
        <div class="prod-acc-head" onclick="toggleCatalogDetails('${esc}')">
          ${p.img ? `<img src="${p.img}" alt="${p.name}" class="prod-acc-thumb">` : `<div class="ic">${PRODUCT_ICONS[p.name] || '🛍️'}</div>`}
          <div class="prod-acc-title">
            <h4>${p.name}</h4>
            <div class="px">${money(p.prix)}</div>
          </div>
          <span class="prod-acc-chevron">${open?'▲':'▼'}</span>
        </div>
        ${open ? `
        <div class="prod-acc-body">
          ${p.desc ? `<p class="prod-acc-desc">${p.desc}</p>` : ''}
          <div class="qty-row">
            <button onclick="changeCatalogQty('${esc}', -1)">−</button>
            <span>${state.catalogQty[p.name] || 1}</span>
            <button onclick="changeCatalogQty('${esc}', 1)">+</button>
          </div>
          <button class="btn orange" style="width:100%;" onclick="addToCart('${esc}')">Ajouter au panier</button>
        </div>` : ''}
      </div>`;
    }).join('') : '<div class="empty">Aucun produit ne correspond à votre recherche.</div>'}
  </div>`;
}
function renderPanier(){
  const items = state.panier;
  return `
  <h2 style="font-family:'Sora'; font-size:19px; font-weight:800; color:var(--blue-900); margin-bottom:16px;">Mon panier</h2>
  ${items.length===0 ? '<div class="empty">Votre panier est vide — direction la boutique.</div>' : `
    ${items.map(i=>`
      <div class="cart-row">
        <div><div class="nm">${i.name}</div><div class="pr">${money(i.prix)} × ${i.qty}</div></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn sm" onclick="changeCartQty('${i.name}', -1)">−</button>
          <span style="font-weight:700;">${i.qty}</span>
          <button class="btn sm" onclick="changeCartQty('${i.name}', 1)">+</button>
          <strong style="margin-left:10px; color:var(--blue-900);">${money(i.prix*i.qty)}</strong>
        </div>
      </div>`).join('')}
    <div class="cart-total"><span class="lb">Total a payer</span><span class="amt">${money(cartTotal())}</span></div>
    <div class="panel" style="margin-top:20px;">
      <h3>Livraison &amp; paiement</h3>
      <div class="form-grid">
        <div class="field"><label>Nom complet</label><input type="text" id="checkout-nom" value="${state.checkout.nom}" oninput="updateCheckoutField('nom', this.value)"></div>
        <div class="field"><label>Telephone</label><input type="text" id="checkout-tel" placeholder="77 000 00 00" value="${state.checkout.tel}" oninput="updateCheckoutField('tel', this.value)"></div>
        <div class="field"><label>Adresse de livraison</label><input type="text" id="checkout-adresse" placeholder="Quartier, ville" value="${state.checkout.adresse}" oninput="updateCheckoutField('adresse', this.value)"></div>
        <div class="field"><label>Point de retrait le plus proche</label>
          <select onchange="updateCheckoutField('point',this.value)">${state.points.map(p=>`<option value="${p.loc}" ${state.checkout.point===p.loc?'selected':''}>${p.loc}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Mode de paiement</label>
          <select onchange="updateCheckoutField('paiement',this.value)">
            ${['Wave','Orange Money','Especes a la livraison','Carte bancaire'].map(m=>`<option ${state.checkout.paiement===m?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>
      </div>
      <button class="btn orange" style="width:100%; padding:12px;" onclick="goToPayment()">Continuer vers le paiement — ${money(cartTotal())}</button>
    </div>
  `}`;
}
function renderPaiement(){
  if(state.panier.length===0) return renderCatalogue();
  const c = state.checkout;
  const total = cartTotal();
  const method = c.paiement;
  const numWave = state.paymentNumbers.wave || '77 000 00 00';
  const numOM = state.paymentNumbers.orangeMoney || '77 000 00 00';
  const processing = state.paymentProcessing;
  return `
  <h2 style="font-family:'Sora'; font-size:19px; font-weight:800; color:var(--blue-900); margin-bottom:4px;">Paiement</h2>
  <p style="color:var(--text-muted); font-size:13px; margin-bottom:16px;">Le paiement doit être confirmé avant la validation de votre commande.</p>
  <div class="cart-total" style="margin-bottom:18px;"><span class="lb">Montant à payer</span><span class="amt">${money(total)}</span></div>
  <div class="panel">
    ${method==='Wave' ? `
      <h3>🟢 Paiement par Wave</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">
        Appuyez sur le bouton ci-dessous pour ouvrir Wave, puis payez <strong>${money(total)}</strong> à la boutique.
        Si le montant n'est pas déjà affiché, saisissez-le manuellement dans l'application.
      </p>
      ${state.paymentNumbers.waveLink ? `
      <button type="button" class="btn orange" style="width:100%; padding:12px; margin-bottom:12px;" onclick="openWaveLink(${total})">🟢 Ouvrir Wave et payer ${money(total)}</button>
      ` : ''}
      ${numWave !== '77 000 00 00' || !state.paymentNumbers.waveLink ? `
      <p style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">Vous pouvez aussi envoyer directement au numéro Wave de la boutique :</p>
      <div style="text-align:center; font-family:'Sora'; font-size:20px; font-weight:800; color:var(--blue-900); background:var(--blue-100); border-radius:10px; padding:10px; margin-bottom:14px;">${numWave}</div>
      ` : ''}
      <div class="field"><label>Numéro utilisé pour le paiement</label><input type="tel" id="pay-ref" placeholder="Votre numéro Wave" value="${c.paiementRef||''}" oninput="updateCheckoutField('paiementRef', this.value)"></div>
      <button class="btn orange" style="width:100%; padding:12px;" ${processing?'disabled':''} onclick="confirmMobilePayment(document.getElementById('pay-ref').value)">${processing ? 'Vérification du paiement…' : "J'ai payé — Valider ma commande"}</button>
    ` : method==='Orange Money' ? `
      <h3>🟠 Paiement par Orange Money</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">
        Envoyez <strong>${money(total)}</strong> au numéro Orange Money de la boutique :
      </p>
      <div style="text-align:center; font-family:'Sora'; font-size:22px; font-weight:800; color:var(--blue-900); background:var(--blue-100); border-radius:10px; padding:12px; margin-bottom:14px;">
        ${numOM}
      </div>
      <div class="field"><label>Numéro utilisé pour le paiement</label><input type="tel" id="pay-ref" placeholder="Votre numéro Orange Money" value="${c.paiementRef||''}" oninput="updateCheckoutField('paiementRef', this.value)"></div>
      <button class="btn orange" style="width:100%; padding:12px;" ${processing?'disabled':''} onclick="confirmMobilePayment(document.getElementById('pay-ref').value)">${processing ? 'Vérification du paiement…' : "J'ai payé — Valider ma commande"}</button>
    ` : method==='Carte bancaire' ? `
      <h3>💳 Paiement par carte bancaire</h3>
      <div class="form-grid">
        <div class="field"><label>Numéro de carte</label><input type="text" id="card-num" placeholder="0000 0000 0000 0000" maxlength="19"></div>
        <div class="field"><label>Expiration</label><input type="text" id="card-exp" placeholder="MM/AA" maxlength="5"></div>
        <div class="field"><label>CVV</label><input type="text" id="card-cvv" placeholder="123" maxlength="4"></div>
      </div>
      <button class="btn orange" style="width:100%; padding:12px;" ${processing?'disabled':''} onclick="confirmCardPayment(document.getElementById('card-num').value, document.getElementById('card-exp').value, document.getElementById('card-cvv').value)">${processing ? 'Paiement en cours…' : 'Payer maintenant — ' + money(total)}</button>
    ` : `
      <h3>💵 Paiement à la livraison</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Vous payerez <strong>${money(total)}</strong> en espèces directement au livreur à la réception de votre commande.</p>
      <button class="btn orange" style="width:100%; padding:12px;" onclick="placeOrder(false)">Confirmer ma commande</button>
