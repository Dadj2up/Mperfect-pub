/* ========================= RAPPORTS ========================= */
function periodRange(period, custom){
  const now = new Date();
  let start, end = Date.now();
  if(period==='jour'){
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  } else if(period==='semaine'){
    const day = now.getDay();
    const diffToMonday = (day===0 ? 6 : day-1);
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate()-diffToMonday).getTime();
  } else if(period==='annee'){
    start = new Date(now.getFullYear(), 0, 1).getTime();
  } else if(period==='perso'){
    start = custom.from ? new Date(custom.from+'T00:00:00').getTime() : 0;
    end = custom.to ? new Date(custom.to+'T23:59:59').getTime() : Date.now();
  } else {
    start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  }
  return [start, end];
}
function setRapportPeriod(period){
  state.rapportPeriod = period;
  renderPage();
}
function updateRapportCustom(field, value){
  state.rapportCustom[field] = value;
  renderPage();
}
function renderRapports(){
  const periods = [['jour',"Aujourd'hui"],['semaine','Cette semaine'],['mois','Ce mois'],['annee','Cette année'],['perso','Personnalisé']];
  const [start, end] = periodRange(state.rapportPeriod, state.rapportCustom);
  const ventesFiltrees = activeVentes().filter(v=>v.ts && v.ts>=start && v.ts<=end);
  const commandesFiltrees = state.customerOrders.filter(c=>c.ts && c.ts>=start && c.ts<=end);

  const totalsParPoint = {};
  state.points.forEach(p=>totalsParPoint[p.loc]=0);
  ventesFiltrees.forEach(v=>{ totalsParPoint[v.point] = (totalsParPoint[v.point]||0) + v.total; });
  const max = Math.max(1, ...Object.values(totalsParPoint));

  const totalsParVendeur = {};
  ventesFiltrees.forEach(v=>{ totalsParVendeur[v.vendeur] = (totalsParVendeur[v.vendeur]||0) + v.total; });
  const meilleurVendeur = Object.entries(totalsParVendeur).sort((a,b)=>b[1]-a[1])[0];

  const qtyParProduit = {};
  ventesFiltrees.forEach(v=>{ invoiceItems(v).forEach(it=>{ qtyParProduit[it.produit] = (qtyParProduit[it.produit]||0) + it.qty; }); });
  const meilleurProduit = Object.entries(qtyParProduit).sort((a,b)=>b[1]-a[1])[0];

  const meilleurPoint = Object.entries(totalsParPoint).sort((a,b)=>b[1]-a[1])[0];

  return `
  <div class="filters">
    ${periods.map(([id,label])=>`<span class="${state.rapportPeriod===id?'on':''}" onclick="setRapportPeriod('${id}')">${label}</span>`).join('')}
  </div>
  ${state.rapportPeriod==='perso' ? `
  <div class="panel" style="margin-bottom:14px;">
    <div class="form-grid">
      <div class="field"><label>Du</label><input type="date" value="${state.rapportCustom.from}" onchange="updateRapportCustom('from', this.value)"></div>
      <div class="field"><label>Au</label><input type="date" value="${state.rapportCustom.to}" onchange="updateRapportCustom('to', this.value)"></div>
    </div>
  </div>` : ''}
  <div class="grid2">
    <div class="panel"><h3>Ventes par point de vente</h3>
      <div class="bars">
        ${state.points.map(p=>`<div class="b"><div class="col" style="height:${Math.round((totalsParPoint[p.loc]/max)*130)}px"></div><div class="lb">${p.loc}</div></div>`).join('')}
      </div>
      ${ventesFiltrees.length===0 ? '<div class="empty" style="padding:10px 0;">Aucune vente sur cette période</div>' : ''}
    </div>
    <div class="panel"><h3>Synthèse réseau</h3>
      <div style="display:flex; flex-direction:column; gap:10px; font-size:12.5px;">
        <div style="display:flex; justify-content:space-between;"><span>🏆 Meilleur point</span><strong>${meilleurPoint && meilleurPoint[1]>0 ? meilleurPoint[0] : '—'}</strong></div>
        <div style="display:flex; justify-content:space-between;"><span>Meilleur vendeur</span><strong>${meilleurVendeur ? meilleurVendeur[0] : '—'}</strong></div>
        <div style="display:flex; justify-content:space-between;"><span>Produit le plus vendu</span><strong>${meilleurProduit ? meilleurProduit[0] : '—'}</strong></div>
        <div style="display:flex; justify-content:space-between;"><span>Commandes livrées</span><strong>${commandesFiltrees.filter(c=>c.status==='livree').length}</strong></div>
      </div>
    </div>
  </div>`;
}

/* ========================= FINANCES ========================= */
function budgetKey(point, poste){ return point + '||' + (poste||''); }
function findBudgetRule(point, poste){
  return state.budgetRules[budgetKey(point, poste)] || (poste ? state.budgetRules[budgetKey(point,'')] : null);
}
function updateBudgetDraftField(field, value){
  state.budgetDraft[field] = value;
  if(field==='point'){ state.budgetDraft.poste=''; }
  renderPage();
}
function updateBudgetPct(index, value){
  state.budgetDraft.pcts[index] = Math.max(0, parseInt(value)||0);
  renderPage();
}
function saveBudgetRule(){
  const d = state.budgetDraft;
  const sum = d.pcts.reduce((s,v)=>s+v,0);
  if(sum !== 100){ toast(`Le total doit faire 100% (actuellement ${sum}%).`); return; }
  state.budgetRules[budgetKey(d.point, d.poste)] = d.pcts.slice();
  toast('Répartition enregistrée pour ' + d.point + (d.poste ? ' — '+d.poste : ' (tout le point)'));
  renderPage();
}
function deleteBudgetRule(key){
  delete state.budgetRules[key];
  toast('Répartition supprimée');
  renderPage();
}
// Corrige les factures rattachées à un poste qui n'existe plus dans la
// configuration (supprimé, ou faute de frappe corrigée en créant un nouveau
// poste au lieu de renommer l'ancien) : les fait basculer vers le bon poste,
// et déplace la règle de répartition budgétaire si elle existait sous l'ancien nom.
function fixOrphanPoste(point, oldPoste){
  const p = state.points.find(pt=>pt.loc===point);
  const suggestion = (p && p.postes && p.postes[0]) ? p.postes[0] : oldPoste;
  const newName = (window.prompt(`Les factures enregistrées sous le poste supprimé "${oldPoste}" (${point}) doivent être rattachées à quel poste ?`, suggestion) || '').trim();
  if(!newName) return;
  let updated = 0;
  state.ventes.forEach(v=>{ if(v.point===point && v.poste===oldPoste){ v.poste=newName; updated++; } });
  if(p && !p.postes.some(po=>po.toLowerCase()===newName.toLowerCase())) p.postes.push(newName);
  const oldKey = budgetKey(point, oldPoste), newKey = budgetKey(point, newName);
  if(state.budgetRules[oldKey] && !state.budgetRules[newKey]){ state.budgetRules[newKey]=state.budgetRules[oldKey]; delete state.budgetRules[oldKey]; }
  toast(`${updated} facture(s) rattachée(s) à "${newName}".`);
  renderPage();
  saveSharedState(true);
}
function renderFinances(){
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  // On ne compte que l'argent réellement encaissé (comme sur le tableau de bord),
  // pas le montant total facturé — sinon "Recettes du mois" incluait aussi les
  // sommes encore dues par les clients, d'où l'écart avec le Chiffre d'affaires.
  // Important : on regarde QUAND l'argent a été reçu (v.paiements), pas quand la
  // facture a été créée — sinon le paiement d'un restant ce mois-ci, sur une facture
  // créée le mois précédent, n'apparaissait ni dans les recettes de ce mois ni dans
  // celles de l'ancien (il disparaissait tout simplement des rapports).
  const encaisseSurPeriode = (v, start) => {
    const paiements = (Array.isArray(v.paiements) && v.paiements.length)
      ? v.paiements
      : (v.ts ? [{montant: v.avance!=null ? v.avance : v.total, ts: v.ts}] : []);
    return paiements.filter(p=>p.ts!=null && p.ts>=start).reduce((s,p)=>s+p.montant,0);
  };
  const encaisse = v => encaisseSurPeriode(v, monthStart);
  const totalCA = activeVentes().reduce((s,v)=>s+encaisse(v),0);

  const groupes = {};
  activeVentes().forEach(v=>{
    const montant = encaisse(v);
    if(montant<=0) return;
    const key = budgetKey(v.point, v.poste);
    if(!groupes[key]) groupes[key] = {point:v.point, poste:v.poste, total:0};
    groupes[key].total += montant;
  });

  const catTotals = state.budgetCategories.map(()=>0);
  let totalReparti = 0;
  const nonConfigures = [];
  Object.values(groupes).forEach(g=>{
    const rule = findBudgetRule(g.point, g.poste);
    if(!rule){ nonConfigures.push(g); return; }
    rule.forEach((pct,i)=>{ catTotals[i] += Math.round(g.total * pct/100); });
    totalReparti += g.total;
  });
  const nonReparti = totalCA - totalReparti;

  const totalsParPoint = {};
  state.points.forEach(p=>totalsParPoint[p.loc]=0);
  activeVentes().forEach(v=>{ totalsParPoint[v.point] = (totalsParPoint[v.point]||0) + encaisse(v); });

  const selectedPoint = state.points.find(p=>p.loc===state.budgetDraft.point);
  const postesDisponibles = selectedPoint ? selectedPoint.postes : [];
  const sommePcts = state.budgetDraft.pcts.reduce((s,v)=>s+v,0);

  return `
  <div class="kpi-row">
    <div class="kpi-card"><div class="label">Recettes du mois</div><div class="value">${money(totalCA)}</div></div>
    ${state.budgetCategories.map((cat,i)=>`<div class="kpi-card"><div class="label">${cat}</div><div class="value">${money(catTotals[i])}</div></div>`).join('')}
  </div>
  ${nonReparti !== 0 ? `<div class="panel" style="border:1px solid #eab308; margin-bottom:14px;">
    <h3>⚠️ Répartition incomplète</h3>
    <p style="font-size:12.5px; color:var(--text-muted);">${money(nonReparti)} de recettes ce mois-ci n'ont pas pu être réparties car aucune règle n'est configurée pour : ${nonConfigures.map(g=>`<strong>${g.point}${g.poste?' — '+g.poste:''}</strong>`).join(', ')}. Configurez une règle ci-dessous.</p>
    ${nonConfigures.filter(g=>g.poste).map(g=>`
      <div style="margin-top:6px;">
        <button class="btn sm" onclick="fixOrphanPoste('${escJs(g.point)}','${escJs(g.poste)}')">🔧 "${g.poste}" n'existe plus (faute de frappe, poste supprimé…) — rattacher ces factures à un autre poste</button>
      </div>`).join('')}
  </div>` : ''}
  <div class="panel"><h3>Répartition par point (ce mois)</h3>
    <div class="table-wrap"><table><thead><tr><th>Point</th><th>Recettes</th><th>Part du réseau</th></tr></thead>
    <tbody>${state.points.map(p=>`<tr><td>${p.loc}</td><td>${money(totalsParPoint[p.loc]||0)}</td><td>${totalCA ? Math.round(((totalsParPoint[p.loc]||0)/totalCA)*100) : 0}%</td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="panel"><h3>Règles de répartition configurées</h3>
    <div class="table-wrap"><table><thead><tr><th>Point</th><th>Poste</th>${state.budgetCategories.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead>
    <tbody>${Object.entries(state.budgetRules).map(([key,pcts])=>{
      const parts = key.split('||'); const point = parts[0]; const poste = parts[1];
      return `<tr><td>${point}</td><td>${poste || '— (tout le point)'}</td>${pcts.map(p=>`<td>${p}%</td>`).join('')}<td><button class="btn sm" onclick="deleteBudgetRule('${key}')">Suppr.</button></td></tr>`;
    }).join('')}</tbody></table></div>
    ${Object.keys(state.budgetRules).length===0 ? '<div class="empty" style="padding:10px 0;">Aucune règle configurée</div>' : ''}
  </div>
  <div class="panel"><h3>Nouvelle règle de répartition</h3>
    <div class="form-grid">
      <div class="field"><label>Point de vente</label>
        <select onchange="updateBudgetDraftField('point',this.value)">${state.points.map(p=>`<option value="${p.loc}" ${state.budgetDraft.point===p.loc?'selected':''}>${p.loc}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Poste (facultatif — laisser vide pour tout le point)</label>
        <select onchange="updateBudgetDraftField('poste',this.value)">
          <option value="" ${state.budgetDraft.poste===''?'selected':''}>— Tout le point —</option>
          ${postesDisponibles.map(po=>`<option value="${po}" ${state.budgetDraft.poste===po?'selected':''}>${po}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-grid" style="margin-top:8px;">
      ${state.budgetCategories.map((cat,i)=>`<div class="field"><label>${cat} (%)</label><input type="number" min="0" max="100" value="${state.budgetDraft.pcts[i]}" oninput="updateBudgetPct(${i}, this.value)"></div>`).join('')}
    </div>
    <div style="margin-top:8px; font-size:12.5px; color:var(--text-muted);">Total : <strong>${sommePcts}%</strong> (doit faire 100%)</div>
    <button class="btn orange" style="margin-top:10px;" onclick="saveBudgetRule()">💾 Enregistrer la répartition</button>
  </div>`;
}

/* ---- Coûts privés de prestation (section réservée au PDG) ----
   Permet d'enregistrer ce qui est payé à un prestataire externe pour certains
   services (ex : tirage DTF pour une personnalisation T-shirt, impression
   grand format pour un tableau…). Dès qu'une vente contient un produit dont le
   nom correspond, le coût correspondant est calculé automatiquement — pas
   besoin de le ressaisir à chaque vente : ça reste synchronisé avec l'argent
   qui entre (state.ventes). */
function normProdName(s){ return (s||'').trim().toLowerCase(); }
function findServiceCostForItem(produit){
  const p = normProdName(produit);
  if(!p) return null;
  return state.serviceCosts.find(sc=>normProdName(sc.produit)===p)
      || state.serviceCosts.find(sc=>p.includes(normProdName(sc.produit)) && normProdName(sc.produit).length>0);
}
function updateServiceCostDraft(field, value){
  state.serviceCostDraft[field] = value;
  renderPage();
}
function addServiceCost(){
  const d = state.serviceCostDraft;
  const produit = (d.produit||'').trim();
  const cout = parseInt(d.cout)||0;
  if(!produit || cout<=0){ toast('Merci de renseigner le produit/service et le coût payé.'); return; }
  state.serviceCostCounter++;
  state.serviceCosts.unshift({id: state.serviceCostCounter, produit, cout});
  state.serviceCostDraft = {produit:'', cout:0};
  toast('Coût enregistré');
  renderPage();
  saveSharedState(true);
}
function deleteServiceCost(id){
  state.serviceCosts = state.serviceCosts.filter(sc=>sc.id!==id);
  toast('Coût supprimé');
  renderPage();
  saveSharedState(true);
}
function computeServiceCostsSynthesis(){
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const yearStart = new Date(now.getFullYear(), 0, 1).getTime();
  const byService = {};
  state.serviceCosts.forEach(sc=>{ byService[sc.id] = {sc, qte:{jour:0,mois:0,annee:0,total:0}, recette:{jour:0,mois:0,annee:0,total:0}, cout:{jour:0,mois:0,annee:0,total:0}}; });
  activeVentes().forEach(v=>{
    (v.items||[]).forEach(it=>{
      const sc = findServiceCostForItem(it.produit);
      const entry = sc && byService[sc.id];
      if(!entry) return;
      const qty = it.qty||1;
      const recette = (it.prix||0) * qty;
      const cout = sc.cout * qty;
      entry.qte.total += qty; entry.recette.total += recette; entry.cout.total += cout;
      if(v.ts && v.ts>=dayStart){ entry.qte.jour+=qty; entry.recette.jour+=recette; entry.cout.jour+=cout; }
      if(v.ts && v.ts>=monthStart){ entry.qte.mois+=qty; entry.recette.mois+=recette; entry.cout.mois+=cout; }
      if(v.ts && v.ts>=yearStart){ entry.qte.annee+=qty; entry.recette.annee+=recette; entry.cout.annee+=cout; }
    });
  });
  return Object.values(byService);
}
function renderCouts(){
  const d = state.serviceCostDraft;
  const synth = computeServiceCostsSynthesis();
  const totals = synth.reduce((s,e)=>({recette: s.recette+e.recette.total, cout: s.cout+e.cout.total}), {recette:0, cout:0});
  return `
  <div class="panel"><h3>🔒 Coûts de prestation — section privée</h3>
    <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:10px;">Ce que vous payez à un prestataire externe pour certains services (ex : tirage DTF pour une personnalisation T-shirt, impression grand format pour un tableau…). Dès qu'une vente contient ce produit, le coût correspondant est calculé automatiquement — synchronisé avec l'argent qui entre.</p>
    <div class="form-grid">
      <div class="field"><label>Produit / service (nom utilisé dans les ventes)</label><input type="text" placeholder="ex : Personnalisation T-shirt" value="${d.produit}" oninput="updateServiceCostDraft('produit', this.value)"></div>
      <div class="field"><label>Coût payé au prestataire (par unité)</label><input type="number" min="0" placeholder="ex : 1500" value="${d.cout||''}" oninput="updateServiceCostDraft('cout', this.value)"></div>
    </div>
    <button class="btn orange" style="margin-top:10px;" onclick="addServiceCost()">💾 Enregistrer ce coût</button>
  </div>
  <div class="panel"><h3>Coûts configurés <span class="tag">${state.serviceCosts.length}</span></h3>
    <div class="table-wrap"><table><thead><tr><th>Produit / service</th><th>Coût unitaire</th><th></th></tr></thead>
    <tbody>${state.serviceCosts.map(sc=>`<tr><td>${sc.produit}</td><td>${money(sc.cout)}</td><td><button class="btn sm" onclick="deleteServiceCost(${sc.id})">Suppr.</button></td></tr>`).join('')}</tbody></table></div>
    ${state.serviceCosts.length===0 ? '<div class="empty" style="padding:10px 0;">Aucun coût configuré pour l\'instant</div>' : ''}
  </div>
  <div class="panel"><h3>Recette, coût et marge nette par service (tout l'historique)</h3>
    <div class="table-wrap"><table><thead><tr><th>Service</th><th>Qté vendue</th><th>Recette</th><th>Coût payé</th><th>Marge nette</th></tr></thead>
    <tbody>${synth.map(e=>`<tr>
      <td>${e.sc.produit}</td><td>${e.qte.total}</td><td>${money(e.recette.total)}</td><td>${money(e.cout.total)}</td>
      <td style="font-weight:700; color:${(e.recette.total-e.cout.total)>=0?'var(--green)':'var(--red)'};">${money(e.recette.total-e.cout.total)}</td>
    </tr>`).join('')}</tbody></table></div>
    ${synth.length ? `<div style="margin-top:10px; font-size:13px;"><strong>Total :</strong> Recette ${money(totals.recette)} — Coût ${money(totals.cout)} — Marge nette <strong>${money(totals.recette-totals.cout)}</strong></div>` : '<div class="empty" style="padding:10px 0;">Aucune vente ne correspond encore à un coût configuré</div>'}
  </div>
  <div class="panel"><h3>Coûts payés par période</h3>
    <div class="table-wrap"><table><thead><tr><th>Service</th><th>Aujourd'hui</th><th>Ce mois-ci</th><th>Cette année</th></tr></thead>
    <tbody>${synth.map(e=>`<tr><td>${e.sc.produit}</td><td>${money(e.cout.jour)}</td><td>${money(e.cout.mois)}</td><td>${money(e.cout.annee)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

/* ---- Dépenses de l'entreprise (section réservée au PDG) ----
   Espace pour enregistrer TOUTES les dépenses de l'entreprise (peu importe si
   elles sont liées ou non à une vente précise), classées par catégorie :
   Réinvestissement (achat de matériel, agrandissement…), Tirage (impression /
   production sous-traitée), Location (loyer des points de vente, matériel…)
   et Autres. Contrairement aux "Coûts privés" (liés automatiquement à un
   produit vendu), ici chaque dépense est saisie manuellement, avec sa date,
   son montant, sa catégorie et le point de vente concerné (facultatif). */
function updateExpenseDraft(field, value){
  state.expenseDraft[field] = value;
  renderPage();
}
function addExpense(){
  const d = state.expenseDraft;
  const montant = parseInt(d.montant)||0;
  const libelle = (d.libelle||'').trim();
  if(montant<=0){ toast('Merci de renseigner un montant valide.'); return; }
  if(!EXPENSE_CATEGORIES.includes(d.categorie)){ toast('Merci de choisir une catégorie.'); return; }
  state.expenseCounter++;
  state.expenses.unshift({
    id: 'DEP-' + state.expenseCounter, ts: Date.now(), date: new Date().toLocaleDateString('fr-FR'),
    categorie: d.categorie, montant, libelle, point: d.point || '',
  });
  state.expenseDraft = {categorie: d.categorie, montant:0, libelle:'', point: d.point};
  toast('Dépense enregistrée');
  renderPage();
  saveSharedState(true);
}
function deleteExpense(id){
  state.expenses = state.expenses.filter(e=>e.id!==id);
  toast('Dépense supprimée');
  renderPage();
  saveSharedState(true);
}
function computeExpensesSynthesis(){
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const yearStart = new Date(now.getFullYear(), 0, 1).getTime();
  const byCat = {};
  EXPENSE_CATEGORIES.forEach(c=>{ byCat[c] = {jour:0, mois:0, annee:0, total:0}; });
  const totals = {jour:0, mois:0, annee:0, total:0};
  state.expenses.forEach(e=>{
    const cat = byCat[e.categorie] ? e.categorie : 'Autres';
    byCat[cat].total += e.montant; totals.total += e.montant;
    if(e.ts && e.ts>=yearStart){ byCat[cat].annee += e.montant; totals.annee += e.montant; }
    if(e.ts && e.ts>=monthStart){ byCat[cat].mois += e.montant; totals.mois += e.montant; }
    if(e.ts && e.ts>=dayStart){ byCat[cat].jour += e.montant; totals.jour += e.montant; }
  });
  return {byCat, totals};
}
function renderDepenses(){
  const d = state.expenseDraft;
  const {byCat, totals} = computeExpensesSynthesis();
  return `
  <div class="kpi-row">
    <div class="kpi-card"><div class="label">Dépenses aujourd'hui</div><div class="value">${money(totals.jour)}</div></div>
    <div class="kpi-card"><div class="label">Dépenses ce mois-ci</div><div class="value">${money(totals.mois)}</div></div>
    <div class="kpi-card"><div class="label">Dépenses cette année</div><div class="value">${money(totals.annee)}</div></div>
    <div class="kpi-card"><div class="label">Total (tout l'historique)</div><div class="value">${money(totals.total)}</div></div>
  </div>
  <div class="panel"><h3>💸 Nouvelle dépense</h3>
    <div class="form-grid">
      <div class="field"><label>Catégorie</label>
        <select onchange="updateExpenseDraft('categorie', this.value)">${EXPENSE_CATEGORIES.map(c=>`<option value="${c}" ${d.categorie===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Montant (FCFA)</label><input type="number" min="0" placeholder="ex : 25000" value="${d.montant||''}" oninput="updateExpenseDraft('montant', this.value)"></div>
      <div class="field"><label>Point de vente concerné (facultatif)</label>
        <select onchange="updateExpenseDraft('point', this.value)">
          <option value="" ${!d.point?'selected':''}>— Toute l'entreprise —</option>
          ${state.points.map(p=>`<option value="${p.loc}" ${d.point===p.loc?'selected':''}>${p.loc}</option>`).join('')}

/* ========================= PARAMÈTRES ========================= */
function boutiqueLink(){
  return location.origin + location.pathname + '?boutique=1';
}
function fallbackCopy(link){
  const inp = document.getElementById('boutique-link');
  if(inp){ inp.select(); inp.setSelectionRange(0, 99999); document.execCommand('copy'); toast('Lien copié !'); }
}
function copyBoutiqueLink(){
  const link = boutiqueLink();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(()=>toast('Lien de la boutique copié !')).catch(()=>fallbackCopy(link));
  } else {
    fallbackCopy(link);
  }
}
function shareBoutiqueLink(){
  const link = boutiqueLink();
  const text = `Découvrez notre boutique en ligne Mperfect Pub : ${link}`;
  // navigator.share ouvre le sélecteur natif du téléphone (WhatsApp, Statut,
  // SMS, etc.) — c'est la seule façon de proposer directement le "Statut
  // WhatsApp" comme option, un site web ne peut pas y publier tout seul.
  if(navigator.share){
    navigator.share({title:'Boutique Mperfect Pub', text, url:link}).catch(()=>{});
  } else {
    // Repli : ouvre WhatsApp avec le message déjà prêt, il ne reste qu'à choisir
    // le contact, un groupe, ou "Statut" selon l'appareil.
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  }
}

/* ========================= CADEAU FIDÉLITÉ (carte à gratter) =========================
   Un client qui passe PLUS DE 4 commandes (donc 5 ou plus) au cours de la MÊME semaine
   (semaine du lundi au dimanche, identifiée par tel/téléphone) gagne automatiquement un
   cadeau : 4 mini tableaux personnalisés. L'appli lui génère alors un lien unique
   (?boutique=1&cadeau=CODE) qu'il peut ouvrir pour gratter une carte virtuelle et
   découvrir son cadeau. */
const GIFT_ORDER_THRESHOLD = 5; // "plus de 4" = à partir de la 5e commande
const GIFT_PRIZE_LABEL = '4 mini tableaux personnalisés';

const normTel = t => String(t||'').replace(/\D/g,'');

// Clé de semaine = date du lundi de cette semaine-là (YYYY-MM-DD), simple et stable.
function weekKeyFor(ts){
  const d = new Date(ts);
  const day = (d.getDay()+6)%7; // 0 = lundi ... 6 = dimanche
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate()-day);
  const y = monday.getFullYear();
  const m = String(monday.getMonth()+1).padStart(2,'0');
  const dd = String(monday.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function giftLinkFor(code){
  return location.origin + location.pathname + '?boutique=1&cadeau=' + encodeURIComponent(code);
}

function copyGiftLink(code){
  const link = giftLinkFor(code);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(()=>toast('Lien du cadeau copié !')).catch(()=>toast(link));
  } else {
    toast(link);
  }
}

function findGiftForTel(tel){

/* ---- Compteur de visiteurs de la boutique ----
   Chaque appareil qui ouvre la boutique en ligne compte comme une visite par
   jour (une seule fois par jour et par appareil, pour ne pas gonfler le
   compteur à chaque rechargement de page). Le compteur est cumulé de façon
   atomique côté serveur (FieldValue.increment), comme pour le stock, afin
   d'éviter qu'une visite écrase celle d'un autre visiteur au même moment. */
const VISIT_LAST_DAY_KEY = 'mperfect-last-visit-day';
function dayKeyFor(ts){
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
async function recordVisit(){
  const key = dayKeyFor(Date.now());
  try{
    if(localStorage.getItem(VISIT_LAST_DAY_KEY) === key) return;
  }catch(e){}
  try{
    await db.runTransaction(async tx=>{
      const snap = await tx.get(sharedDocRef);
      const data = snap.exists ? snap.data() : {};
      const visits = {...(data.visits||{})};
      visits[key] = (visits[key]||0) + 1;
      tx.set(sharedDocRef, {visits}, {merge:true});
    });
    try{ localStorage.setItem(VISIT_LAST_DAY_KEY, key); }catch(e){}
  }catch(e){ console.warn('Comptage de visite non enregistré', e); }
}
function renderVisiteurs(){
  const visits = state.visits || {};
  const now = new Date();
  const todayKey = dayKeyFor(now);
  const monthPrefix = todayKey.slice(0,7); // YYYY-MM
  const yearPrefix = todayKey.slice(0,4);  // YYYY
  let today = 0, month = 0, year = 0;
  const days = Object.keys(visits).sort().reverse();
  days.forEach(k=>{
    const v = visits[k]||0;
    if(k===todayKey) today += v;
    if(k.startsWith(monthPrefix)) month += v;
    if(k.startsWith(yearPrefix)) year += v;
  });
  return `
  <div class="kpi-row" style="grid-template-columns:repeat(3,1fr);">
    <div class="kpi-card"><div class="label">Visiteurs aujourd'hui</div><div class="value">${today}</div></div>
    <div class="kpi-card"><div class="label">Visiteurs ce mois-ci</div><div class="value">${month}</div></div>
    <div class="kpi-card"><div class="label">Visiteurs cette année</div><div class="value">${year}</div></div>
  </div>
  <div class="panel"><h3>Détail par jour</h3>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Visites</th></tr></thead>
    <tbody>${days.slice(0,60).map(k=>`<tr><td>${k}</td><td>${visits[k]}</td></tr>`).join('')}</tbody></table></div>
    ${days.length===0 ? '<div class="empty" style="padding:10px 0;">Aucune visite enregistrée pour l\'instant</div>' : ''}
  </div>`;
}

// Appelée juste après l'enregistrement d'une nouvelle commande client : compte les
// commandes de ce numéro de téléphone sur la semaine en cours, et crée le cadeau
// (une seule fois par client et par semaine) si le seuil est atteint.
function checkWeeklyGift(tel, clientName){
  const t = normTel(tel);
  if(!t) return null;
  const weekKey = weekKeyFor(Date.now());
  const count = state.customerOrders.filter(o => normTel(o.tel)===t && o.status!=='annulee' && weekKeyFor(o.ts)===weekKey).length;
  if(count < GIFT_ORDER_THRESHOLD) return null;
  const already = state.customerGifts.find(g=>normTel(g.tel)===t && g.weekKey===weekKey);
  if(already) return null; // déjà offert cette semaine-là, pas de doublon
  state.giftCounter++;
  const gift = {
    code: 'MP-CADEAU-' + state.giftCounter + '-' + shortSuffix(),
    tel: t, client: clientName || '', weekKey, ordersCount: count,
    prize: GIFT_PRIZE_LABEL, ts: Date.now(), revealed: false, revealedAt: null,
  };
  state.customerGifts.unshift(gift);
  return gift;
}

function initScratchCard(){
  const gift = findActiveGift();
  if(!gift || gift.revealed) return;
  const canvas = document.getElementById('scratch-canvas');
  if(!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height = canvas.clientHeight;
  const grad = ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0, '#c7ccd4');
  grad.addColorStop(1, '#9aa1ad');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#0f2540';
  ctx.font = '700 15px Sora, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🎁 Grattez ici', w/2, h/2+5);
  ctx.globalCompositeOperation = 'destination-out';
  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x:cx, y:cy};
  }
  function scratchAt(x,y){
    ctx.beginPath();
    ctx.arc(x,y,22,0,Math.PI*2);
    ctx.fill();
  }
  function checkRevealed(){
    const data = ctx.getImageData(0,0,w,h).data;
    let cleared = 0, sampled = 0;
    for(let i=3;i<data.length;i+=4*15){ sampled++; if(data[i]===0) cleared++; }
    if(sampled && (cleared/sampled) > 0.45) revealGift(gift);
  }
  function start(e){ drawing = true; const p = pos(e); scratchAt(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); scratchAt(p.x,p.y); checkRevealed(); e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

function placeOrder(paye){
  const c = state.checkout;
  if(state.panier.length===0){ toast('Votre panier est vide.'); return; }
  if(!c.nom || !c.tel || !c.adresse){ toast('Merci de renseigner vos coordonnees de livraison.'); return; }
  state.trackingCounter++;
  const tracking = 'MP-TRK-' + state.trackingCounter + '-' + shortSuffix();
  const order = {
    tracking, items: state.panier.map(i=>({...i})), total: cartTotal(),
    client: c.nom, tel: c.tel, adresse: c.adresse, point: c.point, paiement: c.paiement,
    paiementConfirme: !!paye, paiementRef: c.paiementRef || '',
    status: 'recue', progress: 0, location: '', date: new Date().toLocaleString('fr-FR'), ts: Date.now(), livreur: '',
  };
  state.customerOrders.unshift(order);
  saveInvoiceNote(tracking, c.noteAudio, []);
  order.items.forEach(i => deductStockForSale(i.name, i.qty));
  const earnedPoints = Math.floor(order.total / 1000);
  const client = findOrCreateClient(order.client, order.point);
  client.achats += 1;
  client.total += order.total;
  client.points += earnedPoints;
  state.myTel = order.tel;
  state.lastAwardedGift = checkWeeklyGift(order.tel, order.client);
  state.panier = [];
  state.trackingResult = order;
  state.checkout = {nom:'', tel:'', adresse:'', point:c.point, paiement:c.paiement, noteAudio:null};
  toast('Commande passee — numero de suivi ' + tracking);
  state.boutiquePage = 'confirmation';
  renderBoutiquePage();
  saveSharedState(true);
}
function findOrderByTracking(){
  const code = state.trackingSearch.trim().toUpperCase();

  if(!found) toast("Aucune commande trouvee pour ce numero.");
  renderBoutiquePage();
}
function advanceOrder(tracking){
  const order = state.customerOrders.find(o=>o.tracking===tracking);
  if(!order) return;
  const steps = ['recue','preparation','disponible','livraison','livree'];
  const locs = ['Entrepot Mperfect Pub — Dakar','En route — Sacre-Coeur, Dakar','En route — Almadies, Dakar'];
  const idx = steps.indexOf(order.status);
  if(order.status==='livraison'){
    order.progress = Math.min(100, order.progress+50);
    order.location = locs[Math.min(2, Math.floor(order.progress/50))];
    if(order.progress >= 100) order.status = 'livree';
  } else if(idx < steps.length-1){
    order.status = steps[idx+1];
    if(order.status==='livraison'){ order.progress = 0; order.location = locs[0]; }
  }
  toast('Commande ' + tracking + ' mise a jour');
  renderBoutiquePage();
}

// Petit texte relatif ("à l'instant", "il y a 2 min") à partir d'un horodatage.
function timeAgoLabel(ts){
  if(!ts) return '';
  const s = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(s < 20) return "à l'instant";
  if(s < 60) return 'il y a ' + s + ' s';
  const m = Math.round(s/60);
  return 'il y a ' + m + ' min';
}
// Une commande a un suivi GPS en direct si le livreur a envoyé une position récente
// (moins de 2 min — au-delà, on considère le signal perdu et on repasse à l'ancien
// mode "démo").
function hasLiveTracking(order){
  return !!(order && order.status==='livraison' && order.livreurTs && (Date.now()-order.livreurTs) < 120000);
}
// Carte affichant la position en direct du livreur côté client (et non plus
// seulement une barre de progression abstraite) : c'était le principal manque
// signalé ("le client ne voit rien de où est le livreur").
function renderLiveCourierMap(order){
  if(!hasLiveTracking(order) || order.livreurLat==null || order.livreurLng==null) return '';
  const destParam = order.clientLat!=null ? `${order.clientLat},${order.clientLng}` : encodeURIComponent(order.adresse + (order.point ? ', ' + order.point : ''));
  const mapsUrl = `https://www.google.com/maps?saddr=${order.livreurLat},${order.livreurLng}&daddr=${destParam}&output=embed`;
  return `<div class="client-loc-panel">
    <div style="font-weight:700; color:var(--blue-900); font-size:13px;">🛵 Position du livreur en direct</div>
    <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">${order.livreurTs ? 'Mise à jour ' + timeAgoLabel(order.livreurTs) : ''}</div>
    <iframe title="Position du livreur" src="${mapsUrl}" loading="lazy"></iframe>
  </div>`;
}
function renderDeliveryRoute(order){
  if(order.status!=='livraison' && order.status!=='livree') return '';
  const progress = order.status==='livree' ? 100 : (order.progress||0);
  const x1=30, x2=370, y=58;
  const cx = x1 + (x2-x1)*(progress/100);
  const depotLabel = 'Entrepôt Mperfect Pub — ' + (order.point || 'Dakar');
  const destLabel = order.adresse || 'Votre adresse';
  return `
  <div class="route-map">
    <div class="route-map-title">🗺️ Itinéraire de livraison en direct</div>
    <svg viewBox="0 0 400 110" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; display:block;">
      <line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <line x1="${x1}" y1="${y}" x2="${cx}" y2="${y}" stroke="var(--orange-500)" stroke-width="5" stroke-linecap="round"/>
      <text x="${x1}" y="${y-14}" font-size="20" text-anchor="middle">🏭</text>
      <text x="${x2}" y="${y-14}" font-size="20" text-anchor="middle">🏠</text>
      ${progress<100 ? `<text x="${cx}" y="${y-16}" font-size="24" text-anchor="middle">🚚</text>` : `<circle cx="${x2}" cy="${y}" r="8" fill="var(--green)"/>`}
    </svg>
    <div class="route-addr-row"><span>${depotLabel}</span><span title="${destLabel}">${destLabel}</span></div>
    <div class="route-progress-lbl" style="color:${progress<100?'var(--orange-600)':'var(--green)'};">
      ${progress<100 ? `🚚 ${progress}% du trajet — ${order.location || 'en route'}` : '🎉 Livrée à votre adresse'}
    </div>
  </div>`;
}
/* Le client peut partager sa position GPS en direct depuis sa page "Suivre ma
   commande" — utile quand une adresse écrite ne suffit pas à retrouver la
   maison. Cette position est enregistrée sur la commande et devient ensuite
   la destination prioritaire pour le calcul d'itinéraire du livreur. */
function shareClientLocation(tracking){
  if(!navigator.geolocation){ toast("La géolocalisation n'est pas disponible sur cet appareil."); return; }
  toast('📡 Récupération de votre position…');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const order = state.customerOrders.find(o=>o.tracking===tracking);
      if(order){
        order.clientLat = pos.coords.latitude;
        order.clientLng = pos.coords.longitude;
        order.clientLocTs = Date.now();
        saveSharedState(true);
        toast('📍 Position envoyée au livreur !');
        renderPage();
      }
    },
    ()=>{ toast('⚠️ Impossible de récupérer votre position — vérifiez que la localisation est autorisée dans votre navigateur.'); },
    {enableHighAccuracy:true, timeout:8000}
  );
}
function renderClientLocationPanel(order){
  if(order.status!=='livraison' && order.status!=='disponible') return '';
  const hasGps = order.clientLat!=null && order.clientLng!=null;
  const destParam = hasGps ? `${order.clientLat},${order.clientLng}` : encodeURIComponent(order.adresse + (order.point ? ', ' + order.point : ''));
  const mapsUrl = `https://www.google.com/maps?q=${destParam}&z=15&output=embed`;
  return `<div class="client-loc-panel">
    <div style="font-weight:700; color:var(--blue-900); font-size:13px;">🗺️ Aidez le livreur à vous trouver</div>
    <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">Partagez votre position GPS en direct pour une livraison plus rapide et précise.</div>
    <iframe title="Carte" src="${mapsUrl}" loading="lazy"></iframe>
    <button type="button" class="client-loc-btn" onclick="shareClientLocation('${order.tracking}')"><span class="pin">📍</span> Partager ma position en direct</button>
    ${hasGps ? `<div class="client-loc-sent">✅ Position envoyée au livreur${order.clientLocTs ? ' à ' + new Date(order.clientLocTs).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : ''}</div>` : ''}
  </div>`;
}
function renderTrackingTimeline(order){
  const steps = [
    {id:'recue', label:'Commande recue', icon:'🧾'},
    {id:'preparation', label:'En preparation', icon:'📦'},
    {id:'disponible', label:'Disponible', icon:'✅'},
    {id:'livraison', label:'En livraison', icon:'🚚'},
    {id:'livree', label:'Livree', icon:'🏠'},
  ];
  const idx = steps.findIndex(s=>s.id===order.status);
  return `
  <div class="timeline">
    ${steps.map((s,i)=>`
      <div class="tl-step ${i<idx?'done':''} ${i===idx?'active':''}">
        <div class="dot">${i<idx?'✓':s.icon}</div>
        <div class="lb">${s.label}</div>
      </div>`).join('')}
  </div>
  ${order.status==='disponible' ? `<div class="track-loc" style="background:var(--blue-100); color:var(--blue-700);">✅ Votre commande est disponible — prete a etre recuperee ou expediee</div>` : ''}
  ${(order.status==='livraison' || order.status==='disponible') && order.livraisonPrix ? `
  <div class="price-card">
    <div class="price-card-top"><span class="price-card-moto">🛵</span> Course de livraison</div>
    <div class="price-card-amount">${money(order.livraisonPrix)}</div>
    <div class="price-card-sub">📏 ${order.livraisonDistanceKm} km${order.livraisonDureeMin ? ' · ~'+order.livraisonDureeMin+' min' : ''} jusqu'à chez vous</div>
  </div>` : ''}
  ${order.status==='livraison' ? `<div class="track-loc">📍 ${order.location || 'Entrepot Mperfect Pub — Dakar'} — ${order.progress}% du trajet${hasLiveTracking(order) ? ' · <span style="color:var(--green); font-weight:700;">🔴 en direct</span>' : ''}</div>` : ''}
  ${order.status==='livree' ? `<div class="track-loc" style="background:var(--green-bg); color:var(--green);">🎉 Livree chez ${order.client}, ${order.adresse}</div>` : ''}
  ${renderLiveCourierMap(order)}
  ${renderClientLocationPanel(order)}
  ${renderDeliveryRoute(order)}
  <div style="text-align:center; margin-top:16px;">
    ${hasLiveTracking(order)
      ? `<div style="font-size:11.5px; color:var(--text-muted);">🔴 Suivi en direct actif — mis à jour ${timeAgoLabel(order.livreurTs)}</div>`
      : `<button class="btn sm" onclick="advanceOrder('${order.tracking}')">Simuler la prochaine etape (demo)</button>`}
  </div>`;
}

  <div class="track-box">
    <div class="track-num">
      <input type="text" placeholder="Numero de suivi (ex : MP-TRK-48201-K7Q)" value="${state.trackingSearch}" oninput="state.trackingSearch=this.value" onkeydown="if(event.key==='Enter')findOrderByTracking()">
      <button class="btn orange" onclick="findOrderByTracking()">Rechercher</button>
    </div>
    ${state.trackingResult ? `
      <div class="order-card" style="margin-bottom:0;">
        <div class="id">${state.trackingResult.tracking}</div>
        <div style="color:var(--text-muted); margin-top:4px;">${state.trackingResult.items.map(i=>i.name+' ×'+i.qty).join(', ')} — ${money(state.trackingResult.total)}</div>
        ${state.trackingResult.delai ? `<div style="color:var(--orange-600); font-weight:600; margin-top:6px;">⏱️ Délai annoncé : ${state.trackingResult.delai}</div>` : ''}
      </div>
      ${(()=>{ const g = findGiftForTel(state.trackingResult.tel); return g ? `<div class="track-loc" style="background:var(--orange-100); color:var(--orange-600); cursor:pointer; font-weight:700;" onclick="state.activeGiftCode='${g.code}'; setBoutiquePage('cadeau');">🎁 Vous avez un cadeau fidélité ${g.revealed?'':'à gratter '}! Cliquez pour le voir.</div>` : ''; })()}

        ${state.customerOrders.slice(0,3).map(o=>`<div class="order-card" style="cursor:pointer;" onclick="state.trackingSearch='${o.tracking}'; findOrderByTracking();"><span class="id">${o.tracking}</span> — ${money(o.total)}</div>`).join('')}
      </div>` : ''}
  </div>`;
}

/* ========================= NOTIFICATIONS DE VENTE (PDG) ========================= */
const NOTIF_PREF_KEY = 'mperfect-notif-enabled';
let swRegistration = null;
let sharedStateInitialized = false;
const myOwnSaleNumeros = new Set();

async function ensureServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  if(swRegistration) return swRegistration;
  try{
    const swCode = "self.addEventListener('notificationclick',function(e){e.notification.close();e.waitUntil(clients.matchAll({type:'window'}).then(function(list){for(const c of list){if('focus' in c) return c.focus();}}));});";
    const blobUrl = URL.createObjectURL(new Blob([swCode], {type:'application/javascript'}));
    swRegistration = await navigator.serviceWorker.register(blobUrl);
    return swRegistration;
  }catch(e){ console.error('Erreur service worker notifications', e); return null; }
}

function notificationsSupported(){
  return typeof Notification !== 'undefined';
}
function notificationsEnabled(){
  return notificationsSupported() && Notification.permission==='granted' && localStorage.getItem(NOTIF_PREF_KEY)==='1';
}
async function toggleSaleNotifications(){
  if(!notificationsSupported()){ toast("Les notifications ne sont pas prises en charge sur ce navigateur. Sur iPhone, ajoutez d'abord l'appli à l'écran d'accueil."); renderPage(); return; }
  if(Notification.permission==='granted' && localStorage.getItem(NOTIF_PREF_KEY)==='1'){
    localStorage.setItem(NOTIF_PREF_KEY, '0');
    toast('Notifications de vente désactivées.');
    renderPage();
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){
    await ensureServiceWorker();
    localStorage.setItem(NOTIF_PREF_KEY, '1');
    toast('Notifications de vente activées ✅');
  } else {
    localStorage.setItem(NOTIF_PREF_KEY, '0');
    toast('Notifications refusées — activez-les dans les réglages de votre téléphone pour ce site.');
  }
  renderPage();
}
async function showSaleNotification(v){
  if(!notificationsEnabled()) return;
  const title = `Nouvelle vente — ${money(v.total)}`;
  const body = `${v.vendeur} · ${invoiceProductSummary(v)} · ${v.point}${v.poste ? ' ('+v.poste+')' : ''}`;
  try{
    const reg = await ensureServiceWorker();
    if(reg && reg.showNotification){
      reg.showNotification(title, {body, tag:v.numero});
      return;
    }
  }catch(e){ /* on retente en direct ci-dessous */ }
  try{ new Notification(title, {body}); }catch(e){ /* non supporté sur cet appareil */ }
}

/* ========================= ECRAN DE CONNEXION ========================= */
const AUTH_SESSION_KEY = 'mperfect-auth-session';
let authTab = 'role';

function setAuthTab(tab){
  authTab = tab;
  document.getElementById('auth-role-fields').style.display = tab==='role' ? 'flex' : 'none';
  document.getElementById('auth-staff-fields').style.display = tab==='staff' ? 'flex' : 'none';
  document.getElementById('auth-tab-role').style.background = tab==='role' ? '#0f2540' : '#f1f2f4';
  document.getElementById('auth-tab-role').style.color = tab==='role' ? '#fff' : '#0f2540';
  document.getElementById('auth-tab-staff').style.background = tab==='staff' ? '#0f2540' : '#f1f2f4';
  document.getElementById('auth-tab-staff').style.color = tab==='staff' ? '#fff' : '#0f2540';
  document.getElementById('auth-error').textContent = '';
}

function populateAuthGate(){
  const sel = document.getElementById('auth-role');
  if(sel) sel.innerHTML = Object.entries(ROLE_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  const staffSel = document.getElementById('auth-staff');
  if(staffSel){
    staffSel.innerHTML = state.staff.length
      ? state.staff.map(st=>`<option value="${st.name}">${st.name} — ${st.profession}</option>`).join('')
      : `<option value="">Aucun personnel enregistré</option>`;
  }
}

function checkAuthGate(){
  const pwdInput = document.getElementById('auth-pwd');
  const errEl = document.getElementById('auth-error');
  const entered = pwdInput.value;

  if(authTab === 'staff'){
    const staffSel = document.getElementById('auth-staff');
    const st = state.staff.find(s=>s.name===staffSel.value);
    if(!st){ errEl.textContent = 'Aucun personnel sélectionné.'; return; }
    if(entered !== st.password){
      errEl.textContent = 'Mot de passe incorrect.';
      pwdInput.value = ''; pwdInput.focus();
      return;
    }
    const role = /livreur/i.test(st.profession) ? 'livreur' : 'vendeur';
    sessionStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({role, staffName:st.name}));
    unlockApp(role, st.name);
    return;
  }

  const sel = document.getElementById('auth-role');
  const role = sel.value;
  if(!roleCodeOk(role, entered)){
    errEl.textContent = 'Mot de passe incorrect.';
    pwdInput.value = '';
    pwdInput.focus();
    return;
  }
  sessionStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({role}));
  unlockApp(role);
}

function loadLocalRoleName(role){
  try{ return localStorage.getItem('mperfect-name-'+role) || ''; }catch(e){ return ''; }
}
function saveLocalRoleName(role, name){
  try{ localStorage.setItem('mperfect-name-'+role, name); }catch(e){}
}
function saveProfileName(value){
  value = (value||'').trim();
  if(!value){ toast('Merci de saisir un nom.'); return; }
  ROLE_NAMES[state.role] = value;
  saveLocalRoleName(state.role, value);
  toast('Nom enregistré sur cet appareil');
  renderPage();
}
function unlockApp(role, staffName){
  state.role = role;
  state.__staffName = staffName || '';
  if(staffName){
    ROLE_NAMES[role] = staffName;
  } else {
    // pas de profil "Personnel" sélectionné (connexion par mot de passe de rôle) :
    // on réutilise le nom que cette personne avait déjà enregistré sur cet appareil.
    const saved = loadLocalRoleName(role);
    if(saved) ROLE_NAMES[role] = saved;
  }
  const allowed = MENU.filter(m=>m.roles.includes(role));
  if(!allowed.find(m=>m.id===state.page)) state.page = allowed[0].id;
  const gate = document.getElementById('auth-gate');
  if(gate) gate.style.display = 'none';
  renderAll();
  startPresenceHeartbeat();
}

(async function init(){
  populateAuthGate();
  // On démarre l'écoute des images de produits tout de suite, en parallèle du chargement
  // de l'état partagé, au lieu d'attendre que celui-ci soit fini : cela réduit au minimum
  // la fenêtre pendant laquelle applyProductImages() pourrait tourner sans encore savoir
  // quelles images existent réellement (voir le garde-fou productImagesReady plus haut).
  listenToProductImages();
  await loadState();
  populateAuthGate();
  renderAll();
  listenToSharedState();
  listenToStoreAssets();
  listenToPresence();
  const savedSession = sessionStorage.getItem(AUTH_SESSION_KEY);
  if(savedSession){
    try{
      const {role, staffName} = JSON.parse(savedSession);
      if(role && ROLE_LABELS[role]) unlockApp(role, staffName);
    }catch(e){ sessionStorage.removeItem(AUTH_SESSION_KEY); }
  }
  if(new URLSearchParams(location.search).get('boutique')==='1'){
    toggleMode('boutique');
    const gate = document.getElementById('auth-gate');
    if(gate) gate.style.display = 'none';
    const track = new URLSearchParams(location.search).get('track');
    if(track){
      state.trackingSearch = track;
      setBoutiquePage('suivi');
      findOrderByTracking();
    }
    const cadeau = new URLSearchParams(location.search).get('cadeau');
    if(cadeau){
      state.activeGiftCode = cadeau;
      setBoutiquePage('cadeau');
    }
  }
})();
</script>
