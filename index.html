/* ========================= DASHBOARD ========================= */
function computePointSales(){
  // Calcule les ventes du jour / du mois à partir des ventes réelles (state.ventes),
  // au lieu d'un compteur cumulé qui ne se remettait jamais à zéro — c'est ce compteur
  // jamais réinitialisé qui pouvait rendre "Revenus du jour" plus grand que le total.
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const byPoint = {};
  state.points.forEach(p=>{ byPoint[p.loc] = {jour:0, mois:0}; });
  activeVentes().forEach(v=>{
    if(!byPoint[v.point]) byPoint[v.point] = {jour:0, mois:0};
    if(v.ts && v.ts>=monthStart) byPoint[v.point].mois += v.total;
    if(v.ts && v.ts>=dayStart) byPoint[v.point].jour += v.total;
  });
  return byPoint;
}
function computeCAByPeriodAndMethod(){
  // Ventilation du chiffre d'affaires encaissé par mode de paiement, sur trois
  // périodes (jour / mois / année en cours), pour répondre à "combien en Wave,
  // Espèces… aujourd'hui, ce mois, cette année".
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const yearStart = new Date(now.getFullYear(), 0, 1).getTime();
  const methods = ['Wave','Orange Money','Espèces','Virement'];
  const empty = () => ({'Wave':0, 'Orange Money':0, 'Espèces':0, 'Virement':0});
  const byPeriod = { jour: empty(), mois: empty(), annee: empty() };
  activeVentes().forEach(v=>{
    // Anciennes factures sans historique : on retombe sur l'ancien comportement
    // (un seul encaissement, à la date de création).
    const paiements = (Array.isArray(v.paiements) && v.paiements.length)
      ? v.paiements
      : (v.ts ? [{montant: v.avance!=null ? v.avance : v.total, ts: v.ts, mode: v.paiement}] : []);
    paiements.forEach(p=>{
      if(!p.ts || !methods.includes(p.mode)) return;
      if(p.ts>=dayStart) byPeriod.jour[p.mode] += p.montant;
      if(p.ts>=monthStart) byPeriod.mois[p.mode] += p.montant;
      if(p.ts>=yearStart) byPeriod.annee[p.mode] += p.montant;
    });
  });
  return byPeriod;
}
function posteKeyForVente(v){
  return v.poste ? `${v.point} — ${v.poste}` : v.point;
}
function computeCAByPoste(){
  // Chiffre d'affaires encaissé par poste de vente (point de vente, ou sous-poste
  // quand le point en a — ex : Dakar / Keur Massar Sud 1), sur jour / mois / année / total.
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const yearStart = new Date(now.getFullYear(), 0, 1).getTime();
  const byPoste = {};
  activeVentes().forEach(v=>{
    const key = posteKeyForVente(v);
    if(!byPoste[key]) byPoste[key] = {jour:0, mois:0, annee:0, total:0};
    // Anciennes factures sans historique : on retombe sur l'ancien comportement
    // (un seul encaissement, à la date de création).
    const paiements = (Array.isArray(v.paiements) && v.paiements.length)
      ? v.paiements
      : (v.ts ? [{montant: v.avance!=null ? v.avance : v.total, ts: v.ts}] : []);
    paiements.forEach(p=>{
      byPoste[key].total += p.montant;
      if(p.ts && p.ts>=dayStart) byPoste[key].jour += p.montant;
      if(p.ts && p.ts>=monthStart) byPoste[key].mois += p.montant;
      if(p.ts && p.ts>=yearStart) byPoste[key].annee += p.montant;
    });
  });
  return byPoste;
}
function renderDashboard(){
  const pointSales = computePointSales();
  // Chiffre d'affaires / revenus du jour : uniquement l'argent réellement encaissé (avance
  // versée), pour ne plus mélanger avec les sommes pas encore payées — celles-ci ont
  // maintenant leur propre champ "Restant à encaisser" ci-dessous.
  const totalCA = activeVentes().reduce((s,v)=>s+(v.avance!=null ? v.avance : v.total),0);
  const totalRestant = activeVentes().reduce((s,v)=>s+(v.restant||0),0);
  // "Revenus du jour" doit compter l'argent reçu AUJOURD'HUI, quelle que soit la date de
  // création de la facture : un paiement de restant fait aujourd'hui sur une facture
  // créée hier (ou avant) est de l'argent encaissé aujourd'hui, et doit apparaître ici —
  // exactement comme il apparaît déjà dans "Chiffre d'affaires par mode de paiement"
  // ci-dessous, qui se base sur l'historique des paiements (v.paiements) plutôt que sur
  // la date de la facture. On réutilise ce même calcul pour que les deux chiffres restent
  // cohérents entre eux.
  const caByPeriod = computeCAByPeriodAndMethod();
  const caJour = Object.values(caByPeriod.jour).reduce((s,m)=>s+m,0);
  const totalCommandes = state.customerOrders.filter(c=>c.status!=='livree' && c.status!=='annulee').length;
  const lowStock = state.stock.filter(s=>s.qty < s.threshold);

  const pointsCoords = {
    'Dakar':[58,200],'Thiès':[100,190],'Touba':[175,170],'Kaolack':[185,235],
    'Louga':[150,118],'Saint-Louis':[95,70],'Ziguinchor':[85,315]

function removePoste(id, index){
  const p = state.points.find(pt=>pt.id===id);

  const removed = p.postes[index];
  p.postes.splice(index,1);
  toast(`Poste "${removed}" retiré`);
  renderPage();
}
// Renomme un poste sans perdre l'historique : les factures déjà enregistrées
// sous l'ancien nom (et la règle de répartition budgétaire associée) sont
// automatiquement basculées vers le nouveau nom, au lieu de rester "orphelines"
// d'un poste qui n'existe plus (ex : correction d'une faute de frappe).
function renamePoste(id, index){
  const p = state.points.find(pt=>pt.id===id);
  if(!p) return;
  const oldName = p.postes[index];
  const newName = (window.prompt(`Renommer le poste "${oldName}" en :`, oldName) || '').trim();
  if(!newName || newName===oldName) return;
  if(p.postes.some((po,i)=>i!==index && po.toLowerCase()===newName.toLowerCase())){ toast('Ce nom de poste existe déjà dans cette région.'); return; }
  p.postes[index] = newName;
  let updated = 0;
  state.ventes.forEach(v=>{ if(v.point===p.loc && v.poste===oldName){ v.poste=newName; updated++; } });
  const oldKey = budgetKey(p.loc, oldName), newKey = budgetKey(p.loc, newName);
  if(state.budgetRules[oldKey] && !state.budgetRules[newKey]){
    state.budgetRules[newKey] = state.budgetRules[oldKey];
    delete state.budgetRules[oldKey];
  }
  toast(`Poste renommé — ${updated} facture(s) mise(s) à jour.`);
  renderPage();
  saveSharedState(true);
}

function stockAction(id, delta){

function requestStock(id){

}
// Crée automatiquement une fiche de stock pour chaque produit du catalogue qui
// n'en a pas encore (correspondance par nom exact) — pour que le stock central
// et le catalogue produits restent les deux mêmes listes de produits, au lieu
// de deux listes tenues séparément à la main.
// Une seule sauvegarde groupée (une transaction) au lieu d'une par produit :
// envoyer plusieurs dizaines de sauvegardes simultanées vers le même document
// pouvait entrer en concurrence et en faire échouer certaines sous réseau chargé.
async function syncStockWithCatalogue(){
  const missing = state.products.filter(p => !state.stock.some(s=>s.name.toLowerCase()===p.name.toLowerCase()));
  if(missing.length===0){ toast('Le stock est déjà à jour avec le catalogue.'); return; }
  try{
    await db.runTransaction(async tx=>{
      const snap = await tx.get(sharedDocRef);
      const data = snap.exists ? snap.data() : {};
      const stock = Array.isArray(data.stock) ? data.stock.slice() : (state.stock||[]).slice();
      let nextId = stock.length ? Math.max(...stock.map(s=>s.id))+1 : 1;
      missing.forEach(p=>{
        if(stock.some(s=>s.name.toLowerCase()===p.name.toLowerCase())) return; // déjà ajouté entre-temps par un autre appareil
        stock.push({id: nextId++, name: p.name, unit:'unités', qty:0, threshold:5});
      });
      tx.set(sharedDocRef, {stock}, {merge:true});
      state.stock = stock; // reflète immédiatement en local ce qui vient d'être confirmé côté serveur
    });
    toast(`${missing.length} produit(s) du catalogue ajouté(s) au stock.`);
    renderPage();
  }catch(e){
    console.error('Erreur synchronisation stock/catalogue', e);
    toast('⚠️ Synchronisation non enregistrée (réseau). Réessayez.');
  }
}

function handleProductImageFile(name, fileList){
  const file = fileList && fileList[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 600;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        const scale = maxDim / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
      const p = state.products.find(x=>x.name===name);
      if(p){
        p.img = dataUrl; // affichage immédiat, sans attendre la confirmation du serveur
        productImagesMap[name] = dataUrl;
        renderPage();
      }
      productImagesCol.doc(encodeURIComponent(name)).set({img: dataUrl, ts: Date.now()})
        .then(()=>toast(`Image mise à jour pour "${name}"`))
        .catch(err=>{ console.error('Erreur enregistrement image produit', err); toast('⚠️ Image non enregistrée sur le serveur (réseau). Réessayez.'); });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeProductImage(name){
  const p = state.products.find(x=>x.name===name);
  if(!p) return;
  p.img = '';
  delete productImagesMap[name];
  toast(`Image retirée pour "${name}"`);
  renderPage();
  productImagesCol.doc(encodeURIComponent(name)).delete().catch(err=>console.error('Erreur suppression image produit', err));

function toggleProductDetails(name){
  state.uiOpen.products[name] = !state.uiOpen.products[name];
  renderPage();
}
function updateProduct(oldName, newName, newPrice, newDesc, newCategorie, newDuree, newPrixBarre){
  const p = state.products.find(x=>x.name===oldName);
  if(!p) return;
  newName = (newName||'').trim();
  newPrice = parseInt(newPrice) || 0;
  // Le prix barré (ancien prix affiché en promo) est optionnel : un champ vide ou à 0
  // désactive la promo. On l'ignore aussi s'il n'est pas strictement supérieur au prix
  // de vente actuel, sinon la promo n'aurait pas de sens (ex: prix barré 5000 pour un
  // prix de vente à 6000 — rien à "barrer").
  let newPrixBarreN = parseInt(newPrixBarre) || 0;
  if(!newName || newPrice<=0){ toast('Merci de renseigner un nom et un prix valides.'); return; }
  if(newPrixBarreN && newPrixBarreN<=newPrice) newPrixBarreN = 0;
  if(newName.toLowerCase()!==oldName.toLowerCase() && state.products.some(x=>x.name.toLowerCase()===newName.toLowerCase())){
    toast('Un produit avec ce nom existe déjà.'); return;
  }
  if(newName !== oldName){
    if(state.uiOpen.products[oldName]){ delete state.uiOpen.products[oldName]; state.uiOpen.products[newName] = true; }
    if(state.uiOpen.catalog[oldName]){ delete state.uiOpen.catalog[oldName]; state.uiOpen.catalog[newName] = true; }
  }
  p.name = newName; p.prix = newPrice; p.desc = (newDesc||'').trim(); p.categorie = (newCategorie||'').trim(); p.duree = (newDuree||'').trim(); p.prixBarre = newPrixBarreN;
  toast(`Produit "${newName}" mis à jour`);
  renderPage();
}
function toggleStockDetails(id){
  state.uiOpen.stock[id] = !state.uiOpen.stock[id];
  renderPage();
}
function toggleCatalogDetails(name){
  state.uiOpen.catalog[name] = !state.uiOpen.catalog[name];
  renderBoutiquePage();
}
function updateStockItem(id, name, unit, qty, threshold){
  const s = state.stock.find(x=>x.id===id);
  if(!s) return;
  name = (name||'').trim();
  if(!name){ toast('Le nom ne peut pas être vide.'); return; }
  s.name = name;
  s.unit = (unit||'unités').trim();
  s.qty = Math.max(0, parseInt(qty) || 0);
  s.threshold = Math.max(0, parseInt(threshold) || 0);
  toast(`Article "${name}" mis à jour`);
  renderPage();
  commitStockUpsert({...s});
}
function addStaff(name, profession, password, tel){
  name = (name||'').trim(); profession = (profession||'').trim(); password = (password||'').trim(); tel = (tel||'').trim();
  if(!name || !profession || !password || !tel){ toast('Merci de renseigner nom, profession, mot de passe et numéro de téléphone.'); return; }
  if(state.staff.some(s=>s.name.toLowerCase()===name.toLowerCase())){ toast('Un membre du personnel avec ce nom existe déjà.'); return; }
  state.staffCounter++;
  const matricule = 'MP-STAFF-' + String(state.staffCounter).padStart(4,'0');
  const codeId = 'ID-' + String(state.staffCounter).padStart(4,'0') + '-' + shortSuffix();
  const validation = new Date().toLocaleDateString('fr-FR');
  const photo = pendingStaffPhoto || null;
  state.staff.push({name, profession, password, tel, matricule, codeId, validation, photo});
  state.activeStaffCard = state.staff.length - 1;
  pendingStaffPhoto = null;
  const photoInput = document.getElementById('new-staff-photo');
  if(photoInput) photoInput.value = '';
  const previewEl = document.getElementById('new-staff-photo-preview');
  if(previewEl) previewEl.style.display = 'none';
  toast(`"${name}" ajouté au personnel — carte professionnelle générée`);
  renderPage();
}
function removeStaff(index){
  const st = state.staff[index];
  if(!st) return;
  state.staff.splice(index,1);
  if(state.activeStaffCard===index) state.activeStaffCard = null;
  toast(`"${st.name}" retiré du personnel`);
  renderPage();
}

const STAFF_CARD_W_MM = 70, STAFF_CARD_H_MM = 118; // format badge vertical imprimable

function staffCardFrontHTML(st, Wpx, Hpx){
  const topH = Math.round(Hpx*0.30);
  const photoW = Math.round(Wpx*0.46);
  const photoH = Math.round(photoW*1.15);
  const photoTop = Math.round(Hpx*0.335); // plus d'espace entre la tagline du logo et la photo
  // Le bloc de texte commence toujours APRÈS le bas de la photo (+ une petite marge),
  // jamais à une hauteur fixe : avant, une valeur fixe (0.60*Hpx) pouvait tomber
  // au-dessus du bas réel de la photo et le nom/poste s'affichait alors par-dessus
  // l'image au lieu d'être empilé dessous.
  const bottomTop = photoTop + photoH + Math.round(Hpx*0.018);
  const logoW = Math.round(Wpx*0.62);
  const nameSize = Math.max(10, Math.round(Wpx*0.072));
  const roleSize = Math.max(7, Math.round(Wpx*0.046));
  const infoSize = Math.max(6.5, Math.round(Wpx*0.0345));
  const photoIconSize = Math.round(photoW*0.32);
  const photoBorder = Math.max(3, Math.round(Wpx*0.018));
  return `
  <div style="position:relative; width:${Wpx}px; height:${Hpx}px; background:#fff; overflow:hidden; font-family:Arial, sans-serif; border:1px solid #E2E8F0; box-sizing:border-box;">
    <div style="position:absolute; top:0; left:0; right:0; height:${topH}px; background:#ffffff;"></div>
    <div style="position:absolute; top:${topH}px; left:0; right:0; bottom:0; background:linear-gradient(160deg,#1E4870,#122E45);"></div>
    <div style="position:absolute; top:${Math.round(Hpx*0.035)}px; left:0; right:0; text-align:center;">
      <img src="${STAFF_CARD_LOGO_B64}" style="width:${logoW}px;">
    </div>
    <div style="position:absolute; top:${photoTop}px; left:${Math.round((Wpx-photoW)/2)}px; width:${photoW}px; height:${photoH}px; border-radius:${Math.round(Wpx*0.04)}px; border:${photoBorder}px solid #EFC24B; box-shadow:0 4px 14px rgba(0,0,0,.25); overflow:hidden; background:#f2f3f5; display:flex; align-items:center; justify-content:center;">
      ${st.photo ? `<img src="${st.photo}" style="width:100%; height:100%; object-fit:cover;">` : `<div style="font-size:${photoIconSize}px; color:#c7ccd4;">👤</div>`}
    </div>
    <div style="position:absolute; left:0; right:0; bottom:0; top:${bottomTop}px; padding:${Math.round(Hpx*0.012)}px ${Math.round(Wpx*0.07)}px ${Math.round(Hpx*0.016)}px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; text-align:center; color:#fff; overflow:hidden;">
      <div style="font-weight:800; font-size:${nameSize}px; color:#F4C430; letter-spacing:.4px; text-transform:uppercase; line-height:1.12;">${st.name}</div>
      <div style="font-weight:800; font-size:${roleSize}px; color:#fff; text-transform:uppercase; margin-top:${Math.round(Hpx*0.004)}px;">${st.profession}</div>
      <div style="width:86%; height:1px; background:rgba(255,255,255,.5); margin:${Math.round(Hpx*0.013)}px 0;"></div>
      <div style="width:100%; text-align:left; font-size:${infoSize}px; line-height:1.62;">
        <div>🪪 <b>Matricule :</b> ${st.matricule}</div>
        <div>🔑 <b>Code ID :</b> ${st.codeId}</div>
        <div>📞 <b>Téléphone :</b> ${st.tel}</div>
        <div>✅ <b>Validation :</b> ${st.validation}</div>
      </div>
    </div>
    <div style="position:absolute; left:0; width:80%; bottom:${Math.round(Hpx*0.015)}px; height:3px; background:linear-gradient(90deg,#E2802E,#F4C430);"></div>
  </div>`;
}

// Lecture + compression d'une photo choisie par l'utilisateur (garde le fichier léger pour la synchronisation)
function readAndCompressImage(file, maxDim=420, quality=0.85){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
let pendingStaffPhoto = null;
async function previewStaffPhoto(input){
  const file = input.files && input.files[0];
  const previewEl = document.getElementById('new-staff-photo-preview');
  if(!file){ pendingStaffPhoto = null; if(previewEl) previewEl.style.display='none'; return; }
  try{
    pendingStaffPhoto = await readAndCompressImage(file);
    if(previewEl){ previewEl.src = pendingStaffPhoto; previewEl.style.display='inline-block'; }
  }catch(e){ console.error('Erreur lecture photo', e); toast('Impossible de lire cette photo.'); }
}

async function generateStaffCardPDFBlob(st){
  const PX_PER_MM = 8;
  const Wpx = STAFF_CARD_W_MM*PX_PER_MM, Hpx = STAFF_CARD_H_MM*PX_PER_MM;
  const holder = document.createElement('div');
  holder.style.position = 'fixed';
  holder.style.top = '0';
  holder.style.left = '0';
  holder.style.zIndex = '-9999';
  holder.style.width = Wpx+'px';
  holder.style.height = Hpx+'px';
  holder.innerHTML = staffCardFrontHTML(st, Wpx, Hpx);
  document.body.appendChild(holder);
  try{
    const imgs = Array.from(holder.querySelectorAll('img'));
    await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(res=>{ img.onload = res; img.onerror = res; })));
    await new Promise(res => setTimeout(res, 60));
    const canvas = await html2canvas(holder, { scale:3, backgroundColor:'#ffffff', useCORS:true });
    if(canvas.width===0 || canvas.height===0) throw new Error('Rendu vide');
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:[STAFF_CARD_W_MM, STAFF_CARD_H_MM], orientation:'portrait' });
    pdf.addImage(imgData, 'PNG', 0, 0, STAFF_CARD_W_MM, STAFF_CARD_H_MM);
    return pdf.output('blob');
  } finally {
    document.body.removeChild(holder);
  }
}
async function downloadStaffCardPDF(index){
  const st = state.staff[index];
  if(!st) return;
  toast('Préparation du PDF…');
  try{
    const blob = await generateStaffCardPDFBlob(st);
    const filename = `Carte-${st.matricule}-${st.name.replace(/\s+/g,'_')}.pdf`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Carte PDF téléchargée — prête à imprimer.');
  }catch(e){
    console.error('Erreur génération carte PDF', e);
    toast('Impossible de générer le PDF sur cet appareil.');
  }
}
function normPhoneForWa(tel){
  let t = String(tel||'').replace(/[^\d+]/g,'');
  if(t.startsWith('+')) t = t.slice(1);
  else if(t.startsWith('00')) t = t.slice(2);
  else if(/^7\d{8}$/.test(t)) t = '221' + t; // numéro sénégalais local → indicatif +221
  return t;
}

let __mediaRecorder = null;
let __audioChunks = [];
// Moteur d'enregistrement vocal générique : chaque endroit de l'appli (vente,
// panier boutique, réclamation…) l'utilise avec son propre bouton et sa propre
// façon d'enregistrer le résultat — pour toujours finir dans SA PROPRE collection
// Firestore dédiée, jamais dans le document partagé (même principe que les images
// du catalogue et les notes de factures : éviter de dépasser la limite de 1 Mo).
async function recordVoiceNote(btnId, onResult){
  const btn = document.getElementById(btnId);
  if(__mediaRecorder && __mediaRecorder.state === 'recording'){
    __mediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    __audioChunks = [];
    const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    const mimeType = candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    __mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
    __mediaRecorder.ondataavailable = e => { if(e.data.size>0) __audioChunks.push(e.data); };
    __mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      const usedType = __mediaRecorder.mimeType || mimeType || 'audio/webm';
      const blob = new Blob(__audioChunks, {type: usedType});
      const reader = new FileReader();
      reader.onload = () => onResult(reader.result);
      reader.readAsDataURL(blob);
    };
    __mediaRecorder.start();
    if(btn){ btn.textContent = '⏹️ Arrêter l\'enregistrement'; }
    toast('Enregistrement en cours… appuyez à nouveau pour arrêter.');
  }catch(e){
    toast("Impossible d'accéder au micro — vérifiez les autorisations du navigateur.");
  }
}

function handleSaleImages(fileList){
  const files = Array.from(fileList || []);
  if(files.length === 0) return;
  let remaining = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 800;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          const scale = maxDim / Math.max(w,h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.saleDraft.noteImages = state.saleDraft.noteImages || [];
        state.saleDraft.noteImages.push(canvas.toDataURL('image/jpeg', 0.7));
        remaining--;
        if(remaining===0) renderPage();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function validateSale(){
  const d = state.saleDraft;
  const pt = state.points.find(p=>p.loc===d.point);
  const needsPoste = pt && pt.postes && pt.postes.length>0;
  if(!d.items || d.items.length===0){ toast('Ajoutez au moins un produit à la facture avant de valider.'); return; }
  if(d.quick) d.suivi = false; // le reçu rapide ne crée jamais de suivi de commande
  const totalCheck = saleItemsTotal(d.items);
  if(d.quick && totalCheck > 1490){ toast('Le reçu rapide est limité à 1 490 FCFA — décochez "Reçu rapide" pour faire une facture complète.'); return; }
  if(!d.quick && !d.client){ toast('Merci de compléter tous les champs de la vente.'); return; }
  const isPhotocopie = d.items.every(i=>(i.produit||'').toLowerCase().includes('photocopie'));
  if(!d.quick && !isPhotocopie && (!d.clientTel || !d.clientTel.trim())){ toast('Le numéro de téléphone du client est obligatoire.'); return; }
  if(d.suivi && (!d.adresse || !d.adresse.trim())){ toast("L'adresse / localité de livraison est obligatoire pour une commande suivie."); return; }
  if(needsPoste && !d.poste){ toast('Merci de choisir le poste exact (ex : Keur Massar, Jaxaay…).'); return; }
  const items = d.items.map(i=>({produit:i.produit, prix:i.prix, qty:i.qty}));
  const total = saleItemsTotal(items);
  const qtyTotal = items.reduce((s,i)=>s+i.qty,0);
  const avance = Math.min(Math.max(0, parseInt(d.avance)||0), total);
  const restant = total - avance;
  const clientName = (d.client && d.client.trim()) ? d.client.trim() : (d.quick ? 'Client comptoir' : d.client);
  // Filet anti-doublon : certains vendeurs, voyant l'icône de synchro rester sur 🟡/🔴
  // quelques instants (réseau lent), pensent que la vente n'a pas été enregistrée et la
  // ressaisissent en entier — ce qui crée deux factures pour la même vente. On repère
  // ici une facture quasi identique (même point, même client, mêmes produits, même
  // montant) créée il y a moins de 10 minutes, et on demande confirmation avant de
  // continuer plutôt que de dupliquer silencieusement.
  const justNow = Date.now();
  const dup = (state.ventes||[]).find(v=>
    v.statut!=='annulee' && v.point===d.point && (v.client||'')===clientName && v.total===total &&
    (justNow - (v.ts||0)) < 10*60*1000 &&
    JSON.stringify((v.items||[]).map(i=>i.produit+'x'+i.qty).sort()) === JSON.stringify(items.map(i=>i.produit+'x'+i.qty).sort())
  );
  if(dup){
    const minutes = Math.max(1, Math.round((justNow - (dup.ts||0))/60000));
    const confirmDouble = window.confirm(`⚠️ Une facture très similaire (${dup.numero}, ${money(dup.total)}, ${dup.client||'—'}) a déjà été enregistrée il y a ${minutes} min.\n\nSi la sync affichait 🟡/🔴, la vente a quand même été sauvegardée localement — pas besoin de la ressaisir.\n\nVoulez-vous quand même créer une NOUVELLE facture séparée ?`);
    if(!confirmDouble){ toast(`Facture non créée — la précédente (${dup.numero}) est déjà enregistrée.`); return; }
  }
  state.invoiceCounter++;
  const invoice = {
    numero: 'MP-2026-' + state.invoiceCounter + '-' + shortSuffix(), date: new Date().toLocaleString('fr-FR'), ts: Date.now(),
    point: d.point, poste: needsPoste ? d.poste : '',
    items, produit: items.map(i=>i.produit).join(', '), qty: qtyTotal, prix: items.length===1 ? items[0].prix : 0,
    total, client: clientName, clientTel: d.clientTel.trim(), avance, restant, paiement: d.paiement,
    // Historique des encaissements de cette facture (avance initiale + paiements du restant
    // faits plus tard) : chacun garde SA propre date, pour que le tableau de bord compte
    // l'argent le jour où il est réellement encaissé, et non le jour de création de la facture.
    paiements: avance>0 ? [{montant: avance, ts: Date.now(), mode: d.paiement}] : [],
    vendeur: currentVendeurName(d.point), quick: !!d.quick,
    noteText: d.noteText||'', noteAudio: d.noteAudio||null, noteImages: (d.noteImages||[]).slice(),
  };
  state.lastInvoice = invoice;
  myOwnSaleNumeros.add(invoice.numero);
  state.ventes.unshift(invoice);
  saveInvoiceNote(invoice.numero, d.noteAudio, d.noteImages);
  items.forEach(i=>deductStockForSale(i.produit, i.qty));
  let trackingMsg = '';
  if(d.suivi){
    const tracking = invoice.numero; // même numéro que la facture : plus de confusion entre vente et suivi
    state.customerOrders.unshift({
      tracking, items: items.map(i=>({name:i.produit, prix:i.prix, qty:i.qty})), total,
      client:d.client, tel:d.clientTel.trim(), adresse:(d.adresse||'').trim(), point:d.point, paiement:d.paiement,
      avance, restant,
      status:'recue', progress:0, location:'', date:new Date().toLocaleString('fr-FR'), ts: Date.now(), source:'vente', livreur:'',
      delai: (d.delai||'').trim(), noteText: d.noteText||'', noteAudio: d.noteAudio||null, noteImages: (d.noteImages||[]).slice(),
    });
    invoice.tracking = tracking;
    invoice.delai = (d.delai||'').trim();
    trackingMsg = ` · Suivi avec le même numéro (${tracking})` + (d.delai ? ` · Délai annoncé : ${d.delai}` : '');
  }
  const earnedPoints = Math.floor(total / 1000);
  const client = findOrCreateClient(clientName, d.point);
  client.achats += 1;
  client.total += total;
  client.points += earnedPoints;
  state.saleDraft = {point:d.point, poste: needsPoste ? d.poste : '', produit:'', qty:1, prix:0, items:[], client:'', clientTel:'', adresse:'', avance:0, paiement:'Wave', suivi:false, delai:'', noteText:'', noteAudio:null, noteImages:[], quick:d.quick};
  toast((d.quick
    ? `Reçu rapide enregistré — ${money(total)} payé intégralement`
    : (restant>0
    ? `Vente enregistrée — avance ${money(avance)}, reste ${money(restant)} · ${client.name} gagne ${earnedPoints} point(s)`
    : `Vente enregistrée — payée intégralement · ${client.name} gagne ${earnedPoints} point(s) fidélité`)) + trackingMsg);
  renderPage();
  saveSharedState(true); // envoi immédiat : ne pas attendre le debounce pour une vente
}
function payRestant(numero, montant, mode){
  const v = state.ventes.find(x=>x.numero===numero);
  if(!v){ toast('Facture introuvable.'); return; }
  montant = Math.max(0, parseInt(montant) || 0);
  if(montant<=0){ toast('Merci de saisir un montant valide.'); return; }
  const modePaiement = ['Wave','Orange Money','Espèces','Virement'].includes(mode) ? mode : v.paiement;
  const restantAvant = v.restant || 0;
  const applied = Math.min(montant, restantAvant);
  // Si la facture existait avant l'ajout de cet historique, on reconstitue son premier
  // encaissement (l'avance déjà versée) à la date de création, avant d'ajouter celui-ci.
  if(!Array.isArray(v.paiements)) v.paiements = (v.avance>0) ? [{montant:v.avance, ts:v.ts, mode:v.paiement}] : [];
  // Le canal utilisé pour CE versement du restant (Wave, Orange Money, Espèces,
  // Virement) peut être différent du mode choisi à la création de la facture —
  // c'est pour ça qu'on le garde par paiement individuel plutôt que de toujours
  // reprendre v.paiement (qui ne reflète que le tout premier versement).
  v.paiements.push({montant: applied, ts: Date.now(), mode: modePaiement});
  v.avance = (v.avance || 0) + applied;
  v.restant = Math.max(0, restantAvant - applied);
  if(v.tracking){
    const order = state.customerOrders.find(o=>o.tracking===v.tracking);
    if(order){ order.avance = v.avance; order.restant = v.restant; }
  }
  saveSharedState(true);
  toast(v.restant>0
    ? `Paiement de ${money(applied)} (${modePaiement}) enregistré — reste ${money(v.restant)} sur la facture ${v.numero}`
    : `Facture ${v.numero} soldée intégralement (${modePaiement})`);
  renderPage();
}
function deductStockForSale(produitName, qty){
  const name = (produitName||'').toLowerCase();
  const item = state.stock.find(s => name.includes(s.name.toLowerCase()) || s.name.toLowerCase().includes(name));
  if(!item) return null;
  item.qty = Math.max(0, item.qty - qty);
  if(item.qty < item.threshold){
    toast(`⚠️ Stock "${item.name}" bas : ${item.qty} ${item.unit} restant(s)`);
  }
  commitStockDelta(item.id, -qty);
  return item;
}

function findOrCreateClient(name, point){
  name = (name||'').trim();

function adjustClientPoints(name, delta){
  const c = state.clients.find(cl=>cl.name===name);
  if(!c) return;
  c.points = Math.max(0, c.points + delta);
  toast(`${delta>0?'+':''}${delta} point(s) pour ${c.name} — total : ${c.points}`);
  renderPage();
}
function setClientPoints(name, value){
  const c = state.clients.find(cl=>cl.name===name);
  if(!c) return;
  const v = Math.max(0, parseInt(value) || 0);
  c.points = v;
  toast(`Points de ${c.name} mis à jour : ${c.points}`);
  renderPage();
}
function getViewedInvoice(){

function saveInvoiceEdits(numero){
  const v = state.ventes.find(x=>x.numero===numero);
  if(!v){ toast('Facture introuvable.'); return; }
  const client = (document.getElementById('edit-inv-client').value||'').trim();
  const clientTel = (document.getElementById('edit-inv-tel').value||'').trim();
  const avanceInput = Math.max(0, parseInt(document.getElementById('edit-inv-avance').value)||0);
  const paiement = document.getElementById('edit-inv-paiement').value;
  if(!client){ toast('Le nom du client est obligatoire.'); return; }
  // Les champs quantité/prix ne sont affichés que pour une facture à un seul produit ;
  // pour une facture multi-produits, on garde les articles (items) tels quels.
  const qtyEl = document.getElementById('edit-inv-qty');
  const prixEl = document.getElementById('edit-inv-prix');
  let qty = v.qty, prix = v.prix, total = v.total, items = v.items;
  if(qtyEl && prixEl){
    qty = Math.max(1, parseInt(qtyEl.value)||1);
    prix = Math.max(0, parseInt(prixEl.value)||0);
    total = prix * qty;
    if(items && items.length===1) items = [{produit:items[0].produit, prix, qty}];
  }
  const avance = Math.min(avanceInput, total);
  const restant = total - avance;
  Object.assign(v, {client, clientTel, qty, prix, total, items, avance, restant, paiement});
  if(v.tracking){
    const order = state.customerOrders.find(o=>o.tracking===v.tracking);
    if(order){
      Object.assign(order, {client, tel:clientTel, total, avance, restant, paiement});
      if(qtyEl && prixEl && order.items && order.items[0]){ order.items[0].qty = qty; order.items[0].prix = prix; }
    }
  }
  if(state.lastInvoice && state.lastInvoice.numero===numero) state.lastInvoice = v;
  state.editingInvoiceNumero = null;
  saveSharedState(true);
  toast(`Facture ${v.numero} mise à jour.`);
  renderPage();
}
// Annule une facture erronée (ex : double saisie, mauvais produit). On ne la
// supprime PAS physiquement : elle reste visible dans l'historique (marquée
// "Annulée") pour garder une trace, mais elle est exclue de tous les totaux
// et calculs (voir activeVentes()). Le stock déduit à la création est remis
// en rayon, et la commande suivie éventuellement liée est aussi annulée.
function cancelInvoice(numero){
  const v = state.ventes.find(x=>x.numero===numero);
  if(!v){ toast('Facture introuvable.'); return; }
  if(v.statut==='annulee'){ toast('Cette facture est déjà annulée.'); return; }
  const confirmCancel = window.confirm(`⚠️ Annuler la facture ${v.numero} (${money(v.total)} — ${v.client||'Client comptoir'}) ?\n\nElle restera visible dans l'historique (marquée "Annulée") mais ne comptera plus dans les totaux, et le stock sera remis en rayon.\n\nCette action n'est pas réversible.`);
  if(!confirmCancel) return;
  invoiceItems(v).forEach(it=>{
    const item = getProductStockInfo(it.produit);
    if(item){ item.qty = (item.qty||0) + (it.qty||0); commitStockDelta(item.id, it.qty||0); }
  });
  v.statut = 'annulee';
  v.annuleeLe = Date.now();
  v.annuleePar = currentVendeurName(v.point);
  if(v.tracking){
    const order = state.customerOrders.find(o=>o.tracking===v.tracking);
    if(order && order.status!=='annulee') order.status = 'annulee';
  }
  if(state.editingInvoiceNumero===numero) state.editingInvoiceNumero = null;
  saveSharedState(true);
  toast(`Facture ${v.numero} annulée.`);
  renderPage();
}

function printInvoice(){
  const inv = getViewedInvoice();
  if(!inv){ toast('Aucune facture à imprimer.'); return; }
  const printDoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${inv.quick?'Reçu':'Facture'} ${inv.numero}</title>
  <style>${INVOICE_CSS}</style></head><body>${invoiceHTML(inv)}</body></html>`;

  let iframe = document.getElementById('print-frame');
  if(iframe) iframe.remove();
  iframe = document.createElement('iframe');
  iframe.id = 'print-frame';
  iframe.style.position = 'fixed';
  iframe.style.right = '0'; iframe.style.bottom = '0'; iframe.style.width = '0'; iframe.style.height = '0'; iframe.style.border = '0';
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(printDoc);
  doc.close();

  const doPrint = () => {
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }catch(e){
      toast("Impossible d'ouvrir l'impression — merci d'autoriser les fenêtres contextuelles.");
    }
  };
  if(iframe.contentDocument && iframe.contentDocument.readyState === 'complete'){
    setTimeout(doPrint, 150);
  } else {
    iframe.onload = () => setTimeout(doPrint, 150);
  }
}
function copyTextFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
async function generateInvoicePDFBlob(inv){
  const holder = document.createElement('div');
  holder.style.position = 'fixed';
  holder.style.top = '0';
  holder.style.left = '0';
  holder.style.zIndex = '-9999';
  holder.style.background = '#fff';
  holder.style.width = '560px';
  holder.style.padding = '20px';
  holder.style.boxSizing = 'border-box';
  holder.innerHTML = `<style>${INVOICE_CSS}</style>${invoiceHTML(inv)}`;
  document.body.appendChild(holder);
  try{
    const imgs = Array.from(holder.querySelectorAll('img'));
    await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(res=>{ img.onload = res; img.onerror = res; })));
    await new Promise(res => setTimeout(res, 80));

    const canvas = await html2canvas(holder, { scale:2, backgroundColor:'#ffffff', useCORS:true });
    if(canvas.width === 0 || canvas.height === 0){ throw new Error('Rendu vide'); }
    const imgData = canvas.toDataURL('image/png');

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'pt', format:'a4' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const margin = 24;
    const usableWidth = pageWidth - margin*2;
    const imgHeight = (canvas.height * usableWidth) / canvas.width;
    pdf.addImage(imgData, 'PNG', margin, margin, usableWidth, imgHeight);
    return pdf.output('blob');
  } finally {
    document.body.removeChild(holder);
  }
}
async function shareInvoice(){
  const inv = getViewedInvoice();
  if(!inv){ toast('Aucune facture à partager.'); return; }
  const filename = `Facture-${inv.numero}.pdf`;
  toast('Préparation du PDF…');
  try{
    const blob = await generateInvoicePDFBlob(inv);
    const file = new File([blob], filename, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:`Facture ${inv.numero}`, text:`Facture ${inv.numero} — MPERFECT PUB` });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('PDF téléchargé — partagez-le depuis vos fichiers.');
  }catch(e){
    console.error('Erreur génération PDF', e);
    const text = `Facture ${inv.numero} — MPERFECT PUB\nPoint : ${inv.point}${inv.poste?' · '+inv.poste:''}\nClient : ${inv.client}\n${invoiceProductSummary(inv)}\nTotal : ${money(inv.total)}\nPaiement : ${inv.paiement}\nDate : ${inv.date}`;
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{ await navigator.clipboard.writeText(text); toast('PDF indisponible — facture copiée en texte.'); return; }catch(e2){}
    }
    if(copyTextFallback(text)){ toast('PDF indisponible — facture copiée en texte.'); return; }
    toast('Partage indisponible sur ce navigateur');
  }
}

/* Calcul automatique de la distance/durée/prix de livraison :
   - Géocodage (adresse texte -> coordonnées) via Nominatim (OpenStreetMap, gratuit, sans clé API),
     avec Photon (Komoot, aussi basé sur OpenStreetMap, gratuit sans clé) en service de secours si
     Nominatim ne répond pas ou est temporairement limité.
   - Calcul d'itinéraire routier (distance/durée réelles par la route) via OSRM (gratuit, sans clé API).
     Si OSRM est indisponible, on retombe sur une estimation à vol d'oiseau (distance à vol d'oiseau
     x 1.3 pour approximer les détours routiers), pour ne jamais laisser le livreur sans aucun chiffre.
   Le tout tourne directement dans le navigateur du livreur, sans backend ni clé à configurer. */
// Petit utilitaire : fetch avec timeout, pour ne pas rester bloqué si un service est en panne.
function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || 6000);
  return fetch(url, {...(options||{}), signal: controller.signal}).finally(()=>clearTimeout(timer));
}
// Distance à vol d'oiseau (formule de Haversine), en km.
function haversineKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLng = (b.lng - a.lng) * Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
async function geocodeViaNominatim(query){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=sn&q=${encodeURIComponent(query)}`;
  const res = await fetchWithTimeout(url, {headers:{'Accept':'application/json'}}, 6000);
  if(!res.ok) throw new Error('Nominatim HTTP '+res.status);
  const data = await res.json();
  if(data && data[0]) return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
  return null;
}
async function geocodeViaPhoton(query){
  const url = `https://photon.komoot.io/api/?limit=1&lat=14.7&lon=-17.4&q=${encodeURIComponent(query)}`;
  const res = await fetchWithTimeout(url, {headers:{'Accept':'application/json'}}, 6000);
  if(!res.ok) throw new Error('Photon HTTP '+res.status);
  const data = await res.json();
  const f = data && data.features && data.features[0];
  if(f && f.geometry && f.geometry.coordinates) return {lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0]};
  return null;
}
async function geocodeAddress(query){
  try{
    const r = await geocodeViaNominatim(query);
    if(r) return r;
  }catch(e){ console.error('Geocode error (Nominatim)', e); }
  // Service de secours si Nominatim échoue ou ne trouve rien.
  try{
    const r = await geocodeViaPhoton(query);
    if(r) return r;
  }catch(e){ console.error('Geocode error (Photon)', e); }
  return null;
}
async function fetchRouteKm(origin, dest){
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${origin.lng},${origin.lat};${dest.lng},${dest.lat}?overview=false`;
    const res = await fetchWithTimeout(url, {}, 6000);
    if(!res.ok) throw new Error('OSRM HTTP '+res.status);
    const data = await res.json();
    if(data && data.routes && data.routes[0]) return {km: data.routes[0].distance/1000, minutes: data.routes[0].duration/60, estimated:false};
  }catch(e){ console.error('Route error (OSRM)', e); }
  // OSRM indisponible : on retombe sur une estimation à vol d'oiseau majorée de 30%
  // pour approximer les détours routiers, plutôt que de ne rien afficher du tout.
  try{
    const km = haversineKm(origin, dest) * 1.3;
    if(km > 0) return {km, minutes: null, estimated:true};
  }catch(e){ console.error('Haversine fallback error', e); }
  return null;
}
async function computeAutoRoute(){
  const it = state.itineraire;
  if(!it || !it.open) return;
  const manual = (it.manualAdresse||'').trim();
  it.autoStatus = 'computing';
  renderPage();
  let origin = null;
  if(manual){
    origin = await geocodeAddress(manual + ', Sénégal');
  } else if(it.lat!=null && it.lng!=null){
    origin = {lat: it.lat, lng: it.lng};
  }
  if(!state.itineraire.open) return; // le livreur a fermé la fenêtre entre-temps
  if(!origin){ state.itineraire.autoStatus = 'error-geocode'; renderPage(); return; }
  // Priorité à l'adresse d'arrivée corrigée à la main par le livreur (si saisie) ;
  // sinon la position GPS partagée en direct par le client (plus précise qu'une
  // adresse écrite) ; sinon on géocode l'adresse texte de la commande.
  const manualDest = (it.manualDestAdresse||'').trim();
  let dest = null;
  if(manualDest){
    dest = await geocodeAddress(manualDest + ', Sénégal');
  } else if(it.destLat!=null && it.destLng!=null){
    dest = {lat: it.destLat, lng: it.destLng};
  } else {
    const destQuery = it.adresse + (it.point ? ', ' + it.point : '') + ', Sénégal';
    dest = await geocodeAddress(destQuery);
  }
  if(!state.itineraire.open) return;
  if(!dest){ state.itineraire.autoStatus = 'error-geocode'; renderPage(); return; }
  const route = await fetchRouteKm(origin, dest);
  if(!state.itineraire.open) return;
  if(!route){ state.itineraire.autoStatus = 'error-route'; renderPage(); return; }
  state.itineraire.distanceKm = Math.round(route.km*10)/10;
  state.itineraire.autoDurationMin = route.minutes!=null ? Math.max(1, Math.round(route.minutes)) : null;
  state.itineraire.autoStatus = route.estimated ? 'estimate' : 'ok';
  // On garde les coordonnées précises (pas seulement l'adresse texte) pour pouvoir
  // lancer le guidage vocal turn-by-turn au clic sur "Démarrer la course".
  state.itineraire.originCoord = origin;
  state.itineraire.destCoord = dest;
  // On enregistre la distance/durée/prix directement sur la commande, pour que le
  // client la voie ensuite dans "Suivre ma commande" côté boutique.
  if(it.tracking){
    const ds = state.deliverySettings;
    const price = ds.base + Math.round(state.itineraire.distanceKm * ds.perKm);
    const order = state.customerOrders.find(o=>o.tracking===it.tracking);
    if(order){
      order.livraisonDistanceKm = state.itineraire.distanceKm;
      order.livraisonDureeMin = state.itineraire.autoDurationMin;
      order.livraisonPrix = price;
      saveSharedState(true);
    }
  }
  renderPage();
}
function openItineraire(adresse, point, tracking, destLat, destLng){
  state.itineraire = {open:true, adresse, point, tracking: tracking||'', destLat: (destLat!=null && !isNaN(destLat)) ? destLat : null, destLng: (destLng!=null && !isNaN(destLng)) ? destLng : null, lat:null, lng:null, geoStatus:'loading', manualAdresse:'', manualDestAdresse:'', distanceKm:null, autoStatus:'idle', autoDurationMin:null, originCoord:null, destCoord:null, guidance:null};
  renderPage();
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        state.itineraire.lat = pos.coords.latitude;
        state.itineraire.lng = pos.coords.longitude;
        if(!state.itineraire.manualAdresse){ state.itineraire.geoStatus = 'ok'; computeAutoRoute(); }
        renderPage();
      },
      ()=>{ if(!state.itineraire.manualAdresse) state.itineraire.geoStatus = 'denied'; renderPage(); },
      {enableHighAccuracy:true, timeout:8000}
    );
  } else {
    state.itineraire.geoStatus = 'unsupported';
    renderPage();
  }
}
function closeItineraire(){
  stopCourse();
  state.itineraire.open = false;
  renderPage();
}
/* ===================== Guidage vocal (course en cours) =====================
   Une fois l'itinéraire calculé, le livreur peut appuyer sur "Démarrer la
   course" : on récupère le tracé détaillé (étapes) auprès d'OSRM, puis on
   suit sa position GPS en direct (watchPosition) pour annoncer chaque
   manœuvre à la voix (SpeechSynthesis) au fur et à mesure qu'il l'atteint,
   jusqu'à l'arrivée chez le client. Tout tourne dans le navigateur, sans
   backend ni clé API. */
function speakText(text){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.98;
    window.speechSynthesis.speak(u);
  }catch(e){ console.error('Speech error', e); }
}
// Traduit une manœuvre OSRM (type/modifier, en anglais) en instruction vocale en français.
function maneuverToText(step, isLast){
  const name = (step.name || '').trim();
  const onStreet = name ? ` sur ${name}` : '';
  if(isLast) return "Vous arrivez à destination.";
  const m = step.maneuver || {};
  const type = m.type, mod = m.modifier;
  if(type === 'depart') return `C'est parti${onStreet ? ', direction' + onStreet : ''}.`;
  if(type === 'arrive') return "Vous êtes arrivé à destination.";
  if(type === 'roundabout' || type === 'rotary'){
    const exit = m.exit ? `, ${m.exit}ᵉ sortie` : '';
    return `Au rond-point${exit}${onStreet}.`;
  }
  const modText = {
    'left':'à gauche', 'right':'à droite', 'sharp left':'fortement à gauche', 'sharp right':'fortement à droite',
    'slight left':'légèrement à gauche', 'slight right':'légèrement à droite', 'straight':'tout droit', 'uturn':'demi-tour'
  }[mod] || '';
  if(type === 'turn') return `Tournez ${modText}${onStreet}.`;
  if(type === 'new name' || type === 'continue') return `Continuez ${modText || 'tout droit'}${onStreet}.`;
  if(type === 'merge') return `Rejoignez la voie${onStreet}.`;
  if(type === 'fork') return `Prenez à ${modText || 'droite'}${onStreet}.`;
  if(type === 'end of road') return `Au bout de la route, tournez ${modText}${onStreet}.`;
  return `Continuez${onStreet}.`;
}
async function fetchRouteSteps(origin, dest){
  const url = `https://router.project-osrm.org/route/v1/driving/${origin.lng},${origin.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson&steps=true`;
  const res = await fetchWithTimeout(url, {}, 8000);
  if(!res.ok) throw new Error('OSRM HTTP '+res.status);
  const data = await res.json();
  const leg = data && data.routes && data.routes[0] && data.routes[0].legs && data.routes[0].legs[0];
  if(!leg) return null;
  return leg.steps.map((s,i)=>({
    lat: s.maneuver.location[1], lng: s.maneuver.location[0],
    distance: s.distance,
    text: maneuverToText(s, i === leg.steps.length-1)
  }));
}
async function startCourse(){
  const it = state.itineraire;
  if(!it || !it.open || it.guidance) return;
  if(!navigator.geolocation){ toast("⚠️ La géolocalisation n'est pas disponible sur cet appareil."); return; }
  it.guidance = {status:'loading', steps:null, stepIdx:0, watchId:null, remainingKm:it.distanceKm, totalKm: it.distanceKm||null, progressPct:0, muted:false, lastLat:null, lastLng:null};
  renderPage();
  let origin = it.originCoord, dest = it.destCoord;
  if(!origin || !dest){ toast("⚠️ Calculez d'abord l'itinéraire avant de démarrer la course."); it.guidance = null; renderPage(); return; }
  try{
    const steps = await fetchRouteSteps(origin, dest);
    if(!state.itineraire.open || !state.itineraire.guidance) return; // fermé entre-temps
    if(!steps || !steps.length){ toast('⚠️ Guidage détaillé indisponible pour cet itinéraire.'); state.itineraire.guidance = null; renderPage(); return; }
    state.itineraire.guidance.steps = steps;
    state.itineraire.guidance.status = 'active';
    renderPage();
    speakText(`Course démarrée. ${steps[0].text}`);
    startSpeechKeepAlive();
    maybePersistCourierPosition(true);
  }catch(e){
    console.error('startCourse error', e);
    if(state.itineraire.open){ toast('⚠️ Guidage vocal indisponible (service de routage injoignable).'); state.itineraire.guidance = null; renderPage(); }
    return;
  }
  const watchId = navigator.geolocation.watchPosition(
    pos=>onCourseGpsUpdate(pos.coords.latitude, pos.coords.longitude),
    ()=>{ toast('⚠️ Signal GPS perdu.'); },
    {enableHighAccuracy:true, maximumAge:2000, timeout:10000}
  );
  if(state.itineraire.guidance) state.itineraire.guidance.watchId = watchId;
}
// On évite de redéclencher un rendu complet de la page (et donc de recharger la
// carte Google Maps intégrée, de perdre le défilement, etc.) à chaque position GPS
// reçue — jusqu'à une toutes les 2 secondes pendant la course. On ne fait un rendu
// complet que lors d'un événement important (changement d'étape, arrivée), sinon au
// plus une fois toutes les 12 secondes ; entre-temps on met juste à jour la distance
// restante affichée directement dans le DOM (léger, ne touche pas à la carte).
let __lastGuidanceRenderTs = 0;
function onCourseGpsUpdate(lat, lng){
  const it = state.itineraire;
  const g = it && it.guidance;
  if(!g || g.status !== 'active' || !g.steps) return;
  g.lastLat = lat; g.lastLng = lng;
  const here = {lat, lng};
  let stepAdvanced = false;
  // Annonce la prochaine manœuvre quand on s'en approche (seuil ~40 m).
  const next = g.steps[g.stepIdx];
  if(next){
    const dNext = haversineKm(here, {lat:next.lat, lng:next.lng}) * 1000;
    if(dNext < 40){
      if(!g.muted) speakText(next.text);
      g.stepIdx++;
      stepAdvanced = true;
      if(g.stepIdx >= g.steps.length){
        // Dernière étape atteinte = arrivée chez le client.
        g.status = 'arrived';
        if(!g.muted) speakText('Vous êtes arrivé chez le client. Bonne livraison !');
        stopCourseWatch();
      }
    }
  }
  const dest = it.destCoord;
  if(dest) g.remainingKm = Math.round(haversineKm(here, dest) * 10) / 10;
  if(g.totalKm){
    g.progressPct = Math.max(0, Math.min(100, Math.round(100 * (1 - (g.remainingKm||0) / g.totalKm))));
  }
  // Envoie la position du livreur (et la progression) vers le serveur pour que le
  // client la voie en direct dans "Suivre ma commande" — voir maybePersistCourierPosition.
  maybePersistCourierPosition(stepAdvanced || g.status==='arrived');
  const now = Date.now();
  if(stepAdvanced || g.status==='arrived' || (now - __lastGuidanceRenderTs) > 12000){
    __lastGuidanceRenderTs = now;
    renderPage();
  } else {
    updateGuidanceLiveDOM(g);
  }
}
// Mise à jour légère (sans re-générer toute la page ni recharger la carte) de la
// distance restante affichée pendant la course.
function updateGuidanceLiveDOM(g){
  const el = document.getElementById('guidance-remaining-km');
  if(el) el.textContent = g.remainingKm!=null ? ('📏 ~'+g.remainingKm+' km restants jusqu\'à l\'arrivée') : '';
}
// Contourne un bug connu des navigateurs mobiles (Chrome/Android notamment) : la
// synthèse vocale s'arrête silencieusement de fonctionner après ~15s d'inactivité
// (sans erreur), ce qui donnait l'impression que "le guidage démarre puis s'arrête".
// On appelle resume() régulièrement pendant toute la course pour la garder active,
// même quand aucune nouvelle instruction n'a besoin d'être annoncée.
let __speechKeepAliveTimer = null;
function startSpeechKeepAlive(){
  stopSpeechKeepAlive();
  if(!('speechSynthesis' in window)) return;
  __speechKeepAliveTimer = setInterval(()=>{ try{ window.speechSynthesis.resume(); }catch(e){} }, 9000);
}
function stopSpeechKeepAlive(){
  if(__speechKeepAliveTimer){ clearInterval(__speechKeepAliveTimer); __speechKeepAliveTimer = null; }
}
// Envoie la position GPS en direct du livreur (+ sa progression) sur la commande
// partagée, pour que la boutique client la voie en temps réel. Throttlé (au plus
// une fois toutes les 6s, sauf événement important comme un changement d'étape,
// l'arrivée, ou le démarrage) pour ne pas bombarder le réseau/Firebase à chaque
// position GPS reçue (jusqu'à toutes les 2s).
let __lastCourierPersistTs = 0;
let __lastCourierPersistProgress = null;
function maybePersistCourierPosition(force){
  const it = state.itineraire;
  const g = it && it.guidance;
  if(!it || !g || !it.tracking || g.lastLat==null) return;
  const now = Date.now();
  const progressChanged = __lastCourierPersistProgress==null || Math.abs((g.progressPct||0) - __lastCourierPersistProgress) >= 3;
  if(!force && !progressChanged && (now - __lastCourierPersistTs) < 6000) return;
  __lastCourierPersistTs = now;
  __lastCourierPersistProgress = g.progressPct;
  const order = state.customerOrders.find(o=>o.tracking===it.tracking);
  if(!order) return;
  order.livreurLat = g.lastLat;
  order.livreurLng = g.lastLng;
  order.livreurTs = now;
  if(g.progressPct!=null) order.progress = g.progressPct;
  order.location = g.status==='arrived' ? 'Arrivé chez vous' : "En route vers chez vous";
  saveSharedState();
}
function stopCourseWatch(){
  const g = state.itineraire && state.itineraire.guidance;
  if(g && g.watchId != null && navigator.geolocation){
    navigator.geolocation.clearWatch(g.watchId);
    g.watchId = null;
  }
}
function stopCourse(){
  stopCourseWatch();
  stopSpeechKeepAlive();
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  if(state.itineraire) state.itineraire.guidance = null;
}
function toggleCourseMute(){
  const g = state.itineraire && state.itineraire.guidance;
  if(!g) return;
  g.muted = !g.muted;
  if(g.muted){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  renderPage();
}
function repeatCourseInstruction(){
  const g = state.itineraire && state.itineraire.guidance;
  if(!g || !g.steps) return;
  if(g.status === 'arrived'){ speakText('Vous êtes arrivé chez le client.'); return; }
  const step = g.steps[g.stepIdx];
  if(step) speakText(step.text);
}
function updateItineraireBoth(){
  const departEl = document.getElementById('itineraire-depart-input');
  const destEl = document.getElementById('itineraire-dest-input');
  state.itineraire.manualAdresse = departEl ? (departEl.value||'').trim() : (state.itineraire.manualAdresse||'');
  state.itineraire.manualDestAdresse = destEl ? (destEl.value||'').trim() : (state.itineraire.manualDestAdresse||'');
  state.itineraire.geoStatus = state.itineraire.manualAdresse ? 'manual' : (state.itineraire.lat!=null ? 'ok' : 'idle');
  renderPage();
  computeAutoRoute();
}
function updateItineraireDistance(value){
  state.itineraire.distanceKm = (value!=='' && value!=null) ? Math.max(0, parseFloat(value)||0) : null;
  state.itineraire.autoStatus = 'manual-override';
  renderPage();
  // Le livreur a corrigé la distance à la main : on met quand même à jour la
  // commande, pour que le client voie le prix le plus juste possible.
  const it = state.itineraire;
  if(it.tracking && it.distanceKm){
    const ds = state.deliverySettings;
    const price = ds.base + Math.round(it.distanceKm * ds.perKm);
    const order = state.customerOrders.find(o=>o.tracking===it.tracking);
    if(order){
      order.livraisonDistanceKm = it.distanceKm;
      order.livraisonPrix = price;
      saveSharedState(true);
    }
  }
}
function renderItineraireModal(){
  const it = state.itineraire;
  if(!it.open) return '';
  const manualDest = (it.manualDestAdresse||'').trim();
  const dest = manualDest ? encodeURIComponent(manualDest + ', Sénégal') : (it.destLat!=null && it.destLng!=null) ? `${it.destLat},${it.destLng}` : encodeURIComponent(it.adresse + (it.point ? ', ' + it.point : ''));
  const manual = (it.manualAdresse||'').trim();
  // Pendant une course en cours, on fait partir la carte de la position GPS
  // la plus récente (et non plus de la position figée au moment de l'ouverture)
  // pour que l'itinéraire affiché avance réellement avec le livreur.
  const live = (it.guidance && it.guidance.status==='active' && it.guidance.lastLat!=null) ? {lat:it.guidance.lastLat, lng:it.guidance.lastLng} : null;
  const saddrParam = manual ? encodeURIComponent(manual) : (live ? `${live.lat},${live.lng}` : (it.geoStatus==='ok' && it.lat!=null ? `${it.lat},${it.lng}` : null));
  const mapsUrl = saddrParam
    ? `https://www.google.com/maps?saddr=${saddrParam}&daddr=${dest}&output=embed`
    : `https://www.google.com/maps?q=${dest}&output=embed`;
  const ds = state.deliverySettings;
  const distanceKm = it.distanceKm;
  const hasEstimate = distanceKm && distanceKm > 0;
  const price = hasEstimate ? ds.base + Math.round(distanceKm * ds.perKm) : 0;
  const dureeMin = hasEstimate ? (it.autoDurationMin || Math.max(1, Math.round((distanceKm / ds.speedKmh) * 60))) : 0;
  return `
  <div class="itineraire-overlay" onclick="if(event.target===this) closeItineraire()">
    <div class="itineraire-panel">
      <div class="itineraire-head">
        <div>
          <div style="font-weight:700; color:var(--blue-900); font-size:15px;">🗺️ Itinéraire vers le client</div>
          <div style="font-size:12.5px; color:var(--text-muted); margin-top:2px;">${manualDest || (it.adresse + (it.point ? ', ' + it.point : ''))}${!manualDest && it.destLat!=null ? ' · <span style="color:var(--green); font-weight:700;">📍 position GPS partagée par le client</span>' : ''}</div>
        </div>
        <button type="button" class="btn" onclick="closeItineraire()">✕</button>
      </div>
      <div style="padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; background:#fafbfc;">
        <div style="display:flex; gap:8px;">
          <input type="text" id="itineraire-depart-input" value="${manual.replace(/"/g,'&quot;')}" placeholder="🔎 Point de départ (si le GPS ne marche pas)" style="flex:1; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; box-sizing:border-box;" onkeydown="if(event.key==='Enter'){ updateItineraireBoth(); }">
        </div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="itineraire-dest-input" value="${manualDest.replace(/"/g,'&quot;')}" placeholder="🔎 Point d'arrivée (adresse du client)" style="flex:1; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; box-sizing:border-box;" onkeydown="if(event.key==='Enter'){ updateItineraireBoth(); }">
        </div>
        <button type="button" class="btn orange" style="width:100%;" onclick="updateItineraireBoth()">📍 Localiser</button>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <input type="number" min="0" step="0.1" id="itineraire-distance-input" value="${distanceKm!=null?distanceKm:''}" placeholder="Distance calculée automatiquement…" style="width:170px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; box-sizing:border-box;" oninput="updateItineraireDistance(this.value)">
          <span style="font-size:11px; color:var(--text-muted);">km — calculée automatiquement, modifiable si besoin</span>
          ${it.autoStatus!=='computing' ? `<button type="button" class="btn sm" onclick="computeAutoRoute()">🔄 Recalculer</button>` : ''}
        </div>
      </div>
      ${it.geoStatus==='loading' && !manual ? `<div class="itineraire-status" style="color:var(--text-muted); background:#f8fafc;">📡 Localisation en cours…</div>` : ''}
      ${(it.geoStatus==='denied' || it.geoStatus==='unsupported') && !manual ? `<div class="itineraire-status" style="color:var(--orange-600); background:#fff7ed;">⚠️ Position GPS non disponible — tapez votre position de départ ci-dessus, ou autorisez la localisation pour un calcul automatique.</div>` : ''}
      ${it.autoStatus==='computing' ? `<div class="itineraire-status" style="color:var(--text-muted); background:#f8fafc;">📡 Calcul automatique de la distance en cours…</div>` : ''}
      ${it.autoStatus==='error-geocode' ? `<div class="itineraire-status" style="color:var(--orange-600); background:#fff7ed;">⚠️ Adresse introuvable (les services de géocodage ne répondent pas ou n'ont pas trouvé ce lieu) — vous pouvez saisir la distance manuellement ci-dessus, ou réessayer avec 🔄 Recalculer.</div>` : ''}
      ${it.autoStatus==='error-route' ? `<div class="itineraire-status" style="color:var(--orange-600); background:#fff7ed;">⚠️ Calcul de l'itinéraire impossible (service de routage indisponible) — vous pouvez saisir la distance manuellement ci-dessus, ou réessayer avec 🔄 Recalculer.</div>` : ''}
      ${it.autoStatus==='estimate' ? `<div class="itineraire-status" style="color:var(--orange-600); background:#fff7ed;">⚠️ Itinéraire routier indisponible — distance estimée à vol d'oiseau (approximative), corrigez-la ci-dessus si besoin.</div>` : ''}
      ${hasEstimate ? `<div class="itineraire-status" style="color:var(--blue-900); background:#eff6ff; font-weight:600;">⏱️ Durée estimée : ~${dureeMin} min · 💰 Prix indicatif de la course : ${money(price)} ${it.autoStatus==='ok' ? '· 📏 '+distanceKm+' km (calcul automatique)' : it.autoStatus==='estimate' ? '· 📏 '+distanceKm+' km (estimation à vol d\'oiseau)' : ''}</div>` : ''}
      ${hasEstimate && !it.guidance ? `<div style="padding:0 16px 12px;"><button type="button" class="btn green" style="width:100%; padding:12px; font-size:14px;" onclick="startCourse()">🚀 Démarrer la course — guidage vocal</button></div>` : ''}
      ${renderGuidancePanel(it)}
      <iframe title="Itinéraire" src="${mapsUrl}" loading="lazy" allowfullscreen></iframe>
    </div>
  </div>`;
}
function renderGuidancePanel(it){
  const g = it.guidance;
  if(!g) return '';
  if(g.status === 'loading'){
    return `<div class="guidance-panel"><div class="guidance-loading">📡 Préparation du guidage vocal…</div></div>`;
  }
  if(g.status === 'arrived'){
    return `<div class="guidance-panel guidance-arrived">
      <div class="guidance-instr">🎉 Vous êtes arrivé chez le client !</div>
      <button type="button" class="btn sm" onclick="stopCourse(); renderPage();">✕ Terminer le guidage</button>
    </div>`;
  }
  const step = g.steps && g.steps[g.stepIdx];
  return `<div class="guidance-panel">
    <div class="guidance-top">
      <span class="guidance-live-dot"></span> Course en cours — guidage vocal actif
    </div>
    <div class="guidance-instr">🔊 ${step ? step.text : 'En route…'}</div>
    <div class="guidance-sub" id="guidance-remaining-km">${g.remainingKm!=null ? '📏 ~'+g.remainingKm+' km restants jusqu\'à l\'arrivée' : ''}</div>
    <div class="guidance-actions">
      <button type="button" class="btn sm" onclick="repeatCourseInstruction()">🔁 Répéter</button>
      <button type="button" class="btn sm" onclick="toggleCourseMute()">${g.muted ? '🔇 Réactiver la voix' : '🔊 Couper la voix'}</button>
      <button type="button" class="btn sm" style="color:var(--red);" onclick="stopCourse(); renderPage();">⏹️ Arrêter</button>
    </div>
  </div>`;
}

/* ========================= VENDEURS ========================= */
function renderVendeurs(){
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const groupes = {};
  activeVentes().forEach(v=>{
    const key = v.vendeur + '||' + v.point;
    if(!groupes[key]) groupes[key] = {name: v.vendeur, point: v.point, ventesMois: 0, nbVentes: 0};
    groupes[key].nbVentes += 1;
    if(v.ts && v.ts>=monthStart) groupes[key].ventesMois += v.total;
  });
  const list = Object.values(groupes).sort((a,b)=>b.ventesMois-a.ventesMois);
  return `<div class="panel"><h3>Vendeurs</h3>
    <div class="table-wrap"><table><thead><tr><th>Nom</th><th>Point</th><th>Ventes du mois</th><th>Nombre de ventes</th></tr></thead>
    <tbody>${list.map(v=>`<tr><td style="font-weight:600;">${v.name}</td><td>${v.point}</td><td>${money(v.ventesMois)}</td><td>${v.nbVentes}</td></tr>`).join('')}</tbody></table></div>
    ${list.length===0 ? '<div class="empty" style="padding:10px 0;">Aucune vente enregistrée pour le moment</div>' : ''}
  </div>`;
}

/* ========================= RÉCLAMATIONS ========================= */
function updateReclamationField(field, value){
  state.reclamationDraft[field] = value;
  renderPage();
}
function submitReclamation(){
  const d = state.reclamationDraft;
  const client = (d.client||'').trim();
  const tel = (d.tel||'').trim();
  const motif = (d.motif||'').trim();
  if(!client || !motif){ toast('Merci de renseigner le client et le motif de la réclamation.'); return; }
  state.reclamationCounter++;
  state.reclamations.unshift({
    id: state.reclamationCounter, client, tel, point: d.point, motif,
    date: new Date().toLocaleString('fr-FR'), status:'ouverte',
  });
  saveReclamationNote(state.reclamationCounter, d.noteAudio);
  const pt = state.points.find(p=>p.loc===d.point);
  if(pt) pt.reclamations += 1;
  state.reclamationDraft = {client:'', tel:'', point: d.point, motif:'', noteAudio:null};
  toast('Réclamation enregistrée');
  renderPage();
  saveSharedState(true);
}
// Ouvre WhatsApp vers le numéro du client concerné pour le prévenir que sa
// réclamation vient d'être résolue (uniquement si un numéro a été renseigné).
function notifyReclamationResolvedWhatsApp(r){
  const phone = normPhoneForWa(r.tel);
  if(!phone) return;
  const msg = `Bonjour ${r.client||''}, votre réclamation chez MPERFECT PUB a bien été résolue. Merci de votre confiance !`;
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');
}
function resolveReclamation(id){
  const r = state.reclamations.find(x=>x.id===id);
  if(!r) return;
  r.status='resolue'; r.solution = r.solution || 'Prise en charge par le point de vente'; r.resolvedAt = new Date().toLocaleString('fr-FR');
  toast(`Réclamation #${id} marquée résolue`);
  renderPage();
  saveSharedState(true);
  if(r.tel) notifyReclamationResolvedWhatsApp(r);
}

}
