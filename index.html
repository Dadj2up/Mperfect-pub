function renderConfirmation(){
  const o = state.trackingResult;
  if(!o) return renderCatalogue();
  return `
  <div class="track-box" style="text-align:center;">
    <div style="font-size:40px;">✅</div>
    <h2 style="font-family:'Sora'; font-size:19px; font-weight:800; color:var(--blue-900); margin:10px 0 4px;">Commande confirmee</h2>
    <p style="color:var(--text-muted); font-size:13px;">Merci ${o.client}. Voici votre numero de suivi :</p>
    <div style="font-family:'Sora'; font-size:22px; font-weight:800; color:var(--orange-600); margin:10px 0 18px;">${o.tracking}</div>
    <button class="btn primary" onclick="state.trackingSearch='${o.tracking}'; findOrderByTracking();">Suivre ma commande</button>
  </div>`;
}
function renderDeliveryRoute(order){
  if(order.status!=='livraison' && order.status!=='livree') return '';
  const progress = order.status==='livree' ? 100 : (order.progress||0);
  const x1=30, x2=370, y=58;
  const cx = x1 + (x2-x1)*(progress/100);
  const depotLabel = 'Entrepôt Mperfect Pub — ' + (order.point || 'Dakar');
  const destLabel = order.adresse || 'Votre adresse';
  return `
  <div class="route-map">
    <div class="route-map-title">🗺️ Itinéraire de livraison en direct</div>
    <svg viewBox="0 0 400 110" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; display:block;">
      <line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <line x1="${x1}" y1="${y}" x2="${cx}" y2="${y}" stroke="var(--orange-500)" stroke-width="5" stroke-linecap="round"/>
      <text x="${x1}" y="${y-14}" font-size="20" text-anchor="middle">🏭</text>
      <text x="${x2}" y="${y-14}" font-size="20" text-anchor="middle">🏠</text>
      ${progress<100 ? `<text x="${cx}" y="${y-16}" font-size="24" text-anchor="middle">🚚</text>` : `<circle cx="${x2}" cy="${y}" r="8" fill="var(--green)"/>`}
    </svg>
    <div class="route-addr-row"><span>${depotLabel}</span><span title="${destLabel}">${destLabel}</span></div>
    <div class="route-progress-lbl" style="color:${progress<100?'var(--orange-600)':'var(--green)'};">
      ${progress<100 ? `🚚 ${progress}% du trajet — ${order.location || 'en route'}` : '🎉 Livrée à votre adresse'}
    </div>
  </div>`;
}
function renderTrackingTimeline(order){
  const steps = [
    {id:'recue', label:'Commande recue', icon:'🧾'},
    {id:'preparation', label:'En preparation', icon:'📦'},
    {id:'disponible', label:'Disponible', icon:'✅'},
    {id:'livraison', label:'En livraison', icon:'🚚'},
    {id:'livree', label:'Livree', icon:'🏠'},
  ];
  const idx = steps.findIndex(s=>s.id===order.status);
  return `
  <div class="timeline">
    ${steps.map((s,i)=>`
      <div class="tl-step ${i<idx?'done':''} ${i===idx?'active':''}">
        <div class="dot">${i<idx?'✓':s.icon}</div>
        <div class="lb">${s.label}</div>
      </div>`).join('')}
  </div>
  ${order.status==='disponible' ? `<div class="track-loc" style="background:var(--blue-100); color:var(--blue-700);">✅ Votre commande est disponible — prete a etre recuperee ou expediee</div>` : ''}
  ${order.status==='livraison' ? `<div class="track-loc">📍 ${order.location || 'Entrepot Mperfect Pub — Dakar'} — ${order.progress}% du trajet</div>` : ''}
  ${order.status==='livree' ? `<div class="track-loc" style="background:var(--green-bg); color:var(--green);">🎉 Livree chez ${order.client}, ${order.adresse}</div>` : ''}
  ${renderDeliveryRoute(order)}
  <div style="text-align:center; margin-top:16px;">
    <button class="btn sm" onclick="advanceOrder('${order.tracking}')">Simuler la prochaine etape (demo)</button>
  </div>`;
}
function renderSuivi(){
  return `
  <h2 style="font-family:'Sora'; font-size:19px; font-weight:800; color:var(--blue-900); margin-bottom:16px;">Suivre ma commande</h2>
  <div class="track-box">
    <div class="track-num">
      <input type="text" placeholder="Numero de suivi (ex : MP-TRK-48201-K7Q)" value="${state.trackingSearch}" oninput="state.trackingSearch=this.value" onkeydown="if(event.key==='Enter')findOrderByTracking()">
      <button class="btn orange" onclick="findOrderByTracking()">Rechercher</button>
    </div>
    ${state.trackingResult ? `
      <div class="order-card" style="margin-bottom:0;">
        <div class="id">${state.trackingResult.tracking}</div>
        <div style="color:var(--text-muted); margin-top:4px;">${state.trackingResult.items.map(i=>i.name+' ×'+i.qty).join(', ')} — ${money(state.trackingResult.total)}</div>
        ${state.trackingResult.delai ? `<div style="color:var(--orange-600); font-weight:600; margin-top:6px;">⏱️ Délai annoncé : ${state.trackingResult.delai}</div>` : ''}
      </div>
      ${renderTrackingTimeline(state.trackingResult)}
    ` : `<div class="empty">Entrez votre numero de suivi pour voir l etat de votre commande.</div>`}
    ${state.customerOrders.length ? `
      <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--line);">
        <div style="font-size:11.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:10px;">Commandes recentes (demo)</div>
        ${state.customerOrders.slice(0,3).map(o=>`<div class="order-card" style="cursor:pointer;" onclick="state.trackingSearch='${o.tracking}'; findOrderByTracking();"><span class="id">${o.tracking}</span> — ${money(o.total)}</div>`).join('')}
      </div>` : ''}
  </div>`;
}

/* ========================= NOTIFICATIONS DE VENTE (PDG) ========================= */
const NOTIF_PREF_KEY = 'mperfect-notif-enabled';
let swRegistration = null;
let sharedStateInitialized = false;
const myOwnSaleNumeros = new Set();

async function ensureServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  if(swRegistration) return swRegistration;
  try{
    const swCode = "self.addEventListener('notificationclick',function(e){e.notification.close();e.waitUntil(clients.matchAll({type:'window'}).then(function(list){for(const c of list){if('focus' in c) return c.focus();}}));});";
    const blobUrl = URL.createObjectURL(new Blob([swCode], {type:'application/javascript'}));
    swRegistration = await navigator.serviceWorker.register(blobUrl);
    return swRegistration;
  }catch(e){ console.error('Erreur service worker notifications', e); return null; }
}

function notificationsSupported(){
  return typeof Notification !== 'undefined';
}
function notificationsEnabled(){
  return notificationsSupported() && Notification.permission==='granted' && localStorage.getItem(NOTIF_PREF_KEY)==='1';
}
async function toggleSaleNotifications(){
  if(!notificationsSupported()){ toast("Les notifications ne sont pas prises en charge sur ce navigateur. Sur iPhone, ajoutez d'abord l'appli à l'écran d'accueil."); renderPage(); return; }
  if(Notification.permission==='granted' && localStorage.getItem(NOTIF_PREF_KEY)==='1'){
    localStorage.setItem(NOTIF_PREF_KEY, '0');
    toast('Notifications de vente désactivées.');
    renderPage();
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){
    await ensureServiceWorker();
    localStorage.setItem(NOTIF_PREF_KEY, '1');
    toast('Notifications de vente activées ✅');
  } else {
    localStorage.setItem(NOTIF_PREF_KEY, '0');
    toast('Notifications refusées — activez-les dans les réglages de votre téléphone pour ce site.');
  }
  renderPage();
}
async function showSaleNotification(v){
  if(!notificationsEnabled()) return;
  const title = `Nouvelle vente — ${money(v.total)}`;
  const body = `${v.vendeur} · ${v.produit} x${v.qty} · ${v.point}${v.poste ? ' ('+v.poste+')' : ''}`;
  try{
    const reg = await ensureServiceWorker();
    if(reg && reg.showNotification){
      reg.showNotification(title, {body, tag:v.numero});
      return;
    }
  }catch(e){ /* on retente en direct ci-dessous */ }
  try{ new Notification(title, {body}); }catch(e){ /* non supporté sur cet appareil */ }
}

/* ========================= ECRAN DE CONNEXION ========================= */
const AUTH_SESSION_KEY = 'mperfect-auth-session';
let authTab = 'role';

function setAuthTab(tab){
  authTab = tab;
  document.getElementById('auth-role-fields').style.display = tab==='role' ? 'flex' : 'none';
  document.getElementById('auth-staff-fields').style.display = tab==='staff' ? 'flex' : 'none';
  document.getElementById('auth-tab-role').style.background = tab==='role' ? '#0f2540' : '#f1f2f4';
  document.getElementById('auth-tab-role').style.color = tab==='role' ? '#fff' : '#0f2540';
  document.getElementById('auth-tab-staff').style.background = tab==='staff' ? '#0f2540' : '#f1f2f4';
  document.getElementById('auth-tab-staff').style.color = tab==='staff' ? '#fff' : '#0f2540';
  document.getElementById('auth-error').textContent = '';
}

function populateAuthGate(){
  const sel = document.getElementById('auth-role');
  if(sel) sel.innerHTML = Object.entries(ROLE_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  const staffSel = document.getElementById('auth-staff');
  if(staffSel){
    staffSel.innerHTML = state.staff.length
      ? state.staff.map(st=>`<option value="${st.name}">${st.name} — ${st.profession}</option>`).join('')
      : `<option value="">Aucun personnel enregistré</option>`;
  }
}

function checkAuthGate(){
  const pwdInput = document.getElementById('auth-pwd');
  const errEl = document.getElementById('auth-error');
  const entered = pwdInput.value;

  if(authTab === 'staff'){
    const staffSel = document.getElementById('auth-staff');
    const st = state.staff.find(s=>s.name===staffSel.value);
    if(!st){ errEl.textContent = 'Aucun personnel sélectionné.'; return; }
    if(entered !== st.password){
      errEl.textContent = 'Mot de passe incorrect.';
      pwdInput.value = ''; pwdInput.focus();
      return;
    }
    const role = /livreur/i.test(st.profession) ? 'livreur' : 'vendeur';
    sessionStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({role, staffName:st.name}));
    unlockApp(role, st.name);
    return;
  }

  const sel = document.getElementById('auth-role');
  const role = sel.value;
  const pwd = ROLE_PASSWORDS[role];
  if(pwd && entered !== pwd){
    errEl.textContent = 'Mot de passe incorrect.';
    pwdInput.value = '';
    pwdInput.focus();
    return;
  }
  sessionStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({role}));
  unlockApp(role);
}

function loadLocalRoleName(role){
  try{ return localStorage.getItem('mperfect-name-'+role) || ''; }catch(e){ return ''; }
}
function saveLocalRoleName(role, name){
  try{ localStorage.setItem('mperfect-name-'+role, name); }catch(e){}
}
function saveProfileName(value){
  value = (value||'').trim();
  if(!value){ toast('Merci de saisir un nom.'); return; }
  ROLE_NAMES[state.role] = value;
  saveLocalRoleName(state.role, value);
  toast('Nom enregistré sur cet appareil');
  renderPage();
}
function unlockApp(role, staffName){
  state.role = role;
  state.__staffName = staffName || '';
  if(staffName){
    ROLE_NAMES[role] = staffName;
  } else {
    // pas de profil "Personnel" sélectionné (connexion par mot de passe de rôle) :
    // on réutilise le nom que cette personne avait déjà enregistré sur cet appareil.
    const saved = loadLocalRoleName(role);
    if(saved) ROLE_NAMES[role] = saved;
  }
  const allowed = MENU.filter(m=>m.roles.includes(role));
  if(!allowed.find(m=>m.id===state.page)) state.page = allowed[0].id;
  const gate = document.getElementById('auth-gate');
  if(gate) gate.style.display = 'none';
  renderAll();
  startPresenceHeartbeat();
}

(async function init(){
  populateAuthGate();
  await loadState();
  populateAuthGate();
  renderAll();
  listenToSharedState();
  listenToPresence();
  const savedSession = sessionStorage.getItem(AUTH_SESSION_KEY);
  if(savedSession){
    try{
      const {role, staffName} = JSON.parse(savedSession);
      if(role && ROLE_LABELS[role]) unlockApp(role, staffName);
    }catch(e){ sessionStorage.removeItem(AUTH_SESSION_KEY); }
  }
  if(new URLSearchParams(location.search).get('boutique')==='1'){
    toggleMode('boutique');
    const gate = document.getElementById('auth-gate');
    if(gate) gate.style.display = 'none';
  }
})();
</script>
